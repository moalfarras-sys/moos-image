# =============================================================================
# build.yml — build, push and sign the MoOS bootc image
# =============================================================================
# Pattern: redhat-actions buildah/push (one coherent pattern; do NOT mix with
# docker/build-push-action). Modeled on ublue-os/image-template build.yml.
#
# REQUIRED ONE-TIME SETUP (before the first run):
#   1. Generate a cosign keypair locally (WSL2 or any shell with cosign):
#        cosign generate-key-pair
#      -> produces cosign.key (PRIVATE — never commit; it is in .gitignore)
#         and cosign.pub (COMMIT this to the repo root).
#   2. Add the private key as a repo Actions secret named SIGNING_SECRET:
#        gh secret set SIGNING_SECRET < cosign.key
#      (or GitHub UI: Settings -> Secrets and variables -> Actions).
#   3. First successful push creates the GHCR packages; set their visibility to
#      Public (GitHub UI -> Packages -> moos / moos-nvidia -> Package settings).
#
# Output (one per matrix variant, each tagged latest + YYYYMMDD, signed):
#   ghcr.io/<owner>/moos         (base: ghcr.io/ublue-os/kinoite-main:44)
#   ghcr.io/<owner>/moos-nvidia  (same kinoite-main base + layered NVIDIA open driver)
# Both variants build from the same Containerfile and its one pinned base. The
# build argument selects only an exact NVIDIA akmods stage, never another base.
# =============================================================================

name: Build MoOS image

on:
  push:
    branches:
      - main
  schedule:
    # Daily rebuild (06:00 UTC) to pick up Fedora/uBlue base security updates
    # promptly — same cadence as ublue-os/image-template.
    - cron: "0 6 * * *"
  workflow_dispatch:

# Note on concurrency: both matrix variants (moos, moos-nvidia) run inside the
# SAME workflow run, and this group is keyed per run context — so a newer run
# cancels a superseded older run, while the two matrix jobs of one run never
# cancel each other. Do NOT add per-job concurrency.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push-sign:
    name: Build, push and sign (${{ matrix.image_name }})
    runs-on: ubuntu-latest
    # A buildah layer build + push + sign is well under an hour; cap it so a
    # wedged dnf5/registry step fails instead of holding a runner for 6h — and
    # this job runs three times over the matrix, so the default would be 18h.
    timeout-minutes: 60
    strategy:
      # Build both variants to completion independently: an nvidia base-image
      # failure must not kill the main image build (and vice versa).
      fail-fast: false
      matrix:
        # Both editions build from the SAME base, which is pinned in the Containerfile (it is
        # an invariant, not a knob — see the comment there). moos-nvidia used to build from
        # ghcr.io/ublue-os/kinoite-nvidia:44, which upstream abandoned in May, so the "NVIDIA
        # image" was really a six-week-old system, ~589 packages behind the generic one.
        # The only thing that differs here now is whether the NVIDIA driver is layered on.
        # moos-cloud is the third image from that same tree and that same base: a
        # VPS edition with no gaming stack, no Android layer, SSH as the front
        # door, a serial console for the provider's rescue, and effects tuned for
        # software rendering. It layers no driver either, so it takes the same
        # scratch akmods stage the generic image does. One repository, one gate
        # suite, one signing key — see MOOS_CLOUD_PLAN.md §1 for why it is a third
        # matrix row and not a second project.
        include:
          - image_name: moos
            nvidia: "false"
          - image_name: moos-nvidia
            nvidia: "true"
          - image_name: moos-cloud
            nvidia: "false"
    permissions:
      contents: read      # checkout
      packages: write     # push to GHCR
      id-token: write     # sigstore/cosign OIDC (kept for future keyless mode)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest ships only ~14 GB free on /, and the NVIDIA driver + i686
      # multilib + supergfxctl transaction alone needs ~1.1 GB at install time.
      # As MoOS grew (16 themes, wallpapers, Mo AI), the buildah overlay crept up
      # until that transaction no longer fit and dnf5 aborted with "needs NNN MB
      # more space on the / filesystem" (build 29928182488). Reclaim the runner's
      # pre-baked toolchains up front — the same step build-disk.yml and
      # build-iso.yml already run — to give the image build ~23 GB of headroom.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          # Keep swap: buildah + dnf5 are memory-heavy and we only need ~2 GB of
          # disk, which the caches above already reclaim many times over.
          swap-storage: false

      # The repo gates, before a single layer is built.
      #
      # They were not running anywhere. build.sh runs the in-image identity gate, but the
      # tests under tests/ were never wired into CI or into `just build` — so every "a gate
      # now guards this" a session wrote could rot silently, on a repo whose image lands on
      # the maintainer's daily driver. They take seconds and need no container, so a broken
      # Mo AI button or a dead Konsole key now fails in the first 20 seconds of the run
      # instead of shipping.
      # verify_visuals.py opens the shipped PNG/JPG masters with Pillow; the
      # stock runner has no PIL, so install it before the gates run (apt avoids
      # PEP-668's externally-managed pip refusal on ubuntu-latest).
      - name: Gate dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil

      - name: Repo gates
        run: |
          bash -n build_files/build.sh
          python3 tests/verify_user_experience.py
          python3 tests/test_device_plan.py
          python3 tests/test_moai_do.py
          python3 tests/test_moai_control.py
          # moos-open's session/logout and session/power hardcoded `qdbus6`, absent on Plasma 6
          # (which ships qdbus-qt6), so they confirmed then silently did nothing. This asserts the
          # qdbus_run resolver finds qdbus-qt6 and the session routes use it.
          python3 tests/test_moos_open_qdbus.py
          python3 tests/test_moai_http_security.py
          # The gateway must not leave a chat reply hanging: a mid-stream upstream drop has to close
          # the connection (not swallow the error and keep-alive), and Anthropic error/truncation
          # events must be surfaced with [DONE] rather than read as a blank finished reply.
          python3 tests/test_moai_gateway_streaming.py
          python3 tests/test_exec_bits.py
          # This one guards THIS job specifically: nothing here runs `npm run build`, so the web UI
          # in the image is whatever is committed under moremote/agent/wwwroot — and .gitignore hides
          # that directory, so a rebuilt bundle silently fails to land. Serving index.html for a
          # missing script is a 200, not a 404, so the symptom is a blank page and a green build.
          python3 tests/test_shipped_bundle_is_tracked.py
          # These three were in the Justfile only, so they could not fail a build. The cloud edition
          # is one of the three images this matrix publishes; its two gates belong here.
          python3 tests/test_moos_cloud_audio.py
          python3 tests/test_cloud_private_desktop.py
          # A cloud account with no PIN answers /api/setup to whoever reaches it first, and one with
          # a forgotten PIN has no way back in at all. Both are silent on a healthy-looking server.
          python3 tests/test_cloud_set_pin.py
          # moos-cloud-dev wrote an inverted subuid range (100000-65535) that usermod rejects,
          # aborting a tenant half-created; a fixed range would instead make two tenants share host
          # UIDs. This asserts the allocation is valid and uid-derived (unique).
          python3 tests/test_cloud_subid_range.py
          # Recovery must name the PRIOR deployment as the rollback target, never a staged (pending)
          # update — rpm-ostree lists a staged update at index 0, so "first non-booted" pointed the
          # rescue screen at the newer version, the opposite of what rollback does.
          python3 tests/test_recovery_rollback_target.py
          # The Mo AI per-user port generator must fail CLOSED: no account but uid 1000 may resolve to
          # the base ports 8080/8079/8077, or the 11th cloud tenant reaches uid 1000's key-holding
          # gateway. The old guard exited without printing for uid>=1010, which fell back to the base.
          python3 tests/test_moai_ports_fail_closed.py
          python3 tests/test_mo_remote_codec_resend.py
          # The H.264->JPEG fallback latch was dead code: `if not pick_h264()` tests a 2-tuple that is
          # always truthy, and the mid-stream blacklist keyed the instance name 'enc' and called
          # dict.add(). Without it, a host that cannot start H.264 froze ~4s on every rebuild.
          python3 tests/test_remote_h264_fallback.py
          # Mo PC Remote's feel over cellular is decided by three lines of kernel tuning, and both
          # ways they can fail are silent: a congestion control selected but never registered
          # (machine stays on cubic, nobody is told), and a mistyped key (skipped with a warning
          # nobody reads). Cheap to check, invisible when it breaks.
          python3 tests/test_kernel_network_tuning.py
          # One connecting phone used to rebuild the encode pipeline four times in two seconds:
          # the picture appears, blanks, appears, blanks, appears. Reads as a bad link; is not one.
          python3 tests/test_remote_rebuild_debounce.py
          # Injecting input used to run on the socket-reading thread, so every ping queued behind
          # every click — and the auto-quality ladder reads those pongs, so USING the remote made
          # it lower its own picture quality. Measured on loopback: 0.7ms idle, 133ms after 5 clicks.
          python3 tests/test_input_off_socket_thread.py
          # The picture ceiling (1920@30 was a constant, not a hardware limit) and the rule that
          # makes raising it safe: a cached client that only speaks `scale` must keep the old one.
          python3 tests/test_remote_resolution_ceiling.py
          # The desktop's sound was enabled only on the cloud edition (so the Sound button 404'd
          # on a desktop) and the service has no auth, so it must bind loopback — both together.
          python3 tests/test_desktop_sound_reachable.py
          python3 tests/test_moos_store_index.py
          python3 tests/test_moos_storectl.py
          python3 tests/test_moos_ui2.py
          python3 tests/test_moos_theme_safety.py
          python3 tests/test_moos_visual_system.py
          # Skips on the runner (no Qt); its string half lives in
          # verify_user_experience.py and does run here. Kept in the list so the
          # gate is never forgotten when the runner image gains Qt.
          python3 tests/test_moos_motion_gate.py
          python3 tests/test_fwupd_refresh_policy.py
          python3 artwork/verify_visuals.py
          # The store-chain gate also runs inside the image build (build.sh), where
          # it reads the finished /usr. It supports MOOS_TEST_ROOT, so run it here
          # too: a catalogue/recipe/route drift should cost 3 seconds, not a
          # 20-minute image build that fails at its last stage.
          MOOS_TEST_ROOT=system_files python3 build_files/verify_store_catalog.py

      # GHCR requires a lowercase namespace; github.repository_owner may
      # contain uppercase letters.
      - name: Resolve registry and tags
        id: meta
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "date_tag=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # The NVIDIA kmod is compiled against ONE exact kernel. Pin the akmods image to the
      # kernel the base image actually ships (its `ostree.linux` label) rather than to the
      # floating tag the Containerfile falls back to — a kmod paired with a kernel it was not
      # built for does not load, and the machine boots to a black screen. If ublue has not
      # published an akmod for this kernel yet, the build fails HERE rather than shipping an
      # unbootable image. (build.sh independently refuses to continue on a mismatch, so this
      # is defence in depth, not the only guard.)
      #
      # The generic edition resolves to `scratch`: it never pulls the akmods image at all, so
      # an upstream NVIDIA hiccup can never block the main image.
      - name: Resolve NVIDIA akmods image
        id: akmods
        env:
          # Must match the base pinned in the Containerfile.
          BASE_IMAGE: ghcr.io/ublue-os/kinoite-main:44
        run: |
          if [ "${{ matrix.nvidia }}" != "true" ]; then
            echo "image=scratch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KERNEL=$(skopeo inspect "docker://${BASE_IMAGE}" | jq -er '.Labels["ostree.linux"]')
          AKMODS="ghcr.io/ublue-os/akmods-nvidia-open:main-44-${KERNEL}"
          echo "base kernel: ${KERNEL}"
          echo "akmods     : ${AKMODS}"
          if ! skopeo inspect "docker://${AKMODS}" >/dev/null 2>&1; then
            echo "::error::No NVIDIA akmod published for kernel ${KERNEL}. Refusing to build a" \
                 "moos-nvidia image whose kmod does not match its kernel (that is a black screen)."
            exit 1
          fi
          echo "image=${AKMODS}" >> "$GITHUB_OUTPUT"

      - name: Build image (buildah)
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: ./Containerfile
          image: ${{ matrix.image_name }}
          tags: latest ${{ steps.meta.outputs.date_tag }}
          # Give OUR image a version that actually changes every build. The base
          # (kinoite) version label is inherited and only bumps when the base
          # rebuilds, so `bootc status` would otherwise show the same number
          # after every MoOS update — making real updates look like no-ops.
          labels: |
            org.opencontainers.image.version=44.${{ steps.meta.outputs.date_tag }}.${{ github.run_number }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=MoOS
          # Same Containerfile and the same (Containerfile-pinned) base for both variants; the
          # only difference is whether the akmods stage carries a driver (moos-nvidia) or is
          # `scratch` (moos). build.sh keys the NVIDIA work off IMAGE_NAME.
          build-args: |
            IMAGE_NAME=${{ matrix.image_name }}
            AKMODS_IMAGE=${{ steps.akmods.outputs.image }}
          oci: false

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ steps.meta.outputs.registry }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Sign by digest (not tag) so the signature stays valid even if tags
      # move. Verification (same key for both variants):
      #   cosign verify --key cosign.pub ghcr.io/<owner>/moos:latest
      #   cosign verify --key cosign.pub ghcr.io/<owner>/moos-nvidia:latest
      - name: Sign image with cosign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          IMAGE_REGISTRY: ${{ steps.meta.outputs.registry }}
          IMAGE_NAME: ${{ matrix.image_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # Prove the signature we just wrote verifies against the SAME public key the
      # installed OS enforces (cosign.pub == /etc/pki/containers/moos.pub). A key
      # mismatch would otherwise break every fielded machine's updates silently,
      # with a green build. Fail the job here instead.
      - name: Verify signature against the OS-enforced public key
        env:
          IMAGE_REGISTRY: ${{ steps.meta.outputs.registry }}
          IMAGE_NAME: ${{ matrix.image_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # GHCR does not always serve a sigstore attachment the instant the
          # push that created it returns: this step has failed with "no
          # signatures found" seconds after `cosign sign` reported success, on
          # an image whose signature verified fine minutes later. That is a
          # read-after-write race in the registry, not an unsigned image — but
          # the gate must still FAIL if the signature genuinely never appears,
          # so retry with backoff and let the last attempt decide.
          for attempt in 1 2 3 4 5 6; do
            if cosign verify --key cosign.pub \
                 "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"; then
              echo "signature verified on attempt ${attempt}"
              exit 0
            fi
            echo "attempt ${attempt}: signature not visible yet; retrying in $(( attempt * 10 ))s"
            sleep $(( attempt * 10 ))
          done
          echo "::error::signature never became verifiable for ${IMAGE_NAME}@${DIGEST}"
          exit 1

      # Supply-chain transparency. The signature above answers WHO built the
      # image; an SBOM answers WHAT is inside it. Generate one from the pushed
      # digest and attest it with the SAME cosign key used for signing (no new
      # OIDC permissions), so a consumer can run
      #   cosign verify-attestation --key cosign.pub --type spdxjson \
      #     ghcr.io/<owner>/<image>@<digest>
      # alongside the signature check.
      #
      # These run LAST on purpose: the image is already pushed, signed and
      # verified, so a failure here fails the run loudly without unpublishing a
      # good image — and because bootc only ever upgrades to a fully built and
      # signed image, a red SBOM step simply means no new build ships that day,
      # never a broken one.
      - name: Generate SBOM (SPDX) from the pushed image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.registry }}/${{ matrix.image_name }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest the SBOM with the signing key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          IMAGE_REGISTRY: ${{ steps.meta.outputs.registry }}
          IMAGE_NAME: ${{ matrix.image_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign attest -y --key env://COSIGN_PRIVATE_KEY \
            --type spdxjson --predicate sbom.spdx.json \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
