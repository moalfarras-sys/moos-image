name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # Non-blocking: this is an advisory review, not a release gate. The
        # OAuth token expires periodically; a dead token must not fail PRs.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Report advisory review outcome
        if: always()
        env:
          REVIEW_OUTCOME: ${{ steps.claude-review.outcome }}
        run: |
          if [ "$REVIEW_OUTCOME" = success ]; then
            echo 'Advisory action returned success; review completion is unverified. Workflow-validation skips can also return success. Inspect actual findings and logs; this job is not release acceptance.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::Advisory review unavailable. This green job does not mean the code was reviewed.'
            echo 'Advisory review did not complete. Require an actual code review; inspect the action log for the cause.' >> "$GITHUB_STEP_SUMMARY"
          fi
