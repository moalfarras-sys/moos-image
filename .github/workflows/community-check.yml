name: MoOS participation checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'community/**'
      - '.github/workflows/community-check.yml'
  push:
    branches: [main]
    paths:
      - 'community/**'
      - '.github/workflows/community-check.yml'
permissions:
  contents: read
concurrency:
  group: community-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    name: Private conversations, retries, images and release authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Hash-pinned API and test dependencies
        run: python -m pip install --require-hashes -r community/requirements-test.lock
      - name: Same maintained API check as native development
        run: bash community/check.sh
      - name: Audit the shipped dependency graph
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r community/requirements.lock --no-deps --disable-pip --progress-spinner off
