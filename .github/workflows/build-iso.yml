# =============================================================================
# build-iso.yml — build the MoOS LIVE ISO from the published OCI image
# =============================================================================
# Uses ublue-os/titanoboa (the live-ISO builder Bazzite/Bluefin actually use):
#   https://github.com/ublue-os/titanoboa
# Structure modeled on projectbluefin/iso: https://github.com/projectbluefin/iso
#
# IMPORTANT:
#   - ISO builds are CI-ONLY. NEVER attempt them in WSL2 — the osbuild/ISO
#     tooling is explicitly unsupported on the WSL2 kernel. Offline fallback:
#     a real Fedora VM in Hyper-V. See MOOS_BUILD_WORKFLOW.md (Phase 5).
#   - Titanoboa is pinned to the exact upstream commit whose action.yml was
#     audited on 2026-08-20. Never float release construction on @main.
#   - GitHub-hosted runners have only ~14 GB free disk; the free-disk-space
#     step below is mandatory for multi-GB ISO jobs (uBlue does the same).
#   - The ISO is uploaded as a workflow artifact for now. Real hosting moves
#     to Cloudflare R2 later (GitHub Releases has a 2 GB/file limit) — see
#     MOOS_BUILD_WORKFLOW.md (Phase 5/10).
# =============================================================================

name: Build MoOS Live ISO

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Container image ref to build the ISO from (empty = ghcr.io/<owner>/moos:latest — the generic/nouveau edition that boots + displays reliably; the proprietary moos-nvidia needs nvidia in the initramfs)"
        required: false
        default: ""
  schedule:
    # Monthly rebuild (1st of the month, 04:00 UTC) — same cadence as Bluefin.
    - cron: "0 4 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build live ISO (Titanoboa)
    runs-on: ubuntu-latest
    # Titanoboa's build plus the ~15 GB unsquashfs/mksquashfs offline embed is a
    # long job; cap it so a hang fails instead of burning the 6h default.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Default image ref uses the lowercase owner (GHCR requirement).
      # On scheduled runs `inputs` is empty, so the default branch is taken.
      # The input is passed via an env var (never interpolated into the script
      # body) per GitHub's security-hardening guidance against script injection.
      - name: Resolve image ref
        id: requested
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          if [ -n "${IMAGE_REF}" ]; then
            echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "image_ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/moos:latest" >> "$GITHUB_OUTPUT"
          fi

      # Mandatory: reclaim ~25 GB on the runner before building a live ISO.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # A live ISO (and the image embedded in it for offline install) must carry
      # the same signature the device enforces. Verify against cosign.pub
      # (== /etc/pki/containers/moos.pub) BEFORE pulling, so a moved or
      # overwritten :latest tag fails here instead of shipping in an ISO.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify and pin the exact image digest
        id: pin
        env:
          REQUESTED_REF: ${{ steps.requested.outputs.image_ref }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ ! "${REQUESTED_REF}" =~ ^ghcr\.io/${owner}/(moos|moos-nvidia)(:[A-Za-z0-9._-]+|@sha256:[0-9a-f]{64})$ ]]; then
            echo "FATAL: ISO source is not an official desktop MoOS reference: ${REQUESTED_REF}" >&2
            exit 1
          fi
          verified_json="$(cosign verify --key cosign.pub --output json "${REQUESTED_REF}")"
          digest="$(jq -er '.[0].critical.image["docker-manifest-digest"]' <<<"${verified_json}")"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "FATAL: cosign returned an invalid digest" >&2; exit 1; }
          repository="${REQUESTED_REF%%@*}"
          [ "${repository}" != "${REQUESTED_REF}" ] || repository="${REQUESTED_REF%:*}"
          pinned_ref="${repository}@${digest}"
          # Re-verify the immutable object we will hand to every later step.
          cosign verify --key cosign.pub "${pinned_ref}" >/dev/null
          echo "image_ref=${pinned_ref}" >> "$GITHUB_OUTPUT"
          echo "Pinned signed ISO source: ${pinned_ref}"

      # Titanoboa's main.sh mounts the image with `sudo podman run
      # --mount type=image,source=$IMAGE` — image mounts do NOT auto-pull,
      # so the image must already exist in ROOTFUL podman storage.
      - name: Pull MoOS image into rootful podman storage
        env:
          IMAGE_REF: ${{ steps.pin.outputs.image_ref }}
        run: sudo podman pull "${IMAGE_REF}"

      # Titanoboa's action.yml exposes exactly two inputs (image-ref, iso-dest)
      # and one output (iso-dest). Flatpak preloading is NOT an action input —
      # iso/flatpaks.list is consumed via the container image / Titanoboa hooks
      # (see MOOS_BUILD_WORKFLOW.md Phase 5); do not add unsupported inputs here.
      - name: Build live ISO with Titanoboa
        id: titanoboa
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: ${{ steps.pin.outputs.image_ref }}

      - name: Locate ISO output
        env:
          ISO_DEST: ${{ steps.titanoboa.outputs.iso-dest }}
        run: |
          ls -lh "${ISO_DEST}" || find "${GITHUB_WORKSPACE}" -maxdepth 4 -name '*.iso' -printf '%p (%s bytes)\n' || true

      # ── OFFLINE-INSTALL EMBED (the fix for "the ISO would not install on disk") ──
      # Titanoboa builds a live ISO whose squashfs is the image's rootfs MINUS
      # sysroot/ostree. The live boot then mounts a volatile /var OVER the squashfs,
      # so an image embedded under /var/lib/containers/storage is invisible at
      # runtime even though a build-time `podman --root` check on that directory
      # passes. containers/storage already declares /usr/lib/containers/storage as
      # an AdditionalImageStore: it stays visible through the immutable live root
      # while /var remains the empty writable primary store. Both install paths can
      # therefore use `containers-storage:<ref>` offline. Titanoboa exposes no embed
      # input, so extract the squashfs, copy the image into that read-only store,
      # re-squash, and splice it back while preserving the boot layout.
      - name: Embed MoOS image into the live ISO for offline install
        id: embed
        env:
          IMAGE_REF: ${{ steps.pin.outputs.image_ref }}
          ISO_DEST: ${{ steps.titanoboa.outputs.iso-dest }}
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso squashfs-tools skopeo
          work="${GITHUB_WORKSPACE}/iso-embed"
          rootfs="${work}/rootfs"
          store="${rootfs}/usr/lib/containers/storage"
          # runroot MUST be <50 chars — podman rejects a long runroot (its lock/socket
          # paths). The long GITHUB_WORKSPACE path tripped this; use a short /run dir.
          runroot="/run/mre"
          rm -rf "${work}"; mkdir -p "${work}"
          sudo rm -rf "${runroot}"; sudo mkdir -p "${runroot}"

          # 1) pull the live rootfs squashfs out of the ISO (Titanoboa path).
          sudo xorriso -osirrox on -indev "${ISO_DEST}" \
               -extract /LiveOS/squashfs.img "${work}/squashfs.img"
          sudo unsquashfs -d "${rootfs}" "${work}/squashfs.img"
          sudo rm -f "${work}/squashfs.img"          # free ~3.5GB — done with it
          sudo mkdir -p "${store}"
          # This declaration is the runtime bridge. If the base ever removes it,
          # embedding under /usr would be just as dead as the old /var location.
          sudo grep -Fq '"/usr/lib/containers/storage"' \
               "${rootfs}/usr/share/containers/storage.conf" || {
            echo "FATAL: live containers/storage config no longer declares the immutable additional image store" >&2
            exit 1
          }
          echo "disk after unsquash:"; df -h / | tail -1

          # 2) copy the pinned source into the live rootfs's OWN containers-storage
          #    under the exact ref the installer will request. IMAGE_REF may be a
          #    digest; using that digest as the destination makes skopeo reject an
          #    overlay representation change ("Destination specifies a digest").
          #    The image itself carries the canonical install ref, so read it from
          #    the extracted rootfs and use that tagged ref as the local alias.
          offline_ref="$(sudo cat "${rootfs}/usr/lib/moos/install-imageref" | tr -d '\r\n')"
          case "${offline_ref}" in
            ghcr.io/moalfarras-sys/moos:latest|ghcr.io/moalfarras-sys/moos-nvidia:latest) ;;
            *) echo "FATAL: unsafe or missing install-imageref: ${offline_ref}" >&2; exit 1 ;;
          esac
          # The overlay driver is named IN the destination reference
          # ([overlay@…]); Ubuntu's skopeo has no --dest-storage-driver flag.
          # Source is the runner's rootful store (pulled earlier) — no network.
          sudo skopeo copy \
               "containers-storage:${IMAGE_REF}" \
               "containers-storage:[overlay@${store}+${runroot}]${offline_ref}"

          # 3) GATE (fail-loud) the RUNTIME topology, not the directory in isolation.
          # The old gate pointed podman's primary --root straight at the embedded
          # /var store and passed, while the real live boot mounted an empty /var on
          # top of it. Give podman a separate EMPTY writable graphroot and expose the
          # embedded /usr store only through AdditionalImageStores — exactly what the
          # live system's shipped storage.conf does. If that lookup fails, the ISO
          # would fall through to a network pull and is not releasable.
          runtime_root="${work}/runtime-empty-store"
          runtime_runroot="/run/mre-live"
          runtime_conf="${work}/runtime-storage.conf"
          sudo rm -rf "${runtime_root}" "${runtime_runroot}"
          sudo mkdir -p "${runtime_root}" "${runtime_runroot}"
          sudo tee "${runtime_conf}" >/dev/null <<EOF
          [storage]
          driver = "overlay"
          runroot = "${runtime_runroot}"
          graphroot = "${runtime_root}"

          [storage.options]
          additionalimagestores = ["${store}"]
          EOF
          sudo env CONTAINERS_STORAGE_CONF="${runtime_conf}" \
               podman image exists "${offline_ref}"
          echo "OFFLINE EMBED OK: ${IMAGE_REF} is stored as ${offline_ref} in the live ISO"

          # Rootful containers/storage makes its overlay home a PRIVATE bind
          # mount while opening an AdditionalImageStore.  That is correct in the
          # live session, but the short-lived build-time lookup can leave the
          # bind mount attached after podman exits.  Detach it before squashing;
          # otherwise the rootfs cannot be deleted and, more importantly, the
          # build would be packaging a live mount rather than only its files.
          if mountpoint -q "${store}/overlay"; then
            sudo umount -R "${store}/overlay"
          fi
          if mountpoint -q "${store}/overlay"; then
            echo "FATAL: offline image store remained mounted after runtime lookup" >&2
            exit 1
          fi

          # Free the runner's rootful store now (Titanoboa and the copy are done with
          # it) so the re-squash and ISO write have headroom on the ~25GB runner.
          sudo podman system reset -f 2>/dev/null || true
          echo "disk after freeing rootful store:"; df -h / | tail -1

          # 4) re-squash, then DROP the rootfs BEFORE writing the ISO (frees ~12GB).
          # zstd level 6 (not 19): re-compressing the ~15GB rootfs+image at max level
          # took far too long on the 4-core runner for a marginal size gain. Level 6 is
          # ~5x faster and still small. The live boot decompresses zstd either way.
          sudo mksquashfs "${rootfs}" "${work}/squashfs-new.img" \
               -noappend -all-root -comp zstd -Xcompression-level 6
          sudo rm -rf "${rootfs}" "${runroot}" "${runtime_root}" "${runtime_runroot}"
          echo "disk after re-squash:"; df -h / | tail -1

          # 5) splice the new squashfs back in, preserving the hybrid UEFI+BIOS boot.
          out="${GITHUB_WORKSPACE}/moos-offline.iso"
          sudo xorriso -indev "${ISO_DEST}" -outdev "${out}" \
               -boot_image any replay \
               -update "${work}/squashfs-new.img" /LiveOS/squashfs.img \
               -commit
          sudo rm -f "${work}/squashfs-new.img"
          ls -lh "${out}"
          echo "iso=${out}" >> "$GITHUB_OUTPUT"

      - name: Install final-ISO UEFI boot dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf socat jq imagemagick

      - name: Boot and prove the exact final live ISO
        env:
          FINAL_ISO: ${{ steps.embed.outputs.iso }}
          EXPECTED_IMAGE: ${{ steps.pin.outputs.image_ref }}
          EVIDENCE_DIR: ${{ runner.temp }}/iso-boot-proof
        run: tests/boot_live_iso.sh "$FINAL_ISO" "$EXPECTED_IMAGE" "$EVIDENCE_DIR"

      - name: Upload final-ISO boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moos-live-iso-boot-proof
          path: ${{ runner.temp }}/iso-boot-proof
          if-no-files-found: warn
          retention-days: 14

      # NOTE: artifacts are a temporary distribution channel (short retention,
      # slow downloads). Cloudflare R2 upload replaces this step later.
      - name: Upload ISO as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moos-live-iso
          path: ${{ steps.embed.outputs.iso }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
