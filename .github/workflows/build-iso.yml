# =============================================================================
# build-iso.yml — build the MoOS LIVE ISO from the published OCI image
# =============================================================================
# Uses ublue-os/titanoboa (the live-ISO builder Bazzite/Bluefin actually use):
#   https://github.com/ublue-os/titanoboa
# Structure modeled on projectbluefin/iso: https://github.com/projectbluefin/iso
#
# IMPORTANT:
#   - ISO builds are CI-ONLY. NEVER attempt them in WSL2 — the osbuild/ISO
#     tooling is explicitly unsupported on the WSL2 kernel. Offline fallback:
#     a real Fedora VM in Hyper-V. See MOOS_BUILD_WORKFLOW.md (Phase 5).
#   - Titanoboa is young (v0.1.x). We pin @main for now; TODO: pin a release
#     tag (e.g. @v0.1.0 or a commit SHA) as soon as a stable tag is published.
#     VERIFY the exact input names against the action's action.yml
#     (https://github.com/ublue-os/titanoboa/blob/main/action.yml) before the
#     first run — the "container-native ISO contract" may still change.
#   - GitHub-hosted runners have only ~14 GB free disk; the free-disk-space
#     step below is mandatory for multi-GB ISO jobs (uBlue does the same).
#   - The ISO is uploaded as a workflow artifact for now. Real hosting moves
#     to Cloudflare R2 later (GitHub Releases has a 2 GB/file limit) — see
#     MOOS_BUILD_WORKFLOW.md (Phase 5/10).
# =============================================================================

name: Build MoOS Live ISO

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Container image ref to build the ISO from (empty = ghcr.io/<owner>/moos:latest — the generic/nouveau edition that boots + displays reliably; the proprietary moos-nvidia needs nvidia in the initramfs)"
        required: false
        default: ""
  schedule:
    # Monthly rebuild (1st of the month, 04:00 UTC) — same cadence as Bluefin.
    - cron: "0 4 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build live ISO (Titanoboa)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Default image ref uses the lowercase owner (GHCR requirement).
      # On scheduled runs `inputs` is empty, so the default branch is taken.
      # The input is passed via an env var (never interpolated into the script
      # body) per GitHub's security-hardening guidance against script injection.
      - name: Resolve image ref
        id: ref
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          if [ -n "${IMAGE_REF}" ]; then
            echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "image_ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/moos:latest" >> "$GITHUB_OUTPUT"
          fi

      # Mandatory: reclaim ~25 GB on the runner before building a live ISO.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # Titanoboa's main.sh mounts the image with `sudo podman run
      # --mount type=image,source=$IMAGE` — image mounts do NOT auto-pull,
      # so the image must already exist in ROOTFUL podman storage.
      - name: Pull MoOS image into rootful podman storage
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image_ref }}
        run: sudo podman pull "${IMAGE_REF}"

      # TODO: pin to a release tag/SHA once Titanoboa publishes one (see header).
      # Titanoboa's action.yml exposes exactly two inputs (image-ref, iso-dest)
      # and one output (iso-dest). Flatpak preloading is NOT an action input —
      # iso/flatpaks.list is consumed via the container image / Titanoboa hooks
      # (see MOOS_BUILD_WORKFLOW.md Phase 5); do not add unsupported inputs here.
      - name: Build live ISO with Titanoboa
        id: titanoboa
        uses: ublue-os/titanoboa@main
        with:
          image-ref: ${{ steps.ref.outputs.image_ref }}

      - name: Locate ISO output
        env:
          ISO_DEST: ${{ steps.titanoboa.outputs.iso-dest }}
        run: |
          ls -lh "${ISO_DEST}" || find "${GITHUB_WORKSPACE}" -maxdepth 4 -name '*.iso' -printf '%p (%s bytes)\n' || true

      # ── OFFLINE-INSTALL EMBED (the fix for "the ISO would not install on disk") ──
      # Titanoboa builds a live ISO whose squashfs is the image's rootfs MINUS
      # sysroot/ostree — so the live session ships an EMPTY /var/lib/containers/
      # storage. But BOTH install paths need the MoOS image THERE to install
      # offline: moos-install-to-disk gates on `podman image exists` -> installs
      # `containers-storage:<ref>`, and the Anaconda kickstart uses
      # `ostreecontainer --transport=containers-storage`. Titanoboa's action exposes
      # no embed input, so we do it here: extract the squashfs, copy the image into
      # its containers-storage, re-squash, and splice it back into the ISO while
      # PRESERVING the (hybrid UEFI+BIOS) boot layout via `xorriso ... replay`.
      - name: Embed MoOS image into the live ISO for offline install
        id: embed
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image_ref }}
          ISO_DEST: ${{ steps.titanoboa.outputs.iso-dest }}
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso squashfs-tools skopeo
          work="${GITHUB_WORKSPACE}/iso-embed"
          rootfs="${work}/rootfs"
          store="${rootfs}/var/lib/containers/storage"
          # runroot MUST be <50 chars — podman rejects a long runroot (its lock/socket
          # paths). The long GITHUB_WORKSPACE path tripped this; use a short /run dir.
          runroot="/run/mre"
          rm -rf "${work}"; mkdir -p "${work}"
          sudo rm -rf "${runroot}"; sudo mkdir -p "${runroot}"

          # 1) pull the live rootfs squashfs out of the ISO (Titanoboa path).
          sudo xorriso -osirrox on -indev "${ISO_DEST}" \
               -extract /LiveOS/squashfs.img "${work}/squashfs.img"
          sudo unsquashfs -d "${rootfs}" "${work}/squashfs.img"
          sudo rm -f "${work}/squashfs.img"          # free ~3.5GB — done with it
          sudo mkdir -p "${store}"
          echo "disk after unsquash:"; df -h / | tail -1

          # 2) copy the image into the live rootfs's OWN containers-storage. The
          #    overlay driver is named IN the destination reference ([overlay@…]);
          #    Ubuntu's skopeo has no --dest-storage-driver flag. Source is the
          #    runner's rootful store (pulled earlier) — no network needed.
          sudo skopeo copy \
               "containers-storage:${IMAGE_REF}" \
               "containers-storage:[overlay@${store}+${runroot}]${IMAGE_REF}"

          # 3) GATE (fail-loud): the image MUST now be present in that store, or the
          #    offline install would silently fall back to a network pull — exactly
          #    the bug this step fixes. A wrong embed fails the BUILD, never ships.
          sudo podman --root "${store}" --runroot "${runroot}" \
               --storage-driver overlay image exists "${IMAGE_REF}"
          echo "OFFLINE EMBED OK: ${IMAGE_REF} is present in the live ISO's containers-storage"

          # Free the runner's rootful store now (Titanoboa and the copy are done with
          # it) so the re-squash and ISO write have headroom on the ~25GB runner.
          sudo podman system reset -f 2>/dev/null || true
          echo "disk after freeing rootful store:"; df -h / | tail -1

          # 4) re-squash, then DROP the rootfs BEFORE writing the ISO (frees ~12GB).
          # zstd level 6 (not 19): re-compressing the ~15GB rootfs+image at max level
          # took far too long on the 4-core runner for a marginal size gain. Level 6 is
          # ~5x faster and still small. The live boot decompresses zstd either way.
          sudo mksquashfs "${rootfs}" "${work}/squashfs-new.img" \
               -noappend -all-root -comp zstd -Xcompression-level 6
          sudo rm -rf "${rootfs}" "${runroot}"
          echo "disk after re-squash:"; df -h / | tail -1

          # 5) splice the new squashfs back in, preserving the hybrid UEFI+BIOS boot.
          out="${GITHUB_WORKSPACE}/moos-offline.iso"
          sudo xorriso -indev "${ISO_DEST}" -outdev "${out}" \
               -boot_image any replay \
               -update "${work}/squashfs-new.img" /LiveOS/squashfs.img \
               -commit
          sudo rm -f "${work}/squashfs-new.img"
          ls -lh "${out}"
          echo "iso=${out}" >> "$GITHUB_OUTPUT"

      # NOTE: artifacts are a temporary distribution channel (short retention,
      # slow downloads). Cloudflare R2 upload replaces this step later.
      - name: Upload ISO as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moos-live-iso
          path: ${{ steps.embed.outputs.iso }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
