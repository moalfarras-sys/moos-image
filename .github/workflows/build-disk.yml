# build-disk.yml — build a PRE-INSTALLED MoOS disk image (qcow2) via
# bootc-image-builder, then smoke-check that the produced disk actually contains
# a working ostree/bootc deployment (the v20 fix). Manual + monthly.
#
# WHY: the installed-disk boot path (initramfs -> ostree-prepare-root ->
# /sysroot) is what regressed in v19 (dracut emergency mode). A qcow2 from
# bootc-image-builder is a real installed deployment that boots directly — no
# Anaconda, no live ISO — so it is the cleanest artifact to verify the v20 fix
# in a VM. Runs on a Linux runner (privileged podman) so it does not depend on
# any Windows-host tooling.
name: Build MoOS disk image (qcow2)

on:
  workflow_dispatch:
    inputs:
      image-ref:
        description: "Image ref (empty = ghcr.io/<owner>/moos:latest — the generic edition; matches the resolver below)"
        required: false
        default: ""
  schedule:
    - cron: "0 5 1 * *"

permissions:
  contents: read

# A manual run must not pile onto the scheduled monthly one — two privileged
# bootc-image-builder jobs sharing /var/lib/containers/storage is asking for a
# corrupt build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-disk:
    name: Build qcow2 (bootc-image-builder)
    runs-on: ubuntu-latest
    # bootc-image-builder + the deployed-initramfs proof + a 10-minute TCG QEMU
    # boot is ~an hour; cap it so a wedged QEMU (no KVM on GH runners) fails
    # instead of burning the 6h default.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          docker-images: true

      - name: Resolve image ref
        id: requested
        env:
          INPUT_REF: ${{ inputs['image-ref'] }}
        run: |
          REF="${INPUT_REF}"
          [ -n "$REF" ] || REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/moos:latest"
          echo "image_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building disk from: $REF"

      # The installed OS refuses an unsigned image; a downloadable qcow2 must not
      # be a way around that. Verify the cosign signature against the SAME public
      # key the device enforces (cosign.pub == /etc/pki/containers/moos.pub)
      # BEFORE the expensive pull, so a moved or overwritten :latest tag fails the
      # build here instead of being baked into a shipped disk.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify and pin the exact image digest
        id: pin
        env:
          REQUESTED_REF: ${{ steps.requested.outputs.image_ref }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ ! "${REQUESTED_REF}" =~ ^ghcr\.io/${owner}/(moos|moos-nvidia)(:[A-Za-z0-9._-]+|@sha256:[0-9a-f]{64})$ ]]; then
            echo "FATAL: disk source is not an official desktop MoOS reference: ${REQUESTED_REF}" >&2
            exit 1
          fi
          verified_json="$(cosign verify --key cosign.pub --output json "${REQUESTED_REF}")"
          digest="$(jq -er '.[0].critical.image["docker-manifest-digest"]' <<<"${verified_json}")"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "FATAL: cosign returned an invalid digest" >&2; exit 1; }
          repository="${REQUESTED_REF%%@*}"
          [ "${repository}" != "${REQUESTED_REF}" ] || repository="${REQUESTED_REF%:*}"
          pinned_ref="${repository}@${digest}"
          cosign verify --key cosign.pub "${pinned_ref}" >/dev/null
          echo "image_ref=${pinned_ref}" >> "$GITHUB_OUTPUT"
          echo "Pinned signed disk source: ${pinned_ref}"

      - name: Pull the MoOS image (public — no auth)
        run: sudo podman pull "${{ steps.pin.outputs.image_ref }}"

      - name: Build qcow2 with bootc-image-builder
        run: |
          mkdir -p output
          # Never publish a disk artifact with a repository-known password.
          # The random CI-only credential is intentionally not printed or saved.
          TEST_PASSWORD="$(openssl rand -hex 20)"
          sed "s/__MOOS_CI_RANDOM_PASSWORD__/${TEST_PASSWORD}/" \
            bib/config.toml > /tmp/moos-bib-config.toml
          unset TEST_PASSWORD
          chmod 0600 /tmp/moos-bib-config.toml
          # --rootfs btrfs matches the real-hardware Anaconda install (and the
          # 00-moos.toml default), so this qcow2 boots the SAME on-disk layout.
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "/tmp/moos-bib-config.toml:/config.toml:ro" \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b \
            --type qcow2 \
            --rootfs btrfs \
            --config /config.toml \
            --local \
            "${{ steps.pin.outputs.image_ref }}"
          echo "=== output tree ==="; sudo find output -maxdepth 3 -type f -printf '%p (%s bytes)\n'

      - name: Verify the deployed disk's initramfs has ostree-prepare-root
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-utils zstd initramfs-tools-core >/dev/null
          QCOW=$(sudo find output -name '*.qcow2' | head -1)
          [ -n "$QCOW" ] || { echo "FATAL: no qcow2 produced"; exit 1; }
          echo "qcow2: $QCOW ($(sudo du -h "$QCOW" | cut -f1))"
          # Map the qcow2 (no boot) and pull the DEPLOYED initramfs off it. This
          # proves the INSTALLED disk — not just the image — carries the v20 fix,
          # i.e. it will boot past the v19 emergency point.
          sudo modprobe nbd max_part=16
          sudo qemu-nbd --connect=/dev/nbd0 -f qcow2 "$QCOW"; sleep 3
          sudo partprobe /dev/nbd0 2>/dev/null || true
          lsblk /dev/nbd0
          MNT=$(mktemp -d); FOUND=""
          for P in $(lsblk -rno NAME /dev/nbd0 | tail -n +2); do
            sudo mount -o ro "/dev/$P" "$MNT" 2>/dev/null || continue
            IMG=$(sudo find "$MNT" -path '*modules*initramfs.img' 2>/dev/null | head -1)
            if [ -n "$IMG" ]; then echo "installed initramfs on /dev/$P: $IMG"; sudo cp "$IMG" /tmp/deployed.img; FOUND=1; sudo umount "$MNT"; break; fi
            sudo umount "$MNT" 2>/dev/null || true
          done
          sudo qemu-nbd --disconnect /dev/nbd0 || true
          [ -n "$FOUND" ] || { echo "FATAL: could not locate deployed initramfs on the disk"; exit 1; }
          # unmkinitramfs (initramfs-tools) extracts multi-segment (early-cpio +
          # zstd) initramfs directly — no lsinitrd/skipcpio needed on Ubuntu.
          sudo unmkinitramfs /tmp/deployed.img /tmp/initx 2>/dev/null || true
          if sudo find /tmp/initx -name 'ostree-prepare-root' | grep -q .; then
            echo "PROOF: DEPLOYED-DISK initramfs CONTAINS ostree-prepare-root -> boots past the v19 emergency point."
          else
            echo "FATAL: deployed initramfs is missing ostree-prepare-root."; exit 1
          fi

      - name: Boot the qcow2 in QEMU UEFI — real boot test (the v-boot regression gate)
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq qemu-system-x86 ovmf >/dev/null
          QCOW=$(sudo find output -name '*.qcow2' | head -1)
          [ -n "$QCOW" ] || { echo "FATAL: no qcow2"; exit 1; }
          sudo qemu-img check "$QCOW"
          pristine_sha="$(sudo sha256sum "$QCOW" | awk '{print $1}')"
          printf '%s\n' "$pristine_sha" > /tmp/moos-qcow.pristine.sha256

          # The downloadable artifact must remain byte-for-byte identical to the
          # branded image BIB produced. Make an external overlay for serial-only
          # observability; modifying the original used to remove quiet/rhgb from
          # the very qcow2 uploaded to users.
          TEST_QCOW=/tmp/moos-disk-serial-test.qcow2
          sudo qemu-img create -q -f qcow2 -F qcow2 \
            -b "$(realpath "$QCOW")" "$TEST_QCOW"
          cleanup() { sudo qemu-nbd --disconnect /dev/nbd0 >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          sudo qemu-nbd --connect=/dev/nbd0 -f qcow2 "$TEST_QCOW"; sleep 3
          sudo partprobe /dev/nbd0 2>/dev/null || true
          MNT=$(mktemp -d)
          for P in $(lsblk -rno NAME /dev/nbd0 | tail -n +2); do
            sudo mount "/dev/$P" "$MNT" 2>/dev/null || continue
            if sudo test -d "$MNT/loader/entries"; then
              echo "boot partition: /dev/$P"
              sudo sed -i -E 's/\bquiet\b//g; s/\brhgb\b//g; /^options /{/console=ttyS0/!s/$/ console=ttyS0,115200/}' "$MNT"/loader/entries/*.conf
              sudo grep -h '^options' "$MNT"/loader/entries/*.conf | head
              sudo umount "$MNT"; break
            fi
            sudo umount "$MNT" 2>/dev/null || true
          done
          sudo qemu-nbd --disconnect /dev/nbd0 || true
          # find (not ls) — `ls a b` returns 2 when ANY path is missing, and
          # pipefail would abort even though the other file exists.
          OVMF_CODE=$(find /usr/share -name 'OVMF_CODE*.fd' 2>/dev/null | sort | head -1)
          OVMF_VARS=$(find /usr/share -name 'OVMF_VARS*.fd' 2>/dev/null | sort | head -1)
          if [ -z "$OVMF_CODE" ] || [ -z "$OVMF_VARS" ]; then
            echo "FATAL: OVMF firmware is absent; this candidate cannot pass its UEFI boot gate."
            find /usr -iname '*OVMF*' 2>/dev/null | head
            exit 1
          fi
          cp "$OVMF_VARS" /tmp/vars.fd
          echo "OVMF: $OVMF_CODE ; boot (TCG, no KVM on GH runners — allow time)…"
          # Never exits on its own (boots to a login); timeout stops it, then we
          # analyse the captured serial console.
          sudo timeout 600 qemu-system-x86_64 \
            -machine q35 -cpu Haswell -m 4096 -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=/tmp/vars.fd \
            -drive file="$TEST_QCOW",format=qcow2,if=virtio \
            -device virtio-gpu-pci -nic none \
            -serial file:/tmp/serial.log -display none -no-reboot 2>/tmp/qemu.err || true
          echo "=== serial console (tail) ==="; tail -80 /tmp/serial.log 2>/dev/null || true
          [ -s /tmp/serial.log ] || { echo "FATAL: QEMU produced no serial boot log."; exit 1; }
          # systemd colours the unit state and target name separately. Grepping
          # the raw stream therefore misses visible text such as
          # "Reached target Basic System" because ANSI bytes sit in the middle
          # of the phrase. Normalise once, then run every decision on the same
          # plain log so colour can never turn a successful boot into a failure
          # (or hide a real emergency signature).
          python3 - <<'PY' || { echo "FATAL: could not normalise the QEMU serial log."; exit 1; }
          import pathlib
          import re

          source = pathlib.Path("/tmp/serial.log").read_bytes()
          ansi = re.compile(rb"\x1b(?:\[[0-?]*[ -/]*[@-~]|[@-_])")
          pathlib.Path("/tmp/serial.plain.log").write_bytes(ansi.sub(b"", source))
          PY
          # Negative gate: any boot failure signature fails the build.
          if grep -qiE "Kernel panic|Entering emergency|emergency mode|Cannot open root device|Failed to mount /sysroot|unable to allocate memory|out of memory|can't allocate|ostree-prepare-root: .*(fail|error)" /tmp/serial.plain.log; then
            echo "FATAL: boot failure detected in the QEMU serial log."; exit 1
          fi
          # Positive gate: reached a systemd target => GRUB+kernel+initramfs+ostree
          # +root+systemd all worked (the exact chain that failed on real hardware).
          if grep -qiE "Reached target Graphical|Started .*Display Manager|plasma-login-manager|plasmalogin" /tmp/serial.plain.log; then
            echo "PASS: MoOS booted in QEMU UEFI through the graphical/login path with no emergency/panic."
          else
            echo "FATAL: boot did not reach the graphical/login path within the timeout."; tail -120 /tmp/serial.plain.log; exit 1
          fi

          final_sha="$(sudo sha256sum "$QCOW" | awk '{print $1}')"
          [ "$final_sha" = "$pristine_sha" ] || {
            echo "FATAL: the publishable qcow2 changed during its boot proof"; exit 1; }
          echo "PASS: publishable qcow2 stayed byte-for-byte pristine; serial changes lived only in the overlay."

      - name: Upload qcow2
        run: |
          set -euo pipefail
          QCOW=$(sudo find output -name '*.qcow2' | head -1)
          expected="$(cat /tmp/moos-qcow.pristine.sha256)"
          actual="$(sudo sha256sum "$QCOW" | awk '{print $1}')"
          [ "$actual" = "$expected" ] || { echo "FATAL: qcow2 changed before upload"; exit 1; }

      - name: Publish the pristine qcow2
        uses: actions/upload-artifact@v4
        with:
          name: moos-disk-qcow2
          path: output/**/*.qcow2
          compression-level: 0
