# build-disk.yml — build a PRE-INSTALLED MoOS disk image (qcow2) via
# bootc-image-builder, then smoke-check that the produced disk actually contains
# a working ostree/bootc deployment (the v20 fix). Manual + monthly.
# This is a CI verification fixture, not an end-user login image: its one-time
# random test credential is deliberately discarded. The supported interactive
# x86 delivery artifact is the live/install ISO, whose account recipe is chosen
# by the user. Do not present this QCOW2 as a pre-provisioned desktop download.
#
# WHY: the installed-disk boot path (initramfs -> ostree-prepare-root ->
# /sysroot) is what regressed in v19 (dracut emergency mode). A qcow2 from
# bootc-image-builder is a real installed deployment that boots directly — no
# Anaconda, no live ISO — so it is the cleanest artifact to verify the v20 fix
# in a VM. Runs on a Linux runner (privileged podman) so it does not depend on
# any Windows-host tooling.
name: Build MoOS disk image (qcow2)

on:
  workflow_dispatch:
    inputs:
      image-ref:
        description: "Exact signed moos, moos-nvidia or moos-cloud ref (empty = generic latest for scheduled smoke only)"
        required: false
        default: ""
  schedule:
    - cron: "0 5 1 * *"

permissions:
  contents: read

# A manual run must not pile onto the scheduled monthly one — two privileged
# bootc-image-builder jobs sharing /var/lib/containers/storage is asking for a
# corrupt build.
concurrency:
  # Each edition has independent storage on its hosted runner. Keep duplicate
  # proofs for the same ref serialized without cancelling the other editions.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs['image-ref'] || 'scheduled-generic' }}
  cancel-in-progress: true

jobs:
  build-disk:
    name: Build qcow2 (bootc-image-builder)
    runs-on: ubuntu-latest
    # bootc-image-builder + deployed-initramfs proof + two complete TCG boots
    # are bounded to 90 minutes so a wedged QEMU fails instead of consuming the
    # GitHub six-hour default.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release-disk source gates
        run: |
          bash -n build_files/seal_x86_qcow2.sh
          bash -n build_files/seal_release_qcow2.sh
          bash -n tests/boot_x86_qcow2.sh
          python3 tests/test_release_workflow_safety.py
          python3 tests/test_release_partition_roles.py
          python3 tests/test_seal_arm_deployment.py

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          docker-images: true

      - name: Resolve image ref
        id: requested
        env:
          INPUT_REF: ${{ inputs['image-ref'] }}
        run: |
          REF="${INPUT_REF}"
          [ -n "$REF" ] || REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/moos:latest"
          echo "image_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building disk from: $REF"

      # The installed OS refuses an unsigned image; a downloadable qcow2 must not
      # be a way around that. Verify the cosign signature against the SAME public
      # key the device enforces (cosign.pub == /etc/pki/containers/moos.pub)
      # BEFORE the expensive pull, so a moved or overwritten :latest tag fails the
      # build here instead of being baked into a shipped disk.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify and pin the exact image digest
        id: pin
        env:
          REQUESTED_REF: ${{ steps.requested.outputs.image_ref }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ ! "${REQUESTED_REF}" =~ ^ghcr\.io/${owner}/(moos|moos-nvidia|moos-cloud)(:[A-Za-z0-9._-]+|@sha256:[0-9a-f]{64})$ ]]; then
            echo "FATAL: disk source is not an official MoOS x86 reference: ${REQUESTED_REF}" >&2
            exit 1
          fi
          verified_json="$(cosign verify --key cosign.pub --output json "${REQUESTED_REF}")"
          digest="$(jq -er '.[0].critical.image["docker-manifest-digest"]' <<<"${verified_json}")"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "FATAL: cosign returned an invalid digest" >&2; exit 1; }
          repository="${REQUESTED_REF%%@*}"
          [ "${repository}" != "${REQUESTED_REF}" ] || repository="${REQUESTED_REF%:*}"
          pinned_ref="${repository}@${digest}"
          cosign verify --key cosign.pub "${pinned_ref}" >/dev/null
          echo "image_ref=${pinned_ref}" >> "$GITHUB_OUTPUT"
          echo "Pinned signed disk source: ${pinned_ref}"

      - name: Pull the MoOS image (public — no auth)
        run: sudo podman pull "${{ steps.pin.outputs.image_ref }}"

      - name: Build qcow2 with bootc-image-builder
        run: |
          set -euo pipefail
          mkdir -p output
          # Never publish a disk artifact with a repository-known credential.
          # SSH is a CI-only observation channel; its private key is destroyed
          # after the two-boot proof and is never uploaded.
          TEST_PASSWORD="$(openssl rand -hex 20)"
          ssh-keygen -q -t ed25519 -N '' -C moos-ci-runtime-proof \
            -f "${RUNNER_TEMP}/moos-ci-runtime-key"
          TEST_SSH_PUBLIC_KEY="$(<"${RUNNER_TEMP}/moos-ci-runtime-key.pub")"
          export TEST_PASSWORD TEST_SSH_PUBLIC_KEY
          python3 - <<'PY'
          import os
          from pathlib import Path

          source = Path("bib/config.toml").read_text(encoding="utf-8")
          replacements = {
              "__MOOS_CI_RANDOM_PASSWORD__": os.environ["TEST_PASSWORD"],
              "__MOOS_CI_SSH_PUBLIC_KEY__": os.environ["TEST_SSH_PUBLIC_KEY"],
          }
          for marker, value in replacements.items():
              if source.count(marker) != 1:
                  raise SystemExit(f"FATAL: expected exactly one {marker} placeholder")
              source = source.replace(marker, value)
          Path("/tmp/moos-bib-config.toml").write_text(source, encoding="utf-8")
          PY
          unset TEST_PASSWORD
          unset TEST_SSH_PUBLIC_KEY
          chmod 0600 /tmp/moos-bib-config.toml
          chmod 0600 "${RUNNER_TEMP}/moos-ci-runtime-key"
          echo "MOOS_X86_SSH_KEY=${RUNNER_TEMP}/moos-ci-runtime-key" >> "$GITHUB_ENV"
          # --rootfs btrfs matches the real-hardware Anaconda install (and the
          # 00-moos.toml default), so this qcow2 boots the SAME on-disk layout.
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "/tmp/moos-bib-config.toml:/config.toml:ro" \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b \
            --type qcow2 \
            --rootfs btrfs \
            --config /config.toml \
            --local \
            "${{ steps.pin.outputs.image_ref }}"
          echo "=== output tree ==="; sudo find output -maxdepth 3 -type f -printf '%p (%s bytes)\n'

      - name: Seal the exact signed x86 deployment
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils
          qcow="$(sudo find output -name '*.qcow2' -print -quit)"
          [ -n "$qcow" ] || { echo "FATAL: no qcow2 was produced" >&2; exit 1; }
          expected="${{ steps.pin.outputs.image_ref }}"
          sudo build_files/seal_x86_qcow2.sh "$qcow" "$expected"
          sudo chown "$USER:$USER" "$qcow"
          echo "MOOS_X86_QCOW=$(readlink -f "$qcow")" >> "$GITHUB_ENV"

      - name: Verify the deployed disk's initramfs has ostree-prepare-root
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-utils zstd initramfs-tools-core >/dev/null
          QCOW="$MOOS_X86_QCOW"
          [ -n "$QCOW" ] || { echo "FATAL: no qcow2 produced"; exit 1; }
          echo "qcow2: $QCOW ($(sudo du -h "$QCOW" | cut -f1))"
          # Map the qcow2 (no boot) and pull the DEPLOYED initramfs off it. This
          # proves the INSTALLED disk — not just the image — carries the v20 fix,
          # i.e. it will boot past the v19 emergency point.
          sudo modprobe nbd max_part=16
          sudo qemu-nbd --connect=/dev/nbd0 -f qcow2 "$QCOW"; sleep 3
          sudo partprobe /dev/nbd0 2>/dev/null || true
          lsblk /dev/nbd0
          MNT=$(mktemp -d); FOUND=""
          for P in $(lsblk -rno NAME /dev/nbd0 | tail -n +2); do
            sudo mount -o ro "/dev/$P" "$MNT" 2>/dev/null || continue
            IMG=$(sudo find "$MNT" -path '*modules*initramfs.img' 2>/dev/null | head -1)
            if [ -n "$IMG" ]; then echo "installed initramfs on /dev/$P: $IMG"; sudo cp "$IMG" /tmp/deployed.img; FOUND=1; sudo umount "$MNT"; break; fi
            sudo umount "$MNT" 2>/dev/null || true
          done
          sudo qemu-nbd --disconnect /dev/nbd0 || true
          [ -n "$FOUND" ] || { echo "FATAL: could not locate deployed initramfs on the disk"; exit 1; }
          # unmkinitramfs (initramfs-tools) extracts multi-segment (early-cpio +
          # zstd) initramfs directly — no lsinitrd/skipcpio needed on Ubuntu.
          sudo unmkinitramfs /tmp/deployed.img /tmp/initx 2>/dev/null || true
          if sudo find /tmp/initx -name 'ostree-prepare-root' | grep -q .; then
            echo "PROOF: DEPLOYED-DISK initramfs CONTAINS ostree-prepare-root -> boots past the v19 emergency point."
          else
            echo "FATAL: deployed initramfs is missing ostree-prepare-root."; exit 1
          fi

      - name: Boot, reboot and power off the exact sealed QCOW2
        env:
          EXPECTED_IMAGE: ${{ steps.pin.outputs.image_ref }}
          EVIDENCE_DIR: ${{ runner.temp }}/x86-qcow2-boot-proof
        run: |
          set -euo pipefail
          trap 'rm -f -- "$MOOS_X86_SSH_KEY" "$MOOS_X86_SSH_KEY.pub"' EXIT
          sudo apt-get install -y -qq qemu-system-x86 ovmf imagemagick >/dev/null
          before="$(sha256sum "$MOOS_X86_QCOW" | awk '{print $1}')"
          tests/boot_x86_qcow2.sh \
            "$MOOS_X86_QCOW" "$EXPECTED_IMAGE" "$EVIDENCE_DIR" "$MOOS_X86_SSH_KEY"
          after="$(sha256sum "$MOOS_X86_QCOW" | awk '{print $1}')"
          [ "$before" = "$after" ] || {
            echo "FATAL: the boot gate modified the sealed release QCOW2" >&2
            exit 1
          }

      - name: Upload x86 QCOW2 boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moos-x86-qcow2-boot-proof
          path: ${{ runner.temp }}/x86-qcow2-boot-proof
          if-no-files-found: error
          retention-days: 14

      - name: Upload qcow2
        run: |
          set -euo pipefail
          QCOW="$MOOS_X86_QCOW"
          expected="$(sed -n 's/^sha256=//p' "${{ runner.temp }}/x86-qcow2-boot-proof/manifest.txt")"
          actual="$(sha256sum "$QCOW" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo "FATAL: boot proof has no valid artifact SHA"; exit 1; }
          [ "$actual" = "$expected" ] || { echo "FATAL: qcow2 changed before upload"; exit 1; }

      - name: Publish the pristine qcow2
        uses: actions/upload-artifact@v4
        with:
          name: moos-ci-verified-disk-qcow2
          path: output/**/*.qcow2
          compression-level: 0
