# A real audio output for a machine that has no sound card.
#
# WHY THIS FILE EXISTS
#
# On a VPS `/proc/asound/cards` says "no soundcards", so WirePlumber invents its FALLBACK sink and
# calls it `auto_null` / "Dummy Output". Audio does route there and its monitor can be captured — the
# MoOS Cloud audio stream was measured producing valid Opus off exactly that monitor.
#
# But the fallback is not a device, and Plasma is right not to pretend it is: plasma-pa filters the
# dummy fallback out of the Audio Volume applet, so the panel says
#
#     "No output or input devices found"
#
# and the tray shows a crossed-out speaker. That is what a real user sees, and the conclusion they
# draw — "this system has no sound" — is the correct conclusion from the evidence they were given.
# Worse, with no device listed there is no volume slider, no per-application mixer, and no way to
# tell a muted stream from a silent desktop.
#
# So stop relying on the fallback and declare an actual sink. It is still a null sink — there is no
# hardware to send samples to and there never will be — but it is a null sink that EXISTS: named,
# described, selectable, volume-controllable, and outranking `auto_null`, which WirePlumber then
# stops creating because a real sink is present.
#
# The monitor of this node is what moos-cloud-audio captures. It reads @DEFAULT_MONITOR@ rather than
# a hardcoded name precisely so that it follows whichever sink is current, so it picks this one up
# with no change on that side.
#
# Ships in every edition rather than only the cloud one on purpose: a desktop with a real card gets a
# real card as its default anyway (a hardware sink outranks a virtual one), and a laptop whose only
# output is an unplugged HDMI port benefits from the same thing for the same reason.
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "moos-output"
            node.description = "MoOS Output"
            media.class      = Audio/Sink

            # Stereo at 48 kHz, because that is what the Opus encoder downstream wants and a
            # mismatch here costs a resample on every buffer. audio.position is what makes the
            # channel map explicit — a null sink that advertises ONE channel is how the cloud audio
            # stream ended up folding stereo flat before the caps filter was added to that pipeline.
            audio.position   = [ FL FR ]
            audio.rate        = 48000
            audio.channels    = 2

            # NOT a virtual/hidden node. This flag is the whole point: it is what puts the sink in
            # front of the user in the volume applet instead of leaving them told they have no
            # audio hardware at all.
            node.virtual     = false

            # Claim a normal priority rather than the fallback's floor, so it is chosen as default
            # over auto_null but never over a real card if one ever appears.
            priority.driver  = 800
            priority.session = 800
        }
    }
]
