<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MoOS UI — Premium 3D Liquid Glass application mark: moos-moplayer.
       Premium 3D liquid-glass plate with enhanced 7-layer glass material.
       Every ink is a KDE colour role; MoOS bakes one copy of this file per
       palette icon theme (FollowsColorScheme=false).  Glass sheens are white/black
       opacity only — theme-safe material.  No clipPath: every fill is a rounded
       rect so Plasma cannot paint a square scratch behind the squircle.
       Regenerate with artwork/generate_moos_app_icons.py. -->
  <defs>
    <style id="current-color-scheme" type="text/css">.ColorScheme-Text { color:#F5F7FA; }.ColorScheme-Background{ color:#0A0A0C; }.ColorScheme-Highlight{ color:#22D3EE; }.ColorScheme-HighlightedText{ color:#000000; }.ColorScheme-PositiveText{ color:#4ADE80; }.ColorScheme-NeutralText{ color:#FBBF24; }.ColorScheme-NegativeText{ color:#F87171; }.ColorScheme-Accent{ color:#22D3EE; }</style>
    <linearGradient id="moos-moplayer-sheen" x1="512" y1="72" x2="512" y2="680"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset="0.15" stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity=".02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="moos-moplayer-depth" x1="512" y1="320" x2="512" y2="952"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.40" stop-color="#000000" stop-opacity=".04"/>
      <stop offset="0.70" stop-color="#000000" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="moos-moplayer-shimmer" x1="140" y1="80" x2="880" y2="820"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="0.34" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="0.50" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="moos-moplayer-refract" x1="120" y1="100" x2="860" y2="780"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="0.46" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moos-moplayer-caustic" gradientUnits="userSpaceOnUse"
                    cx="280" cy="220" r="460">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".68"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moos-moplayer-rimlight" gradientUnits="userSpaceOnUse"
                    cx="740" cy="760" r="520">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".25"/>
      <stop offset="0.40" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moos-moplayer-floor" gradientUnits="userSpaceOnUse"
                    cx="512" cy="800" r="360">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moos-moplayer-rim-hi" x1="120" y1="60" x2="860" y2="860"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="0.68" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moos-moplayer-aura" gradientUnits="userSpaceOnUse"
                    cx="512" cy="520" r="580">
      <stop offset="0.60" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#000000" stop-opacity=".14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect fill="url(#moos-moplayer-aura)" x="36" y="36" width="952" height="952" rx="292"/>
  <rect class="ColorScheme-NeutralText" fill="currentColor" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-moplayer-depth)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-moplayer-sheen)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-moplayer-shimmer)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-moplayer-refract)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-moplayer-caustic)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-moplayer-rimlight)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-moplayer-floor)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="none" stroke="url(#moos-moplayer-rim-hi)" stroke-width="18" x="84" y="84" width="856" height="856" rx="252"/>
  <rect class="ColorScheme-Background" fill="none" stroke="currentColor"
        stroke-opacity=".10" stroke-width="6" x="84" y="84" width="856" height="856" rx="252"/>
  <g class="ColorScheme-Background" fill="currentColor">
    <path d="M275 654V334c0-38 28-66 66-66h18c24 0 46 13 58 34l84 148 84-148c12-21 34-34 58-34h18c38 0 66 28 66 66v320h-92V434l-92 158c-9 16-24 24-42 24s-33-8-42-24l-92-158v220Z"/>
    <path d="M252 760c126 58 242 26 330-66 82-86 140-120 202-128" fill="none"
          stroke="currentColor" stroke-width="64" stroke-linecap="round" opacity=".55"/>
  </g>
</svg>
