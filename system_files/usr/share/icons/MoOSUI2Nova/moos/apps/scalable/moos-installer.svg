<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MoOS UI — Liquid Glass application mark: moos-installer.
       Original vector geometry. Every ink is a KDE colour role, and MoOS bakes
       one copy of this file per palette icon theme — MoOS pins
       FollowsColorScheme=false, so nothing re-colours it at runtime. The
       stylesheet below is the MoOS default palette (MoOSUI2Dark) and is what
       every renderer outside those themes shows.
       Regenerate with artwork/generate_moos_app_icons.py. -->
  <defs>
    <style id="current-color-scheme" type="text/css">.ColorScheme-Text { color:#EAF2FF; }.ColorScheme-Background{ color:#111A2E; }.ColorScheme-Highlight{ color:#6366F1; }.ColorScheme-HighlightedText{ color:#020617; }.ColorScheme-PositiveText{ color:#34D399; }.ColorScheme-NeutralText{ color:#FBBF24; }.ColorScheme-NegativeText{ color:#FB7185; }.ColorScheme-Accent{ color:#6366F1; }</style>
    <linearGradient id="moos-installer-sheen" x1="512" y1="72" x2="512" y2="660"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect class="ColorScheme-PositiveText" fill="currentColor" x="72" y="72" width="880" height="880" rx="232"/>
  <rect fill="url(#moos-installer-sheen)" x="72" y="72" width="880" height="880" rx="232"/>
  <rect class="ColorScheme-Background" fill="none" stroke="currentColor"
        stroke-opacity=".16" stroke-width="10" x="82" y="82" width="860" height="860" rx="222"/>
  <g class="ColorScheme-Background" fill="currentColor">
    <rect x="452" y="196" width="120" height="250" rx="30"/>
    <path d="M512 686 336 458h352Z" stroke="currentColor" stroke-width="40"
          stroke-linejoin="round"/>
    <rect x="272" y="760" width="480" height="96" rx="48"/>
  </g>
</svg>
