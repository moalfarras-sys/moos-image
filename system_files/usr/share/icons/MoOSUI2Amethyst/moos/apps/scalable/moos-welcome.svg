<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MoOS UI — Liquid Glass application mark: moos-welcome.
       Original vector geometry. Every ink is a KDE colour role, and MoOS bakes
       one copy of this file per palette icon theme — MoOS pins
       FollowsColorScheme=false, so nothing re-colours it at runtime. The
       stylesheet below is the MoOS default palette (MoOSUI2Dark) and is what
       every renderer outside those themes shows.
       Regenerate with artwork/generate_moos_app_icons.py. -->
  <defs>
    <style id="current-color-scheme" type="text/css">.ColorScheme-Text { color:#F1E9F5; }.ColorScheme-Background{ color:#201829; }.ColorScheme-Highlight{ color:#C084FC; }.ColorScheme-HighlightedText{ color:#17121F; }.ColorScheme-PositiveText{ color:#6EE7B7; }.ColorScheme-NeutralText{ color:#FBBF24; }.ColorScheme-NegativeText{ color:#FB7185; }.ColorScheme-Accent{ color:#C084FC; }</style>
    <linearGradient id="moos-welcome-sheen" x1="512" y1="72" x2="512" y2="660"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect class="ColorScheme-Text" fill="currentColor" x="72" y="72" width="880" height="880" rx="232"/>
  <rect fill="url(#moos-welcome-sheen)" x="72" y="72" width="880" height="880" rx="232"/>
  <rect class="ColorScheme-Background" fill="none" stroke="currentColor"
        stroke-opacity=".16" stroke-width="10" x="82" y="82" width="860" height="860" rx="222"/>
  <g class="ColorScheme-Background" fill="currentColor">
    <path d="M320 560a192 192 0 0 1 384 0Z"/>
    <rect x="248" y="560" width="528" height="72" rx="36"/>
    <g fill="none" stroke="currentColor" stroke-width="64" stroke-linecap="round" opacity=".6">
      <path d="M294 481 215 452"/>
      <path d="M379 370 331 301"/>
      <path d="M512 328v-84"/>
      <path d="M645 370 693 301"/>
      <path d="M730 481 809 452"/>
    </g>
    <rect x="300" y="686" width="424" height="50" rx="25" opacity=".5"/>
    <rect x="356" y="772" width="312" height="50" rx="25" opacity=".32"/>
  </g>
</svg>
