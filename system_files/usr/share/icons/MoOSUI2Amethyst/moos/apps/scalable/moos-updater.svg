<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MoOS UI — Premium 3D Liquid Glass application mark: moos-updater.
       Premium 3D liquid-glass plate with enhanced 7-layer glass material.
       Every ink is a KDE colour role; MoOS bakes one copy of this file per
       palette icon theme (FollowsColorScheme=false).  Glass sheens are white/black
       opacity only — theme-safe material.  No clipPath: every fill is a rounded
       rect so Plasma cannot paint a square scratch behind the squircle.
       Regenerate with artwork/generate_moos_app_icons.py. -->
  <defs>
    <style id="current-color-scheme" type="text/css">.ColorScheme-Text { color:#F1E9F5; }.ColorScheme-Background{ color:#201829; }.ColorScheme-Highlight{ color:#C084FC; }.ColorScheme-HighlightedText{ color:#17121F; }.ColorScheme-PositiveText{ color:#6EE7B7; }.ColorScheme-NeutralText{ color:#FBBF24; }.ColorScheme-NegativeText{ color:#FB7185; }.ColorScheme-Accent{ color:#C084FC; }</style>
    <linearGradient id="moos-updater-sheen" x1="512" y1="72" x2="512" y2="680"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset="0.15" stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity=".02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="moos-updater-depth" x1="512" y1="320" x2="512" y2="952"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.40" stop-color="#000000" stop-opacity=".04"/>
      <stop offset="0.70" stop-color="#000000" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="moos-updater-shimmer" x1="140" y1="80" x2="880" y2="820"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="0.34" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="0.50" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="moos-updater-refract" x1="120" y1="100" x2="860" y2="780"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="0.46" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moos-updater-caustic" gradientUnits="userSpaceOnUse"
                    cx="280" cy="220" r="460">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".68"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moos-updater-rimlight" gradientUnits="userSpaceOnUse"
                    cx="740" cy="760" r="520">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".25"/>
      <stop offset="0.40" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moos-updater-floor" gradientUnits="userSpaceOnUse"
                    cx="512" cy="800" r="360">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moos-updater-rim-hi" x1="120" y1="60" x2="860" y2="860"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="0.68" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moos-updater-aura" gradientUnits="userSpaceOnUse"
                    cx="512" cy="520" r="580">
      <stop offset="0.60" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#000000" stop-opacity=".14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect fill="url(#moos-updater-aura)" x="36" y="36" width="952" height="952" rx="292"/>
  <rect class="ColorScheme-Highlight" fill="currentColor" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-updater-depth)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-updater-sheen)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-updater-shimmer)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-updater-refract)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-updater-caustic)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-updater-rimlight)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-updater-floor)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="none" stroke="url(#moos-updater-rim-hi)" stroke-width="18" x="84" y="84" width="856" height="856" rx="252"/>
  <rect class="ColorScheme-HighlightedText" fill="none" stroke="currentColor"
        stroke-opacity=".10" stroke-width="6" x="84" y="84" width="856" height="856" rx="252"/>
  <g class="ColorScheme-HighlightedText" fill="currentColor">
    <path d="M512 260A252 252 0 1 1 275 426" fill="none" stroke="currentColor"
          stroke-width="92"/>
    <path d="M512 186v148l130-74Z"/>
    <rect x="464" y="372" width="96" height="190" rx="20"/>
    <path d="M512 684 382 530h260Z" stroke="currentColor" stroke-width="36"
          stroke-linejoin="round"/>
  </g>
</svg>
