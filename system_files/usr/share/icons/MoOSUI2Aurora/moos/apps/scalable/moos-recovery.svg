<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MoOS UI — Liquid Glass application mark: moos-recovery.
       Original vector geometry. Every ink is a KDE colour role, and MoOS bakes
       one copy of this file per palette icon theme — MoOS pins
       FollowsColorScheme=false, so nothing re-colours it at runtime. The
       stylesheet below is the MoOS default palette (MoOSUI2Dark) and is what
       every renderer outside those themes shows.
       Regenerate with artwork/generate_moos_app_icons.py. -->
  <defs>
    <style id="current-color-scheme" type="text/css">.ColorScheme-Text { color:#ECF2FB; }.ColorScheme-Background{ color:#172236; }.ColorScheme-Highlight{ color:#3B82F6; }.ColorScheme-HighlightedText{ color:#0E1524; }.ColorScheme-PositiveText{ color:#34D399; }.ColorScheme-NeutralText{ color:#FBBF24; }.ColorScheme-NegativeText{ color:#FB7185; }.ColorScheme-Accent{ color:#3B82F6; }</style>
    <linearGradient id="moos-recovery-sheen" x1="512" y1="72" x2="512" y2="660"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect class="ColorScheme-NegativeText" fill="currentColor" x="72" y="72" width="880" height="880" rx="232"/>
  <rect fill="url(#moos-recovery-sheen)" x="72" y="72" width="880" height="880" rx="232"/>
  <rect class="ColorScheme-Background" fill="none" stroke="currentColor"
        stroke-opacity=".16" stroke-width="10" x="82" y="82" width="860" height="860" rx="222"/>
  <path class="ColorScheme-Background" fill="currentColor"
        d="M512 176c96 62 196 82 268 88v236c0 200-110 268-268 324-158-56-268-124-268-324V264c72-6 172-26 268-88Z"/>
  <g class="ColorScheme-NegativeText" fill="currentColor">
    <rect x="470" y="390" width="84" height="224" rx="22"/>
    <rect x="400" y="460" width="224" height="84" rx="22"/>
  </g>
</svg>
