<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MoOS UI — Liquid Glass application mark: moos-control-center.
       Premium 3D liquid-glass plate. Every ink is a KDE colour role; MoOS bakes
       one copy of this file per palette icon theme (FollowsColorScheme=false).
       Glass sheens are white/black opacity only — theme-safe material.
       No clipPath: every fill is a rounded rect so Plasma cannot paint a
       square scratch behind the squircle.
       Regenerate with artwork/generate_moos_app_icons.py. -->
  <defs>
    <style id="current-color-scheme" type="text/css">.ColorScheme-Text { color:#E6EDF3; }.ColorScheme-Background{ color:#131A22; }.ColorScheme-Highlight{ color:#3FB950; }.ColorScheme-HighlightedText{ color:#0D1117; }.ColorScheme-PositiveText{ color:#3FB950; }.ColorScheme-NeutralText{ color:#D29922; }.ColorScheme-NegativeText{ color:#F85149; }.ColorScheme-Accent{ color:#3FB950; }</style>
    <linearGradient id="moos-control-center-sheen" x1="512" y1="72" x2="512" y2="700"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="0.22" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="moos-control-center-depth" x1="512" y1="360" x2="512" y2="952"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#000000" stop-opacity=".06"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".30"/>
    </linearGradient>
    <linearGradient id="moos-control-center-refract" x1="120" y1="100" x2="860" y2="780"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="0.46" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moos-control-center-caustic" gradientUnits="userSpaceOnUse"
                    cx="300" cy="260" r="420">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".58"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moos-control-center-floor" gradientUnits="userSpaceOnUse"
                    cx="512" cy="780" r="340">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moos-control-center-rim-hi" x1="130" y1="80" x2="820" y2="820"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".78"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moos-control-center-aura" gradientUnits="userSpaceOnUse"
                    cx="512" cy="520" r="520">
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#000000" stop-opacity=".10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect fill="url(#moos-control-center-aura)" x="36" y="36" width="952" height="952" rx="292"/>
  <rect class="ColorScheme-Highlight" fill="currentColor" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-control-center-sheen)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-control-center-depth)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-control-center-refract)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-control-center-caustic)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-control-center-floor)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="none" stroke="url(#moos-control-center-rim-hi)" stroke-width="18" x="84" y="84" width="856" height="856" rx="252"/>
  <rect class="ColorScheme-HighlightedText" fill="none" stroke="currentColor"
        stroke-opacity=".10" stroke-width="6" x="84" y="84" width="856" height="856" rx="252"/>
  <g class="ColorScheme-HighlightedText" fill="currentColor">
    <rect x="268" y="282" width="488" height="92" rx="46" opacity=".34"/>
    <rect x="268" y="466" width="488" height="92" rx="46" opacity=".34"/>
    <rect x="268" y="650" width="488" height="92" rx="46" opacity=".34"/>
    <rect x="268" y="282" width="368" height="92" rx="46"/>
    <rect x="268" y="466" width="128" height="92" rx="46"/>
    <rect x="268" y="650" width="288" height="92" rx="46"/>
    <circle cx="636" cy="328" r="74"/>
    <circle cx="396" cy="512" r="74"/>
    <circle cx="556" cy="696" r="74"/>
  </g>
  <g class="ColorScheme-Highlight" fill="currentColor">
    <circle cx="636" cy="328" r="34"/>
    <circle cx="396" cy="512" r="34"/>
    <circle cx="556" cy="696" r="34"/>
  </g>
</svg>
