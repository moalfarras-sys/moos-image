<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MoOS UI — Premium 3D Liquid Glass application mark: moos-installer.
       Premium 3D liquid-glass plate with enhanced 9-layer glass material.
       Every ink is a KDE colour role; MoOS bakes one copy of this file per
       palette icon theme (FollowsColorScheme=false).  Glass sheens are white/black
       opacity only — theme-safe material.  No clipPath: every fill is a rounded
       rect so Plasma cannot paint a square scratch behind the squircle.
       Regenerate with artwork/generate_moos_app_icons.py. -->
  <defs>
    <style id="current-color-scheme" type="text/css">.ColorScheme-Text { color:#17302E; }.ColorScheme-Background{ color:#DBD8CA; }.ColorScheme-Highlight{ color:#B45309; }.ColorScheme-HighlightedText{ color:#F7FBFF; }.ColorScheme-PositiveText{ color:#086B4B; }.ColorScheme-NeutralText{ color:#7B520F; }.ColorScheme-NegativeText{ color:#A52F3F; }.ColorScheme-Accent{ color:#B45309; }</style>
    <linearGradient id="moos-installer-sheen" x1="512" y1="72" x2="512" y2="560"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset="0.14" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="0.36" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="0.60" stop-color="#ffffff" stop-opacity=".02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="moos-installer-topedge" x1="512" y1="60" x2="512" y2="168"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".64"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="moos-installer-liquid" x1="512" y1="316" x2="512" y2="512"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.40" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="0.60" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="moos-installer-depth" x1="512" y1="300" x2="512" y2="952"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#000000" stop-opacity=".06"/>
      <stop offset="0.68" stop-color="#000000" stop-opacity=".16"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".46"/>
    </linearGradient>
    <linearGradient id="moos-installer-shimmer" x1="140" y1="80" x2="880" y2="820"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="0.34" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="0.50" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="moos-installer-refract" x1="120" y1="100" x2="860" y2="780"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="0.46" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moos-installer-caustic" gradientUnits="userSpaceOnUse"
                    cx="280" cy="200" r="420">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset="0.30" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="0.60" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moos-installer-rimlight" gradientUnits="userSpaceOnUse"
                    cx="740" cy="760" r="520">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".25"/>
      <stop offset="0.40" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moos-installer-floor" gradientUnits="userSpaceOnUse"
                    cx="512" cy="800" r="360">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moos-installer-rim-hi" x1="120" y1="60" x2="860" y2="860"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="0.68" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moos-installer-aura" gradientUnits="userSpaceOnUse"
                    cx="512" cy="520" r="580">
      <stop offset="0.60" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#000000" stop-opacity=".14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect fill="url(#moos-installer-aura)" x="36" y="36" width="952" height="952" rx="292"/>
  <rect class="ColorScheme-PositiveText" fill="currentColor" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-installer-depth)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-installer-sheen)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-installer-liquid)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-installer-shimmer)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-installer-refract)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-installer-caustic)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-installer-rimlight)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-installer-floor)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-installer-topedge)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="none" stroke="url(#moos-installer-rim-hi)" stroke-width="18" x="84" y="84" width="856" height="856" rx="252"/>
  <rect class="ColorScheme-Background" fill="none" stroke="currentColor"
        stroke-opacity=".10" stroke-width="6" x="84" y="84" width="856" height="856" rx="252"/>
  <g class="ColorScheme-Background" fill="currentColor">
    <rect x="452" y="196" width="120" height="250" rx="30"/>
    <path d="M512 686 336 458h352Z" stroke="currentColor" stroke-width="40"
          stroke-linejoin="round"/>
    <rect x="272" y="760" width="480" height="96" rx="48"/>
  </g>
</svg>
