<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MoOS UI — Liquid Glass application mark: moos-updater.
       Original vector geometry. Every ink is a KDE colour role, and MoOS bakes
       one copy of this file per palette icon theme — MoOS pins
       FollowsColorScheme=false, so nothing re-colours it at runtime. The
       stylesheet below is the MoOS default palette (MoOSUI2Dark) and is what
       every renderer outside those themes shows.
       Regenerate with artwork/generate_moos_app_icons.py. -->
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color: #e8f1ef; }
      .ColorScheme-Background { color: #1d2529; }
      .ColorScheme-Highlight { color: #4ed7c8; }
      .ColorScheme-HighlightedText { color: #142220; }
      .ColorScheme-PositiveText { color: #69d9a5; }
      .ColorScheme-NeutralText { color: #f4c56a; }
      .ColorScheme-NegativeText { color: #ff7d88; }
      .ColorScheme-Accent { color: #4ed7c8; }
    </style>
    <linearGradient id="moos-updater-sheen" x1="512" y1="72" x2="512" y2="660"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect class="ColorScheme-Highlight" fill="currentColor" x="72" y="72" width="880" height="880" rx="232"/>
  <rect fill="url(#moos-updater-sheen)" x="72" y="72" width="880" height="880" rx="232"/>
  <rect class="ColorScheme-HighlightedText" fill="none" stroke="currentColor"
        stroke-opacity=".16" stroke-width="10" x="82" y="82" width="860" height="860" rx="222"/>
  <g class="ColorScheme-HighlightedText" fill="currentColor">
    <path d="M512 260A252 252 0 1 1 275 426" fill="none" stroke="currentColor"
          stroke-width="92"/>
    <path d="M512 186v148l130-74Z"/>
    <rect x="464" y="372" width="96" height="190" rx="20"/>
    <path d="M512 684 382 530h260Z" stroke="currentColor" stroke-width="36"
          stroke-linejoin="round"/>
  </g>
</svg>
