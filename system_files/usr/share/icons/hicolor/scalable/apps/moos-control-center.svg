<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MoOS UI — Liquid Glass application mark: moos-control-center.
       Original vector geometry. Every ink is a KDE colour role, and MoOS bakes
       one copy of this file per palette icon theme — MoOS pins
       FollowsColorScheme=false, so nothing re-colours it at runtime. The
       stylesheet below is the MoOS default palette (MoOSUI2Dark) and is what
       every renderer outside those themes shows.
       Regenerate with artwork/generate_moos_app_icons.py. -->
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color: #e8f1ef; }
      .ColorScheme-Background { color: #1d2529; }
      .ColorScheme-Highlight { color: #4ed7c8; }
      .ColorScheme-HighlightedText { color: #142220; }
      .ColorScheme-PositiveText { color: #69d9a5; }
      .ColorScheme-NeutralText { color: #f4c56a; }
      .ColorScheme-NegativeText { color: #ff7d88; }
      .ColorScheme-Accent { color: #4ed7c8; }
    </style>
    <linearGradient id="moos-control-center-tile-light" x1="512" y1="72" x2="512" y2="952" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.75" stop-color="#000" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="moos-control-center-rim-light" x1="512" y1="72" x2="512" y2="952" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.8" stop-color="#000" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="moos-control-center-glow" cx="512" cy="200" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moos-control-center-glyph-gradient" x1="512" y1="200" x2="512" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="currentColor" stop-opacity="1.0"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="moos-control-center-black">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="moos-control-center-white">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- 3D Drop Shadows (Rendered beneath the tile) -->
  <rect fill="url(#moos-control-center-black)" opacity="0.05" x="72" y="104" width="880" height="880" rx="232"/>
  <rect fill="url(#moos-control-center-black)" opacity="0.10" x="72" y="92" width="880" height="880" rx="232"/>
  <rect fill="url(#moos-control-center-black)" opacity="0.15" x="72" y="80" width="880" height="880" rx="232"/>

  <!-- Base Color -->
  <rect class="ColorScheme-Highlight" fill="currentColor" x="72" y="72" width="880" height="880" rx="232"/>
  
  <!-- Liquid Glass Shading -->
  <rect fill="url(#moos-control-center-tile-light)" x="72" y="72" width="880" height="880" rx="232"/>
  <rect fill="url(#moos-control-center-glow)" x="72" y="72" width="880" height="880" rx="232"/>
  
  <!-- Outer Bevel/Rim -->
  <rect fill="none" stroke="url(#moos-control-center-rim-light)" stroke-width="12" x="82" y="82" width="860" height="860" rx="222"/>
  <rect fill="none" stroke="url(#moos-control-center-white)" stroke-opacity="0.3" stroke-width="4" x="76" y="76" width="872" height="872" rx="228"/>
  
  <!-- Drop shadow for the control center glyph -->
  <g fill="url(#moos-control-center-black)" opacity="0.2" transform="translate(0, 16)">
    <rect x="268" y="282" width="488" height="92" rx="46"/>
    <rect x="268" y="466" width="488" height="92" rx="46"/>
    <rect x="268" y="650" width="488" height="92" rx="46"/>
    <circle cx="636" cy="328" r="74"/>
    <circle cx="396" cy="512" r="74"/>
    <circle cx="556" cy="696" r="74"/>
  </g>

  <g class="ColorScheme-HighlightedText" fill="currentColor">
    <rect x="268" y="282" width="488" height="92" rx="46" opacity="0.25"/>
    <rect x="268" y="466" width="488" height="92" rx="46" opacity="0.25"/>
    <rect x="268" y="650" width="488" height="92" rx="46" opacity="0.25"/>
    <!-- Active track -->
    <rect x="268" y="282" width="368" height="92" rx="46" fill="url(#moos-control-center-glyph-gradient)"/>
    <rect x="268" y="466" width="128" height="92" rx="46" fill="url(#moos-control-center-glyph-gradient)"/>
    <rect x="268" y="650" width="288" height="92" rx="46" fill="url(#moos-control-center-glyph-gradient)"/>
    
    <!-- Knobs -->
    <circle cx="636" cy="328" r="74" fill="url(#moos-control-center-glyph-gradient)"/>
    <circle cx="396" cy="512" r="74" fill="url(#moos-control-center-glyph-gradient)"/>
    <circle cx="556" cy="696" r="74" fill="url(#moos-control-center-glyph-gradient)"/>
  </g>

  <!-- Knob Inner Bevel / Reflection -->
  <g fill="url(#{name}-white)" opacity="0.3">
    <circle cx="636" cy="320" r="64"/>
    <circle cx="396" cy="504" r="64"/>
    <circle cx="556" cy="688" r="64"/>
  </g>
  <g class="ColorScheme-HighlightedText" fill="currentColor">
    <circle cx="636" cy="324" r="64" opacity="0.8"/>
    <circle cx="396" cy="508" r="64" opacity="0.8"/>
    <circle cx="556" cy="692" r="64" opacity="0.8"/>
  </g>

  <g class="ColorScheme-Highlight" fill="currentColor">
    <circle cx="636" cy="328" r="34"/>
    <circle cx="396" cy="512" r="34"/>
    <circle cx="556" cy="696" r="34"/>
  </g>
  <!-- Knob indent shadow -->
  <g fill="url(#moos-control-center-black)" opacity="0.25">
    <circle cx="636" cy="334" r="34"/>
    <circle cx="396" cy="518" r="34"/>
    <circle cx="556" cy="702" r="34"/>
  </g>
</svg>
