<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MoOS UI — Liquid Glass application mark: moos-moplayer.
       Original vector geometry. Every ink is a KDE colour role, and MoOS bakes
       one copy of this file per palette icon theme — MoOS pins
       FollowsColorScheme=false, so nothing re-colours it at runtime. The
       stylesheet below is the MoOS default palette (MoOSUI2Dark) and is what
       every renderer outside those themes shows.
       Regenerate with artwork/generate_moos_app_icons.py. -->
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color: #e8f1ef; }
      .ColorScheme-Background { color: #1d2529; }
      .ColorScheme-Highlight { color: #4ed7c8; }
      .ColorScheme-HighlightedText { color: #142220; }
      .ColorScheme-PositiveText { color: #69d9a5; }
      .ColorScheme-NeutralText { color: #f4c56a; }
      .ColorScheme-NegativeText { color: #ff7d88; }
      .ColorScheme-Accent { color: #4ed7c8; }
    </style>
    <linearGradient id="moos-moplayer-tile-light" x1="512" y1="72" x2="512" y2="952" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.75" stop-color="#000" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="moos-moplayer-rim-light" x1="512" y1="72" x2="512" y2="952" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.8" stop-color="#000" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="moos-moplayer-glow" cx="512" cy="200" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moos-moplayer-glyph-gradient" x1="512" y1="200" x2="512" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="currentColor" stop-opacity="1.0"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="moos-moplayer-black">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="moos-moplayer-white">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- 3D Drop Shadows (Rendered beneath the tile) -->
  <rect fill="url(#moos-moplayer-black)" opacity="0.05" x="72" y="104" width="880" height="880" rx="232"/>
  <rect fill="url(#moos-moplayer-black)" opacity="0.10" x="72" y="92" width="880" height="880" rx="232"/>
  <rect fill="url(#moos-moplayer-black)" opacity="0.15" x="72" y="80" width="880" height="880" rx="232"/>

  <!-- Base Color -->
  <rect class="ColorScheme-NeutralText" fill="currentColor" x="72" y="72" width="880" height="880" rx="232"/>
  
  <!-- Liquid Glass Shading -->
  <rect fill="url(#moos-moplayer-tile-light)" x="72" y="72" width="880" height="880" rx="232"/>
  <rect fill="url(#moos-moplayer-glow)" x="72" y="72" width="880" height="880" rx="232"/>
  
  <!-- Outer Bevel/Rim -->
  <rect fill="none" stroke="url(#moos-moplayer-rim-light)" stroke-width="12" x="82" y="82" width="860" height="860" rx="222"/>
  <rect fill="none" stroke="url(#moos-moplayer-white)" stroke-opacity="0.3" stroke-width="4" x="76" y="76" width="872" height="872" rx="228"/>
  
  <!-- Drop Shadow -->
  <g fill="url(#moos-moplayer-black)" opacity="0.2" transform="translate(0, 16)">
    <path d="M275 654V334c0-38 28-66 66-66h18c24 0 46 13 58 34l84 148 84-148c12-21 34-34 58-34h18c38 0 66 28 66 66v320h-92V434l-92 158c-9 16-24 24-42 24s-33-8-42-24l-92-158v220Z"/>
    <path d="M252 760c126 58 242 26 330-66 82-86 140-120 202-128" fill="none" stroke="url(#moos-moplayer-black)" stroke-width="64" stroke-linecap="round"/>
  </g>

  <g class="ColorScheme-Background" fill="currentColor">
    <!-- The M -->
    <path d="M275 654V334c0-38 28-66 66-66h18c24 0 46 13 58 34l84 148 84-148c12-21 34-34 58-34h18c38 0 66 28 66 66v320h-92V434l-92 158c-9 16-24 24-42 24s-33-8-42-24l-92-158v220Z" fill="url(#moos-moplayer-glyph-gradient)"/>
    <!-- The Current -->
    <path d="M252 760c126 58 242 26 330-66 82-86 140-120 202-128" fill="none"
          stroke="currentColor" stroke-width="64" stroke-linecap="round" opacity=".7"/>
    <path d="M252 760c126 58 242 26 330-66 82-86 140-120 202-128" fill="none"
          stroke="url(#{name}-white)" stroke-width="16" stroke-linecap="round" opacity=".2"/>
  </g>
</svg>
