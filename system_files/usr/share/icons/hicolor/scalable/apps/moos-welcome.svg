<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MoOS UI — Liquid Glass application mark: moos-welcome.
       Premium 3D liquid-glass plate. Every ink is a KDE colour role; MoOS bakes
       one copy of this file per palette icon theme (FollowsColorScheme=false).
       Glass sheens are white/black opacity only — theme-safe material.
       No clipPath: every fill is a rounded rect so Plasma cannot paint a
       square scratch behind the squircle.
       Regenerate with artwork/generate_moos_app_icons.py. -->
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color: #e8f1ef; }
      .ColorScheme-Background { color: #1d2529; }
      .ColorScheme-Highlight { color: #4ed7c8; }
      .ColorScheme-HighlightedText { color: #142220; }
      .ColorScheme-PositiveText { color: #69d9a5; }
      .ColorScheme-NeutralText { color: #f4c56a; }
      .ColorScheme-NegativeText { color: #ff7d88; }
      .ColorScheme-Accent { color: #4ed7c8; }
    </style>
    <linearGradient id="moos-welcome-sheen" x1="512" y1="72" x2="512" y2="700"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="0.22" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="moos-welcome-depth" x1="512" y1="360" x2="512" y2="952"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#000000" stop-opacity=".06"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".30"/>
    </linearGradient>
    <linearGradient id="moos-welcome-refract" x1="120" y1="100" x2="860" y2="780"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="0.46" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moos-welcome-caustic" gradientUnits="userSpaceOnUse"
                    cx="300" cy="260" r="420">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".58"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moos-welcome-floor" gradientUnits="userSpaceOnUse"
                    cx="512" cy="780" r="340">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moos-welcome-rim-hi" x1="130" y1="80" x2="820" y2="820"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".78"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moos-welcome-aura" gradientUnits="userSpaceOnUse"
                    cx="512" cy="520" r="520">
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#000000" stop-opacity=".10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect fill="url(#moos-welcome-aura)" x="36" y="36" width="952" height="952" rx="292"/>
  <rect class="ColorScheme-Text" fill="currentColor" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-welcome-sheen)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-welcome-depth)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-welcome-refract)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-welcome-caustic)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-welcome-floor)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="none" stroke="url(#moos-welcome-rim-hi)" stroke-width="18" x="84" y="84" width="856" height="856" rx="252"/>
  <rect class="ColorScheme-Background" fill="none" stroke="currentColor"
        stroke-opacity=".10" stroke-width="6" x="84" y="84" width="856" height="856" rx="252"/>
  <g class="ColorScheme-Background" fill="currentColor">
    <path d="M320 560a192 192 0 0 1 384 0Z"/>
    <rect x="248" y="560" width="528" height="72" rx="36"/>
    <g fill="none" stroke="currentColor" stroke-width="64" stroke-linecap="round" opacity=".6">
      <path d="M294 481 215 452"/>
      <path d="M379 370 331 301"/>
      <path d="M512 328v-84"/>
      <path d="M645 370 693 301"/>
      <path d="M730 481 809 452"/>
    </g>
    <rect x="300" y="686" width="424" height="50" rx="25" opacity=".5"/>
    <rect x="356" y="772" width="312" height="50" rx="25" opacity=".32"/>
  </g>
</svg>
