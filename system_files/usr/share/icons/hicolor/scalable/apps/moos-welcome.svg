<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MoOS UI — Liquid Glass application mark: moos-welcome.
       Original vector geometry. Every ink is a KDE colour role, and MoOS bakes
       one copy of this file per palette icon theme — MoOS pins
       FollowsColorScheme=false, so nothing re-colours it at runtime. The
       stylesheet below is the MoOS default palette (MoOSUI2Dark) and is what
       every renderer outside those themes shows.
       Regenerate with artwork/generate_moos_app_icons.py. -->
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color: #e8f1ef; }
      .ColorScheme-Background { color: #1d2529; }
      .ColorScheme-Highlight { color: #4ed7c8; }
      .ColorScheme-HighlightedText { color: #142220; }
      .ColorScheme-PositiveText { color: #69d9a5; }
      .ColorScheme-NeutralText { color: #f4c56a; }
      .ColorScheme-NegativeText { color: #ff7d88; }
      .ColorScheme-Accent { color: #4ed7c8; }
    </style>
    <linearGradient id="moos-welcome-tile-light" x1="512" y1="72" x2="512" y2="952" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.75" stop-color="#000" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="moos-welcome-rim-light" x1="512" y1="72" x2="512" y2="952" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.8" stop-color="#000" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="moos-welcome-glow" cx="512" cy="200" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moos-welcome-glyph-gradient" x1="512" y1="200" x2="512" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="currentColor" stop-opacity="1.0"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="moos-welcome-black">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="moos-welcome-white">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- 3D Drop Shadows (Rendered beneath the tile) -->
  <rect fill="url(#moos-welcome-black)" opacity="0.05" x="72" y="104" width="880" height="880" rx="232"/>
  <rect fill="url(#moos-welcome-black)" opacity="0.10" x="72" y="92" width="880" height="880" rx="232"/>
  <rect fill="url(#moos-welcome-black)" opacity="0.15" x="72" y="80" width="880" height="880" rx="232"/>

  <!-- Base Color -->
  <rect class="ColorScheme-Text" fill="currentColor" x="72" y="72" width="880" height="880" rx="232"/>
  
  <!-- Liquid Glass Shading -->
  <rect fill="url(#moos-welcome-tile-light)" x="72" y="72" width="880" height="880" rx="232"/>
  <rect fill="url(#moos-welcome-glow)" x="72" y="72" width="880" height="880" rx="232"/>
  
  <!-- Outer Bevel/Rim -->
  <rect fill="none" stroke="url(#moos-welcome-rim-light)" stroke-width="12" x="82" y="82" width="860" height="860" rx="222"/>
  <rect fill="none" stroke="url(#moos-welcome-white)" stroke-opacity="0.3" stroke-width="4" x="76" y="76" width="872" height="872" rx="228"/>
  
  <!-- Drop Shadow -->
  <g fill="url(#moos-welcome-black)" opacity="0.15" transform="translate(0, 16)">
    <path d="M320 560a192 192 0 0 1 384 0Z"/>
    <rect x="248" y="560" width="528" height="72" rx="36"/>
    <g fill="none" stroke="url(#moos-welcome-black)" stroke-width="64" stroke-linecap="round">
      <path d="M294 481 215 452"/>
      <path d="M379 370 331 301"/>
      <path d="M512 328v-84"/>
      <path d="M645 370 693 301"/>
      <path d="M730 481 809 452"/>
    </g>
    <rect x="300" y="686" width="424" height="50" rx="25"/>
    <rect x="356" y="772" width="312" height="50" rx="25"/>
  </g>

  <g class="ColorScheme-Background" fill="currentColor">
    <!-- Sun -->
    <path d="M320 560a192 192 0 0 1 384 0Z" fill="url(#moos-welcome-glyph-gradient)"/>
    <!-- Horizon -->
    <rect x="248" y="560" width="528" height="72" rx="36" fill="url(#moos-welcome-glyph-gradient)"/>
    <!-- Rays -->
    <g fill="none" stroke="currentColor" stroke-width="64" stroke-linecap="round" opacity=".6">
      <path d="M294 481 215 452"/>
      <path d="M379 370 331 301"/>
      <path d="M512 328v-84"/>
      <path d="M645 370 693 301"/>
      <path d="M730 481 809 452"/>
    </g>
    <!-- Ocean Waves -->
    <rect x="300" y="686" width="424" height="50" rx="25" opacity=".6" fill="url(#moos-welcome-glyph-gradient)"/>
    <rect x="356" y="772" width="312" height="50" rx="25" opacity=".4" fill="url(#moos-welcome-glyph-gradient)"/>
  </g>
  <!-- Highlights -->
  <g fill="url(#{name}-white)" opacity="0.2">
    <path d="M336 544a176 176 0 0 1 352 0Z"/>
    <rect x="256" y="568" width="512" height="40" rx="20"/>
  </g>
</svg>
