<?xml version="1.0" encoding="UTF-8"?>
<!-- Mo AI — the Nova orb. © Moalfarras.
     The same shape the app animates: a Nova ring (cyan → blue → violet), a dark
     core, and a spark. Drawn as one silhouette so it survives 16 px — the old
     icon was a robot face inside a rounded panel inside another rounded panel,
     and below 32 px it collapsed into mush. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- The Nova sweep. Approximates the app's conical gradient with four stops
         around the ring, so the icon and the running orb read as one object. -->
    <linearGradient id="ring" x1="180" y1="180" x2="844" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".38" stop-color="#2E7BFF"/>
      <stop offset=".74" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="ringTop" x1="512" y1="150" x2="512" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DEBFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#7DEBFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="core" cx="512" cy="452" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B2A45"/>
      <stop offset=".62" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#05080F"/>
    </radialGradient>

    <radialGradient id="halo" cx="512" cy="512" r="500" gradientUnits="userSpaceOnUse">
      <stop offset=".52" stop-color="#2E7BFF" stop-opacity=".42"/>
      <stop offset=".78" stop-color="#8B5CF6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#2E7BFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="spark" cx="512" cy="512" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".34" stop-color="#9BE8FF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </radialGradient>

    <!-- The ring is an annulus: outer circle minus inner circle. -->
    <mask id="annulus">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="512" cy="512" r="360" fill="#fff"/>
      <circle cx="512" cy="512" r="242" fill="#000"/>
    </mask>
  </defs>

  <!-- Glow -->
  <circle cx="512" cy="512" r="500" fill="url(#halo)"/>

  <!-- The Nova ring -->
  <g mask="url(#annulus)">
    <circle cx="512" cy="512" r="360" fill="url(#ring)"/>
    <!-- A highlight along the top edge, so the ring reads as lit rather than flat -->
    <circle cx="512" cy="512" r="360" fill="url(#ringTop)"/>
  </g>

  <!-- The core -->
  <circle cx="512" cy="512" r="242" fill="url(#core)"/>
  <circle cx="512" cy="512" r="242" fill="none" stroke="#22D3EE" stroke-opacity=".28" stroke-width="4"/>

  <!-- The spark: the thing that is alive -->
  <circle cx="512" cy="512" r="96" fill="url(#spark)"/>
  <circle cx="512" cy="512" r="96" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="3"/>

  <!-- A single orbiting mote — the only asymmetry, and what stops the icon
       reading as a plain target or record button. -->
  <circle cx="762" cy="330" r="34" fill="#22D3EE"/>
  <circle cx="762" cy="330" r="34" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="4"/>
</svg>
