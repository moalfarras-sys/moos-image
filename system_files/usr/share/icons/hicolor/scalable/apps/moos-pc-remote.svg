<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MoOS UI — Liquid Glass application mark: moos-pc-remote.
       Original vector geometry. Every ink is a KDE colour role, and MoOS bakes
       one copy of this file per palette icon theme — MoOS pins
       FollowsColorScheme=false, so nothing re-colours it at runtime. The
       stylesheet below is the MoOS default palette (MoOSUI2Dark) and is what
       every renderer outside those themes shows.
       Regenerate with artwork/generate_moos_app_icons.py. -->
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color: #e8f1ef; }
      .ColorScheme-Background { color: #1d2529; }
      .ColorScheme-Highlight { color: #4ed7c8; }
      .ColorScheme-HighlightedText { color: #142220; }
      .ColorScheme-PositiveText { color: #69d9a5; }
      .ColorScheme-NeutralText { color: #f4c56a; }
      .ColorScheme-NegativeText { color: #ff7d88; }
      .ColorScheme-Accent { color: #4ed7c8; }
    </style>
    <linearGradient id="moos-pc-remote-tile-light" x1="512" y1="72" x2="512" y2="952" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.75" stop-color="#000" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="moos-pc-remote-rim-light" x1="512" y1="72" x2="512" y2="952" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.8" stop-color="#000" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="moos-pc-remote-glow" cx="512" cy="200" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moos-pc-remote-glyph-gradient" x1="512" y1="200" x2="512" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="currentColor" stop-opacity="1.0"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="moos-pc-remote-black">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="moos-pc-remote-white">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- 3D Drop Shadows (Rendered beneath the tile) -->
  <rect fill="url(#moos-pc-remote-black)" opacity="0.05" x="72" y="104" width="880" height="880" rx="232"/>
  <rect fill="url(#moos-pc-remote-black)" opacity="0.10" x="72" y="92" width="880" height="880" rx="232"/>
  <rect fill="url(#moos-pc-remote-black)" opacity="0.15" x="72" y="80" width="880" height="880" rx="232"/>

  <!-- Base Color -->
  <rect class="ColorScheme-Highlight" fill="currentColor" x="72" y="72" width="880" height="880" rx="232"/>
  
  <!-- Liquid Glass Shading -->
  <rect fill="url(#moos-pc-remote-tile-light)" x="72" y="72" width="880" height="880" rx="232"/>
  <rect fill="url(#moos-pc-remote-glow)" x="72" y="72" width="880" height="880" rx="232"/>
  
  <!-- Outer Bevel/Rim -->
  <rect fill="none" stroke="url(#moos-pc-remote-rim-light)" stroke-width="12" x="82" y="82" width="860" height="860" rx="222"/>
  <rect fill="none" stroke="url(#moos-pc-remote-white)" stroke-opacity="0.3" stroke-width="4" x="76" y="76" width="872" height="872" rx="228"/>
  
  <!-- Drop Shadow -->
  <g fill="url(#moos-pc-remote-black)" opacity="0.2" transform="translate(0, 16)">
    <rect x="228" y="230" width="520" height="376" rx="64"/>
    <rect x="433" y="606" width="110" height="56"/>
    <rect x="352" y="662" width="272" height="62" rx="31"/>
    <rect x="552" y="422" width="268" height="404" rx="80"/>
  </g>

  <!-- Desktop Monitor -->
  <g class="ColorScheme-HighlightedText" fill="currentColor">
    <rect x="228" y="230" width="520" height="376" rx="64" fill="url(#moos-pc-remote-glyph-gradient)"/>
    <rect x="433" y="606" width="110" height="56"/>
    <rect x="352" y="662" width="272" height="62" rx="31"/>
  </g>
  <!-- Desktop Screen Bevel/Glow -->
  <rect fill="url(#{name}-white)" opacity="0.15" x="244" y="246" width="488" height="344" rx="48"/>
  <rect class="ColorScheme-Highlight" fill="currentColor" x="296" y="298" width="384" height="240" rx="28"/>
  <rect fill="url(#moos-pc-remote-black)" opacity="0.15" x="296" y="298" width="384" height="240" rx="28"/>

  <!-- Phone shadow on monitor -->
  <rect fill="url(#moos-pc-remote-black)" opacity="0.25" x="536" y="414" width="284" height="420" rx="88"/>

  <!-- Phone Body -->
  <rect class="ColorScheme-Highlight" fill="currentColor" x="552" y="422" width="268" height="404" rx="80"/>
  <rect class="ColorScheme-HighlightedText" fill="currentColor" x="576" y="446" width="220" height="356" rx="58" opacity="0.9"/>
  <!-- Phone Glass Reflection -->
  <rect fill="url(#{name}-white)" opacity="0.12" x="584" y="454" width="204" height="340" rx="50"/>

  <g class="ColorScheme-Highlight" fill="currentColor">
    <rect x="656" y="488" width="60" height="18" rx="9"/>
    <rect x="646" y="742" width="80" height="18" rx="9"/>
  </g>
  <g fill="url(#moos-pc-remote-black)" opacity="0.2">
    <rect x="656" y="492" width="60" height="18" rx="9"/>
    <rect x="646" y="746" width="80" height="18" rx="9"/>
  </g>
</svg>
