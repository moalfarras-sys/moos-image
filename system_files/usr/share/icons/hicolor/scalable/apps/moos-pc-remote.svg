<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="screen" x1="160" y1="180" x2="780" y2="780" gradientUnits="userSpaceOnUse">
