    <radialGradient id="touch"><stop stop-color="#FFF3E8"/><stop offset=".38" stop-color="#FB923C"/><stop offset="1" stop-color="#F43F5E"/></radialGradient>
  </defs>
  <!-- One monitor, one phone and one continuous low-latency signal remain clear at dock size. -->
