<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MoOS UI — Premium 3D Liquid Glass application mark: moos-pc-remote.
       Premium 3D liquid-glass plate with enhanced 7-layer glass material.
       Every ink is a KDE colour role; MoOS bakes one copy of this file per
       palette icon theme (FollowsColorScheme=false).  Glass sheens are white/black
       opacity only — theme-safe material.  No clipPath: every fill is a rounded
       rect so Plasma cannot paint a square scratch behind the squircle.
       Regenerate with artwork/generate_moos_app_icons.py. -->
  <defs>
    <style id="current-color-scheme" type="text/css">.ColorScheme-Text { color:#F3EADB; }.ColorScheme-Background{ color:#201A11; }.ColorScheme-Highlight{ color:#E0A458; }.ColorScheme-HighlightedText{ color:#16120C; }.ColorScheme-PositiveText{ color:#82C99A; }.ColorScheme-NeutralText{ color:#E0A458; }.ColorScheme-NegativeText{ color:#E08B7D; }.ColorScheme-Accent{ color:#E0A458; }</style>
    <linearGradient id="moos-pc-remote-sheen" x1="512" y1="72" x2="512" y2="680"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset="0.15" stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity=".02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="moos-pc-remote-depth" x1="512" y1="320" x2="512" y2="952"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.40" stop-color="#000000" stop-opacity=".04"/>
      <stop offset="0.70" stop-color="#000000" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="moos-pc-remote-shimmer" x1="140" y1="80" x2="880" y2="820"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="0.34" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="0.50" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="moos-pc-remote-refract" x1="120" y1="100" x2="860" y2="780"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="0.46" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moos-pc-remote-caustic" gradientUnits="userSpaceOnUse"
                    cx="280" cy="220" r="460">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".68"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moos-pc-remote-rimlight" gradientUnits="userSpaceOnUse"
                    cx="740" cy="760" r="520">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".25"/>
      <stop offset="0.40" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moos-pc-remote-floor" gradientUnits="userSpaceOnUse"
                    cx="512" cy="800" r="360">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moos-pc-remote-rim-hi" x1="120" y1="60" x2="860" y2="860"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="0.68" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moos-pc-remote-aura" gradientUnits="userSpaceOnUse"
                    cx="512" cy="520" r="580">
      <stop offset="0.60" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#000000" stop-opacity=".14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect fill="url(#moos-pc-remote-aura)" x="36" y="36" width="952" height="952" rx="292"/>
  <rect class="ColorScheme-Highlight" fill="currentColor" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-pc-remote-depth)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-pc-remote-sheen)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-pc-remote-shimmer)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-pc-remote-refract)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-pc-remote-caustic)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-pc-remote-rimlight)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="url(#moos-pc-remote-floor)" x="72" y="72" width="880" height="880" rx="264"/>
  <rect fill="none" stroke="url(#moos-pc-remote-rim-hi)" stroke-width="18" x="84" y="84" width="856" height="856" rx="252"/>
  <rect class="ColorScheme-HighlightedText" fill="none" stroke="currentColor"
        stroke-opacity=".10" stroke-width="6" x="84" y="84" width="856" height="856" rx="252"/>
  <g class="ColorScheme-HighlightedText" fill="currentColor">
    <rect x="228" y="230" width="520" height="376" rx="64"/>
    <rect x="433" y="606" width="110" height="56"/>
    <rect x="352" y="662" width="272" height="62" rx="31"/>
  </g>
  <rect class="ColorScheme-Highlight" fill="currentColor" x="296" y="298" width="384" height="240" rx="28"/>
  <rect class="ColorScheme-Highlight" fill="currentColor" x="552" y="422" width="268" height="404" rx="80"/>
  <rect class="ColorScheme-HighlightedText" fill="currentColor" x="576" y="446" width="220" height="356" rx="58"/>
  <g class="ColorScheme-Highlight" fill="currentColor">
    <rect x="656" y="488" width="60" height="18" rx="9"/>
    <rect x="646" y="742" width="80" height="18" rx="9"/>
  </g>
</svg>
