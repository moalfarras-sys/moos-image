<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MoOS UI — Liquid Glass application mark: moos-store.
       Original vector geometry. Every ink is a KDE colour role, and MoOS bakes
       one copy of this file per palette icon theme — MoOS pins
       FollowsColorScheme=false, so nothing re-colours it at runtime. The
       stylesheet below is the MoOS default palette (MoOSUI2Dark) and is what
       every renderer outside those themes shows.
       Regenerate with artwork/generate_moos_app_icons.py. -->
  <defs>
    <style id="current-color-scheme" type="text/css">.ColorScheme-Text { color:#F3EADB; }.ColorScheme-Background{ color:#201A11; }.ColorScheme-Highlight{ color:#E0A458; }.ColorScheme-HighlightedText{ color:#16120C; }.ColorScheme-PositiveText{ color:#82C99A; }.ColorScheme-NeutralText{ color:#E0A458; }.ColorScheme-NegativeText{ color:#E08B7D; }.ColorScheme-Accent{ color:#E0A458; }</style>
    <linearGradient id="moos-store-sheen" x1="512" y1="72" x2="512" y2="660"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect class="ColorScheme-Highlight" fill="currentColor" x="72" y="72" width="880" height="880" rx="232"/>
  <rect fill="url(#moos-store-sheen)" x="72" y="72" width="880" height="880" rx="232"/>
  <rect class="ColorScheme-HighlightedText" fill="none" stroke="currentColor"
        stroke-opacity=".16" stroke-width="10" x="82" y="82" width="860" height="860" rx="222"/>
  <g class="ColorScheme-HighlightedText" fill="currentColor">
    <path d="M424 452v-22c0-49 39-88 88-88s88 39 88 88v22" fill="none"
          stroke="currentColor" stroke-width="44" stroke-linecap="round"/>
    <path d="M292 452h440l44 330c6 41-26 76-67 76H315c-41 0-73-35-67-76Z"/>
  </g>
</svg>
