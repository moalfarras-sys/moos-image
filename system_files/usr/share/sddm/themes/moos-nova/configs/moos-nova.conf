; MoOS Nova preset — based on SilentSDDM's default.conf
; https://github.com/uiriansan/SilentSDDM/wiki/Customizing
;
; Nova palette:
;   deep navy bg   #050A14   navy base     #0B1220
;   surface        #111A2E   raised        #1A2740
;   electric blue  #2E7BFF   cyan neon     #22D3EE
;   violet         #8B5CF6   text          #E6EDF7
;   secondary text #9FB0C9

[General]
scale = 1.0
enable-animations = true
animated-background-placeholder = ""
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "nova-dark.png"
use-background-color = false
background-color = "#050A14"
blur = 28
brightness = -0.06
saturation = -0.04

[LockScreen.Clock]
display = true
position = "top-center"
align = "center"
format = "hh:mm"
font-family = "IBM Plex Sans"
font-size = 72
font-weight = 600
color = "#E6EDF7"

[LockScreen.Date]
display = true
format = "dddd, MMMM dd, yyyy"
locale = "ar_SY"
font-family = "IBM Plex Sans Arabic"
font-size = 14
font-weight = 500
color = "#9FB0C9"
margin-top = -15

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
text = "اضغط أي مفتاح | Press any key"
font-family = "IBM Plex Sans Arabic"
font-size = 12
font-weight = 400
display-icon = true
icon = "enter.svg"
icon-size = 16
color = "#9FB0C9"
paint-icon = true
spacing = 0

[LoginScreen]
background = "nova-dark.png"
use-background-color = false
background-color = "#050A14"
blur = 48
brightness = -0.12
saturation = -0.05

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 35
active-size = 120
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 2
inactive-border-size = 0
active-border-color = "#2E7BFF"
inactive-border-color = "#1A2740"
always-active = false

[LoginScreen.LoginArea.Username]
font-family = "IBM Plex Sans Arabic"
font-size = 16
font-weight = 700
color = "#E6EDF7"
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 240
height = 36
display-icon = true
font-family = "IBM Plex Sans Arabic"
font-size = 12
icon = "password.svg"
icon-size = 16
content-color = "#E6EDF7"
background-color = "#111A2E"
background-opacity = 0.60
border-size = 1
border-color = "#1A2740"
border-radius-left = 12
border-radius-right = 12
margin-top = 10
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#1A2740"
background-opacity = 0.85
active-background-color = "#2E7BFF"
active-background-opacity = 1.0
icon = "arrow-right.svg"
icon-size = 18
content-color = "#E6EDF7"
active-content-color = "#E6EDF7"
border-size = 0
border-color = "#2E7BFF"
border-radius-left = 12
border-radius-right = 12
margin-left = 5
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "IBM Plex Sans Arabic"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "جارٍ الدخول | Logging in"
font-family = "IBM Plex Sans Arabic"
font-weight = 600
font-size = 14
icon-size = 30
icon = "spinner.svg"
color = "#22D3EE"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "IBM Plex Sans Arabic"
font-size = 11
font-weight = 400
normal-color = "#9FB0C9"
warning-color = "#22D3EE"
error-color = "#8B5CF6"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 50
margin-right = 50
margin-bottom = 50
margin-left = 50
size = 30
border-radius = 5
spacing = 10
font-family = "IBM Plex Sans Arabic"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 30
item-spacing = 2
padding = 5
display-scrollbar = true
margin = 5
background-color = "#0B1220"
background-opacity = 0.92
active-option-background-color = "#2E7BFF"
active-option-background-opacity = 0.35
content-color = "#E6EDF7"
active-content-color = "#E6EDF7"
font-family = "IBM Plex Sans Arabic"
border-size = 1
border-color = "#1A2740"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 200
popup-width = 200
background-color = "#111A2E"
background-opacity = 0.0
active-background-opacity = 0.30
content-color = "#E6EDF7"
active-content-color = "#22D3EE"
border-size = 0
font-size = 10
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = true
background-color = "#111A2E"
background-opacity = 0.0
active-background-opacity = 0.30
content-color = "#E6EDF7"
active-content-color = "#22D3EE"
border-size = 0
font-size = 10
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-right"
index = 0
background-color = "#111A2E"
background-opacity = 0.0
active-background-opacity = 0.30
content-color = "#E6EDF7"
active-content-color = "#22D3EE"
border-size = 0
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 100
background-color = "#111A2E"
background-opacity = 0.0
active-background-opacity = 0.30
content-color = "#E6EDF7"
active-content-color = "#22D3EE"
border-size = 0
icon = "power.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#0B1220"
background-opacity = 0.95
key-content-color = "#E6EDF7"
key-color = "#1A2740"
key-opacity = 0.9
key-active-background-color = "#2E7BFF"
key-active-opacity = 1.0
selection-background-color = "#2E7BFF"
selection-content-color = "#E6EDF7"
primary-color = "#2E7BFF"
border-size = 0
border-color = "#050A14"
restrict-input = "none"

[Tooltips]
enable = true
font-family = "IBM Plex Sans Arabic"
font-size = 11
content-color = "#E6EDF7"
background-color = "#0B1220"
background-opacity = 0.9
border-radius = 5
disable-user = false
disable-login-button = false
