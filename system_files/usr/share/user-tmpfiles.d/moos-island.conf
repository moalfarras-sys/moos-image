# The MoOS Island's presence folders exist BEFORE plasmashell starts.
#
# Each Island chip is a Qt FolderListModel on one of these folders: its producer writes state into
# a file NAME, and the model reports names (tests/test_island_tokens.py). A FolderListModel started
# on a folder that does not exist yet goes to status Null, installs no watch, and NEVER notices the
# folder being created later. Every producer creates its folder lazily, on its first token, which
# is usually long after login: measured on the station, plasmashell started at 20:57 and
# moai-control created moai-jobs at 23:07, so an Island started at login could not have shown a
# single Mo AI job until the shell restarted, and the runtime directory is empty again next login.
#
# The user manager runs systemd-tmpfiles-setup.service Before=basic.target, and
# plasma-plasmashell.service is After=basic.target, so these exist before the Island loads. No
# producer removes its folder; each keeps creating it with exist_ok, so both orders stay correct.
# One line per folder the Island watches; tests/test_island_tokens.py keeps them equal.
#
# Type Path                  Mode User Group Age Argument
d     %t/mo-remote           0700 -    -     -   -
d     %t/moos-privacy        0700 -    -     -   -
d     %t/moos-store          0700 -    -     -   -
d     %t/moai-jobs           0700 -    -     -   -
