# MoOS Horizon Bar — canonical definition.
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH for the MoOS dock. Every consumer —
# /usr/bin/moos-bar-apply (the live applier + verifier), moos-apply-theme (login
# repair), moos-selfcheck (health gate) and layout.js (the new-profile seed) —
# must agree with it, and tests/test_moos_bar_single_source.py fails the build if
# any of them drifts. Change the bar here, then regenerate the mirrors and let the
# gate prove they agree.
#
# Why layout.js still contains hardcoded copies: a Plasma layout template runs in
# a sandbox that cannot read files, so the new-profile seed must carry its values
# literally. The gate pins those literals to THIS file; they are a mirror, not a
# second source.
#
# The bar is TWO glass slabs, not one. A single floating panel cannot centre the
# task area: Plasma's fit-length centres the whole applet strip, and the system
# zone (tray + clock) outweighs the brand button by ~450 physical pixels, so the
# tasks sat ~300 logical px left of the true centre (measured). Plasma has no
# flexible spacer applet. Splitting the roles into a CENTERED dock capsule and a
# CORNER system capsule is the one mechanical way to give the task area the true
# screen centre on every screen and at every task count. Both slabs are the same
# glass — the two read as one design system.
#
# INI, sections lower-case, keys lower-case, values on one line. No quoting, no
# inline comments. moos-bar-apply parses with awk/grep/sed; the gate parses the
# same lines with Python. Keep the format parseable by both.

[bar]
height=54
location=bottom
floating=true

# The CENTERED capsule: the fixed MoOS home button, then the running/pinned apps.
# fit-length centres the whole slab, so brand+tasks is always the true screen
# centre no matter how many tasks are open.
[dock]
lengthMode=fit
alignment=center
applets=brand;tasks

# The CORNER capsule: everyday system toggles + the clock. aligned to the screen
# corner; in an RTL session Plasma mirrors it to the opposite corner.
[system]
lengthMode=fit
alignment=right
applets=tray;separator;clock

# Zone roles. Each role names one applet id and each panel above lists its roles.
[brand]
applet=org.moos.brand
popupWidth=792
popupHeight=576

[tasks]
applet=org.kde.plasma.icontasks
# defaultLaunchers is the seed a NEW profile receives (layout.js). An existing
# user's pinned launchers are their own; moos-apply-theme only ever ADDS missing
# MoOS apps, it never rewrites the list.
defaultLaunchers=applications:org.moos.moai.desktop,applications:org.moos.store.desktop,preferred://browser,applications:org.moos.moplayer.desktop,applications:org.kde.dolphin.desktop,applications:org.moos.remote.desktop

[separator]
applet=org.kde.plasma.marginsseparator

# shownItems: the everyday system toggles always visible in the corner — Wi-Fi,
# Bluetooth, volume, brightness, notifications and the keyboard/language
# indicator. The keyboard indicator was deliberately unlisted in rev 29 and the
# user asked for it back: with several layouts configured it can drop out of the
# tray entirely, so it is pinned here. Everything else auto-shows only when it has
# something to say.
[tray]
applet=org.kde.plasma.systemtray
shownItems=org.kde.plasma.networkmanagement,org.kde.plasma.bluetooth,org.kde.plasma.volume,org.kde.plasma.brightness,org.kde.plasma.notifications,org.kde.plasma.keyboardlayout

[clock]
applet=org.moos.nova.clock

# Future slot: the smart-status zone (Mo AI state, Mo PC Remote session, pending
# updates). It will sit on the LEFT as the mirror of the system capsule — the
# balanced pair is what completes the composition on very wide screens.
[smart]
applet=
