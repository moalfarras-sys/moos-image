# MoOS Horizon Bar — canonical definition.
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH for the MoOS dock. Every consumer —
# /usr/bin/moos-bar-apply (the live applier + verifier), moos-apply-theme (login
# repair), moos-selfcheck (health gate) and layout.js (the new-profile seed) —
# must agree with it, and the gates in tests/verify_user_experience.py fail the
# build if any of them drifts. Change the bar here, then regenerate the mirrors
# and let the gate prove they agree.
#
# Why layout.js still contains hardcoded copies: a Plasma layout template runs in
# a sandbox that cannot read files, so the new-profile seed must carry its values
# literally. The gate pins those literals to THIS file; they are a mirror, not a
# second source.
#
# THE BAR IS ONE PANEL. ONE GLASS CAPSULE. This is not a preference, it is the
# design — and it has been re-decided the hard way.
#
# Rev 30 split the roles into two slabs (a centred dock capsule and a corner
# system capsule) to give the task area the true screen centre, because Plasma
# has no flexible spacer applet and the system zone outweighs the brand button
# by ~450 physical px. That reasoning was sound and the result was WRONG: it
# ships as two detached pieces of glass with a wide gap between them, the clock
# and tray marooned in the corner away from everything else. The owner rejected
# it on sight on the real machine, having already removed that layout once
# before. Perfect centring is not worth breaking the object in half.
#
# So: one panel, `lengthMode=fit` + `alignment=center`, hugging its content. The
# task area sits a little off the geometric centre because the system zone is
# heavier — that asymmetry is ACCEPTED and is not a bug to fix by splitting the
# bar again. If it is ever addressed, it must be inside ONE surface (a balancing
# spacer applet, or a launcher/system zone of matched width). Any change that
# produces a second bottom panel is a regression and is gated against.
#
# INI, sections lower-case, keys lower-case, values on one line. No quoting, no
# inline comments. moos-bar-apply parses with awk/grep/sed; the gate parses the
# same lines with Python. Keep the format parseable by both.

[bar]
height=54
location=bottom
floating=true
lengthMode=fit
alignment=center

# The applet order, start edge first. Plasma mirrors it in an RTL session, so
# this single order gives Arabic the MoOS button on the right and the clock on
# the left, and English the exact mirror — no second definition, no RTL branch.
# The margins separator is the ONLY divider: it adds spacing, it draws nothing,
# so the glass behind the whole row stays one continuous surface.
applets=brand;island;tasks;separator;tray;clock

# Zone roles. Each role names one applet id; [bar] applets above lists the order.
[brand]
applet=org.moos.brand
popupWidth=792
popupHeight=576

# The adaptive media island is a true panel zone immediately after the MoOS
# launcher. At idle its compact representation occupies one transparent pixel;
# Mpris2Model expands it only for a real Playing/Paused player. It is explicitly
# not a tray extra: the panel representation needs horizontal room for artwork,
# title, source and contextual controls.
[island]
applet=org.moos.island

[tasks]
applet=org.kde.plasma.icontasks
# defaultLaunchers is the seed a NEW profile receives (layout.js). An existing
# user's pinned launchers are their own; moos-apply-theme only ever ADDS missing
# MoOS apps, it never rewrites the list.
defaultLaunchers=applications:org.moos.moai.desktop,applications:org.moos.store.desktop,preferred://browser,applications:org.moos.moplayer.desktop,applications:org.kde.dolphin.desktop,applications:org.moos.remote.desktop

[separator]
applet=org.kde.plasma.marginsseparator

# THE THREE TRAY LISTS, AND WHY EACH ENTRY IS WHERE IT IS.
#
#   shownItems  FORCED visible, whatever the item's own status says.
#   extraItems  KNOWN to the tray; each item's Active/Passive status decides.
#   hiddenItems always behind the arrow.
#
# shownItems is deliberately SHORT: only what a person reaches for without
# thinking. extraItems is deliberately COMPLETE: Plasma instantiates only the
# internal applets named there on a freshly constructed tray. Merely putting an
# id in shownItems paints no applet and, critically, leaves
# org.freedesktop.Notifications unowned. That exact state shipped as four names
# in config but one real inner applet (org.moos.island), so notifications blocked
# for sixty seconds and never appeared. Bluetooth and brightness remain AUTO —
# loaded, but visible only when their own status asks for space.
#
[tray]
applet=org.kde.plasma.systemtray
shownItems=org.kde.plasma.networkmanagement,org.kde.plasma.volume,org.kde.plasma.notifications,org.kde.plasma.keyboardlayout
extraItems=org.kde.plasma.networkmanagement,org.kde.plasma.volume,org.kde.plasma.notifications,org.kde.plasma.keyboardlayout,org.kde.plasma.bluetooth,org.kde.plasma.brightness

[clock]
applet=org.moos.nova.clock
