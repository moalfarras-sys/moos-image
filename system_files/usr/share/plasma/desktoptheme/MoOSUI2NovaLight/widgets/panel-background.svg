<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="176" height="76" viewBox="0 0 176 76">
  <!-- MoOS UI Liquid Glass dock. Dark and Light share this exact geometry.
       Tuned to the SAME glass system as the popup master (dialog-background):
       balanced translucency + a crisp luminous top edge, so the always-on dock
       and the popups that rise from it read as one material, not two. The dock
       stays a touch more opaque than a transient popup on purpose — it is always
       over live wallpaper and must keep tray-icon and clock contrast crisp.

       THE RIM IS ONE CONTINUOUS LIGHT, not four independent edges. It is lit
       from above: full brightness along the top, fading as it turns each top
       corner, dissolving to nothing part-way down the sides. Three earlier
       defects are fixed here and each was visible on the maintainer's 4K dock:

       1. A STRAY VERTICAL LINE fell from the top-left corner. The accent band
          was written `V18H17V2A16 16 0 0 0 1 18Z` — the `V18` ran the pen from
          (18,0) all the way down to (18,18) before doubling back, enclosing a
          1x16 turquoise rectangle that has nothing to do with a corner radius.
          Its inner arc was also off-centre (SVG solves it about (17,18), not
          the corner's own centre (18,18)). A corner band is an ANNULUS: outer
          arc, radial step, inner arc about the SAME centre, close. Nothing else.
       2. THE RIM STOPPED DEAD where the corner met the side. The corners were
          flat 0.46/0.14 while `left` was a flat 0.18 and `right` a
          flat 0.24 of a DIFFERENT colour — so the light visibly cut out at the
          tile seam, and the two sides did not even match each other. Corners now
          fade along the turn and the sides pick the light up at exactly the
          value the corner hands over (see the junction arithmetic below).
       3. The edge read as a printed neon outline because nothing lit the glass
          behind it. A soft accent bleed now falls ~15px into the material, so
          the rim reads as light ON glass rather than a line drawn over it.

       Keep every piece FILL-ONLY — no outlined paths. An outline inflates the
       FrameSvg element bbox by half its width and the stretch factor magnifies
       that overhang into a transparent tear across the dock (seen on hardware).
       verify_user_experience greps this file for the word and fails the build. -->
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Background { color: #C6DCE9; }
    .ColorScheme-Highlight  { color: #0E63C4; }
    .ColorScheme-Text       { color: #17302E; }
  </style>
  <defs>
    <linearGradient id="ui2-panel-glass" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="60">
      <stop offset="0" stop-color="#C2DAE6" stop-opacity="0.82"/>
      <stop offset="0.18" stop-color="#B9D4E0" stop-opacity="0.87"/>
      <stop offset="0.70" stop-color="#AECDD8" stop-opacity="0.91"/>
      <stop offset="1" stop-color="#AECDD8" stop-opacity="0.93"/>
    </linearGradient>

    <!-- Light bleeding down from the lit edge INTO the glass. Every stop is
         <= 0.93 on purpose: test_glass_surfaces_keep_rounded_blur_masks reads
         every stop-opacity in this file to hold the KWin frost ceiling, and a
         decorative 1.0 here would read as opaque dock glass to that gate. The
         element's own fill-opacity (0.10) sets the real strength. -->
    <linearGradient id="ui2-rim-bleed" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="15">
      <stop offset="0" stop-color="#0E63C4" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#0E63C4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0E63C4" stop-opacity="0"/>
    </linearGradient>

    <!-- The turn. Full light where the corner meets the top edge, handing over
         0.20 (luminous) / 0.12 (accent) of its own fill-opacity to the side
         hairline below it — the side gradients start at those exact values, so
         the seam between the corner tile and the side tile carries no step. -->
    <linearGradient id="ui2-turn-lum-left" gradientUnits="userSpaceOnUse" x1="18" y1="0" x2="0" y2="18">
      <stop offset="0" stop-color="#1A76D8" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#1A76D8" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#1A76D8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="ui2-turn-lum-right" gradientUnits="userSpaceOnUse" x1="42" y1="0" x2="60" y2="18">
      <stop offset="0" stop-color="#1A76D8" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#1A76D8" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#1A76D8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="ui2-turn-acc-left" gradientUnits="userSpaceOnUse" x1="18" y1="0" x2="0" y2="18">
      <stop offset="0" stop-color="#0E63C4" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#0E63C4" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#0E63C4" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="ui2-turn-acc-right" gradientUnits="userSpaceOnUse" x1="42" y1="0" x2="60" y2="18">
      <stop offset="0" stop-color="#0E63C4" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#0E63C4" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#0E63C4" stop-opacity="0.12"/>
    </linearGradient>

    <!-- The sides. Same vertical run for left and right — the dock is lit from
         above, so both flanks dissolve identically. `hint-stretch-borders` is
         present, so these 24px-tall tiles are STRETCHED (not tiled) over the
         panel's inner height and the fade spans the whole flank. -->
    <linearGradient id="ui2-side-lum" gradientUnits="userSpaceOnUse" x1="0" y1="18" x2="0" y2="42">
      <stop offset="0" stop-color="#1A76D8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#1A76D8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ui2-side-acc" gradientUnits="userSpaceOnUse" x1="0" y1="18" x2="0" y2="42">
      <stop offset="0" stop-color="#0E63C4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0E63C4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Corner bands are annuli about the corner's own centre (18,18) / (42,18):
       outer arc r=18, radial step, inner arc r=18-thickness, close.
       bleed r18->3 (15 deep) · accent r18->16 (2px) · luminous r18->17 (1px). -->
  <g id="topleft">
    <path d="M0 18A18 18 0 0 1 18 0V18Z" fill="url(#ui2-panel-glass)"/>
    <path d="M0 18A18 18 0 0 1 18 0V15A3 3 0 0 0 15 18Z" fill="url(#ui2-rim-bleed)" fill-opacity="0.10"/>
    <path d="M0 18A18 18 0 0 1 18 0V2A16 16 0 0 0 2 18Z" fill="url(#ui2-turn-acc-left)" fill-opacity="0.14"/>
    <path d="M0 18A18 18 0 0 1 18 0V1A17 17 0 0 0 1 18Z" fill="url(#ui2-turn-lum-left)" fill-opacity="0.46"/>
  </g>
  <g id="topright">
    <path d="M42 0A18 18 0 0 1 60 18H42Z" fill="url(#ui2-panel-glass)"/>
    <path d="M42 0A18 18 0 0 1 60 18H45A3 3 0 0 0 42 15Z" fill="url(#ui2-rim-bleed)" fill-opacity="0.10"/>
    <path d="M42 0A18 18 0 0 1 60 18H58A16 16 0 0 0 42 2Z" fill="url(#ui2-turn-acc-right)" fill-opacity="0.14"/>
    <path d="M42 0A18 18 0 0 1 60 18H59A17 17 0 0 0 42 1Z" fill="url(#ui2-turn-lum-right)" fill-opacity="0.46"/>
  </g>
  <g id="bottomleft">
    <path d="M18 60A18 18 0 0 1 0 42H18Z" fill="url(#ui2-panel-glass)"/>
    <path d="M18 60A18 18 0 0 1 0 42H1A17 17 0 0 0 18 59Z" fill="#527F79" fill-opacity="0.30"/>
  </g>
  <g id="bottomright">
    <path d="M60 42A18 18 0 0 1 42 60V42Z" fill="url(#ui2-panel-glass)"/>
    <path d="M60 42A18 18 0 0 1 42 60V59A17 17 0 0 0 59 42Z" fill="#527F79" fill-opacity="0.30"/>
  </g>
  <g id="top"><rect x="18" width="24" height="18" fill="url(#ui2-panel-glass)"/><rect x="18" width="24" height="15" fill="url(#ui2-rim-bleed)" fill-opacity="0.10"/><rect x="18" width="24" height="2" fill="#0E63C4" fill-opacity="0.14"/><rect x="18" width="24" height="1" fill="#1A76D8" fill-opacity="0.46"/></g>
  <g id="bottom"><rect x="18" y="42" width="24" height="18" fill="url(#ui2-panel-glass)"/><rect x="18" y="59" width="24" height="1" fill="#527F79" fill-opacity="0.30"/></g>
  <g id="left"><rect y="18" width="18" height="24" fill="url(#ui2-panel-glass)"/><rect y="18" width="2" height="24" fill="url(#ui2-side-acc)" fill-opacity="0.14"/><rect y="18" width="1" height="24" fill="url(#ui2-side-lum)" fill-opacity="0.46"/></g>
  <g id="right"><rect x="42" y="18" width="18" height="24" fill="url(#ui2-panel-glass)"/><rect x="58" y="18" width="2" height="24" fill="url(#ui2-side-acc)" fill-opacity="0.14"/><rect x="59" y="18" width="1" height="24" fill="url(#ui2-side-lum)" fill-opacity="0.46"/></g>
  <rect id="center" x="18" y="18" width="24" height="24" fill="url(#ui2-panel-glass)"/>

  <path id="mask-topleft" d="M88 18A18 18 0 0 1 106 0V18Z" fill="#000"/>
  <path id="mask-topright" d="M130 0A18 18 0 0 1 148 18H130Z" fill="#000"/>
  <path id="mask-bottomleft" d="M106 60A18 18 0 0 1 88 42H106Z" fill="#000"/>
  <path id="mask-bottomright" d="M148 42A18 18 0 0 1 130 60V42Z" fill="#000"/>
  <rect id="mask-top" x="106" width="24" height="18" fill="#000"/>
  <rect id="mask-bottom" x="106" y="42" width="24" height="18" fill="#000"/>
  <rect id="mask-left" x="88" y="18" width="18" height="24" fill="#000"/>
  <rect id="mask-right" x="130" y="18" width="18" height="24" fill="#000"/>
  <rect id="mask-center" x="106" y="18" width="24" height="24" fill="#000"/>

  <rect id="hint-top-margin" x="158" y="0" width="4" height="7" fill="none"/>
  <rect id="hint-bottom-margin" x="158" y="11" width="4" height="7" fill="none"/>
  <rect id="hint-left-margin" x="154" y="22" width="7" height="4" fill="none"/>
  <rect id="hint-right-margin" x="165" y="22" width="7" height="4" fill="none"/>
  <rect id="hint-top-inset" x="158" y="32" width="4" height="1e-8" fill="none"/>
  <rect id="hint-bottom-inset" x="158" y="36" width="4" height="1e-8" fill="none"/>
  <rect id="hint-left-inset" x="154" y="42" width="1e-8" height="4" fill="none"/>
  <rect id="hint-right-inset" x="165" y="42" width="1e-8" height="4" fill="none"/>
  <rect id="hint-stretch-borders" x="158" y="52" width="4" height="4" fill="none"/>
</svg>
