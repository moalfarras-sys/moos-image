<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="144" height="20" viewBox="0 0 144 20">
  <!-- MoOS radio states with a clear focus halo. -->
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Background { color: #C6DCE9; }
    .ColorScheme-Highlight { color: #0E63C4; }
    .ColorScheme-Text { color: #17302E; }
    .ColorScheme-ButtonBackground { color: #BFD7E4; }
    .ColorScheme-ButtonText { color: #17302E; }
  </style>
  <g id="normal"><circle cx="10" cy="10" r="8" fill="#C6DCE9" stroke="#527F79" stroke-width="1.2"/></g>
  <g id="hover"><circle cx="30" cy="10" r="8" fill="#BFD7E4" stroke="#1A76D8" stroke-width="1.4"/></g>
  <g id="focus"><circle cx="50" cy="10" r="8" fill="#C6DCE9" stroke="#1A76D8" stroke-width="2"/></g>
  <g id="checked"><circle cx="70" cy="10" r="8" fill="#0E63C4" stroke="#1A76D8" stroke-width="1.2"/><circle cx="70" cy="10" r="3.2" fill="#F7FBFF"/></g>
  <circle id="symbol" cx="90" cy="10" r="3.2" fill="#F7FBFF"/>
  <circle id="shadow" cx="110" cy="11" r="4" fill="#668681" fill-opacity="0.24"/>
  <rect id="hint-size" x="122" y="0" width="20" height="20" fill="none"/>
</svg>
