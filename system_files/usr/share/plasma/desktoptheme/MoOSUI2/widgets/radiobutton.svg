<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="144" height="20" viewBox="0 0 144 20">
  <!-- MoOS radio states with a clear focus halo. -->
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Background { color: #1D2529; }
    .ColorScheme-Highlight { color: #4ED7C8; }
    .ColorScheme-Text { color: #E8F1EF; }
    .ColorScheme-ButtonBackground { color: #2C383E; }
    .ColorScheme-ButtonText { color: #E8F1EF; }
  </style>
  <g id="normal"><circle cx="10" cy="10" r="8" fill="#1D2529" stroke="#415158" stroke-width="1.2"/></g>
  <g id="hover"><circle cx="30" cy="10" r="8" fill="#2C383E" stroke="#A8F1E8" stroke-width="1.4"/></g>
  <g id="focus"><circle cx="50" cy="10" r="8" fill="#1D2529" stroke="#A8F1E8" stroke-width="2"/></g>
  <g id="checked"><circle cx="70" cy="10" r="8" fill="#4ED7C8" stroke="#A8F1E8" stroke-width="1.2"/><circle cx="70" cy="10" r="3.2" fill="#142220"/></g>
  <circle id="symbol" cx="90" cy="10" r="3.2" fill="#142220"/>
  <circle id="shadow" cx="110" cy="11" r="4" fill="#111619" fill-opacity="0.24"/>
  <rect id="hint-size" x="122" y="0" width="20" height="20" fill="none"/>
</svg>
