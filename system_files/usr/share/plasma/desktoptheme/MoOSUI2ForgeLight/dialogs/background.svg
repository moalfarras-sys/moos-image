<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="224" height="72" viewBox="0 0 224 72">
  <!--
    MoOS UI2 Tidal Glass popup master.

    The nine mask-* pieces are not decorative duplication: Plasma uses them as
    the KWin blur region. Without that complete rounded mask a translucent
    popup is either blurred as a square or not frosted at all. The painted
    frame uses one quiet neutral rim; split accent and luminous bands produced
    clipped corner joins when Plasma scaled a launcher popup.
  -->
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Background { color: #C4DED1; }
    .ColorScheme-Highlight  { color: #1A7F37; }
    .ColorScheme-Text       { color: #17302E; }
  </style>
  <defs>
    <linearGradient id="ui2-dialog-glass" gradientUnits="userSpaceOnUse"
                    x1="0" y1="0" x2="0" y2="64">
      <stop offset="0" stop-color="#C4DED1" stop-opacity="0.82"/>
      <stop offset="0.16" stop-color="#CEE4D8" stop-opacity="0.85"/>
      <stop offset="0.72" stop-color="#CAE2D5" stop-opacity="0.90"/>
      <stop offset="1" stop-color="#CAE2D5" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <g id="topleft">
    <path d="M0 18A18 18 0 0 1 18 0V18Z" fill="url(#ui2-dialog-glass)"/>
    <path d="M0 18A18 18 0 0 1 18 0V1A17 17 0 0 0 1 18Z"
          fill="#527F79" fill-opacity="0.26"/>
  </g>
  <g id="topright">
    <path d="M46 0A18 18 0 0 1 64 18H46Z" fill="url(#ui2-dialog-glass)"/>
    <path d="M46 0A18 18 0 0 1 64 18H63A17 17 0 0 0 46 1Z"
          fill="#527F79" fill-opacity="0.26"/>
  </g>
  <g id="bottomleft">
    <path d="M18 64A18 18 0 0 1 0 46H18Z" fill="url(#ui2-dialog-glass)"/>
    <path d="M18 64A18 18 0 0 1 0 46H1A17 17 0 0 0 18 63Z"
          fill="#527F79" fill-opacity="0.26"/>
  </g>
  <g id="bottomright">
    <path d="M64 46A18 18 0 0 1 46 64V46Z" fill="url(#ui2-dialog-glass)"/>
    <path d="M64 46A18 18 0 0 1 46 64V63A17 17 0 0 0 63 46Z"
          fill="#527F79" fill-opacity="0.26"/>
  </g>
  <g id="top">
    <rect x="18" width="28" height="18" fill="url(#ui2-dialog-glass)"/>
    <rect x="18" width="28" height="1" fill="#527F79" fill-opacity="0.26"/>
  </g>
  <g id="bottom">
    <rect x="18" y="46" width="28" height="18" fill="url(#ui2-dialog-glass)"/>
    <rect x="18" y="63" width="28" height="1" fill="#527F79" fill-opacity="0.26"/>
  </g>
  <g id="left">
    <rect y="18" width="18" height="28" fill="url(#ui2-dialog-glass)"/>
    <rect y="18" width="1" height="28" fill="#527F79" fill-opacity="0.26"/>
  </g>
  <g id="right">
    <rect x="46" y="18" width="18" height="28" fill="url(#ui2-dialog-glass)"/>
    <rect x="63" y="18" width="1" height="28" fill="#527F79" fill-opacity="0.26"/>
  </g>
  <rect id="center" x="18" y="18" width="28" height="28"
        fill="url(#ui2-dialog-glass)"/>

  <!-- Rounded KWin blur mask: exact geometry of the painted 64×64 frame. -->
  <path id="mask-topleft" d="M80 18A18 18 0 0 1 98 0V18Z" fill="#000"/>
  <rect id="mask-top" x="98" width="28" height="18" fill="#000"/>
  <path id="mask-topright" d="M126 0A18 18 0 0 1 144 18H126Z" fill="#000"/>
  <rect id="mask-left" x="80" y="18" width="18" height="28" fill="#000"/>
  <rect id="mask-center" x="98" y="18" width="28" height="28" fill="#000"/>
  <rect id="mask-right" x="126" y="18" width="18" height="28" fill="#000"/>
  <path id="mask-bottomleft" d="M98 64A18 18 0 0 1 80 46H98Z" fill="#000"/>
  <rect id="mask-bottom" x="98" y="46" width="28" height="18" fill="#000"/>
  <path id="mask-bottomright" d="M144 46A18 18 0 0 1 126 64V46Z" fill="#000"/>

  <rect id="hint-top-margin" x="164" y="0" width="4" height="12" fill="none"/>
  <rect id="hint-bottom-margin" x="164" y="16" width="4" height="12" fill="none"/>
  <rect id="hint-left-margin" x="160" y="32" width="12" height="4" fill="none"/>
  <rect id="hint-right-margin" x="176" y="32" width="12" height="4" fill="none"/>
  <rect id="hint-top-inset" x="164" y="42" width="4" height="1e-8" fill="none"/>
  <rect id="hint-bottom-inset" x="164" y="46" width="4" height="1e-8" fill="none"/>
  <rect id="hint-left-inset" x="160" y="52" width="1e-8" height="4" fill="none"/>
  <rect id="hint-right-inset" x="176" y="52" width="1e-8" height="4" fill="none"/>
  <rect id="hint-stretch-borders" x="164" y="60" width="4" height="4" fill="none"/>
</svg>
