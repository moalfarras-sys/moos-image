<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="144" height="20" viewBox="0 0 144 20">
  <!-- MoOS radio states with a clear focus halo. -->
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Background { color: #C9E2DD; }
    .ColorScheme-Highlight { color: #006D67; }
    .ColorScheme-Text { color: #17302E; }
    .ColorScheme-ButtonBackground { color: #B8D8D2; }
    .ColorScheme-ButtonText { color: #17302E; }
  </style>
  <g id="normal"><circle cx="10" cy="10" r="8" fill="#C9E2DD" stroke="#527F79" stroke-width="1.2"/></g>
  <g id="hover"><circle cx="30" cy="10" r="8" fill="#B8D8D2" stroke="#0B6965" stroke-width="1.4"/></g>
  <g id="focus"><circle cx="50" cy="10" r="8" fill="#C9E2DD" stroke="#0B6965" stroke-width="2"/></g>
  <g id="checked"><circle cx="70" cy="10" r="8" fill="#006D67" stroke="#0B6965" stroke-width="1.2"/><circle cx="70" cy="10" r="3.2" fill="#E1F0EC"/></g>
  <circle id="symbol" cx="90" cy="10" r="3.2" fill="#E1F0EC"/>
  <circle id="shadow" cx="110" cy="11" r="4" fill="#668681" fill-opacity="0.24"/>
  <rect id="hint-size" x="122" y="0" width="20" height="20" fill="none"/>
</svg>
