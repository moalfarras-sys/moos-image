<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="144" height="20" viewBox="0 0 144 20">
  <!-- MoOS radio states with a clear focus halo. -->
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Background { color: #111A2E; }
    .ColorScheme-Highlight { color: #6366F1; }
    .ColorScheme-Text { color: #EAF2FF; }
    .ColorScheme-ButtonBackground { color: #1E2E4A; }
    .ColorScheme-ButtonText { color: #EAF2FF; }
  </style>
  <g id="normal"><circle cx="10" cy="10" r="8" fill="#111A2E" stroke="#26364F" stroke-width="1.2"/></g>
  <g id="hover"><circle cx="30" cy="10" r="8" fill="#1E2E4A" stroke="#A5B4FC" stroke-width="1.4"/></g>
  <g id="focus"><circle cx="50" cy="10" r="8" fill="#111A2E" stroke="#A5B4FC" stroke-width="2"/></g>
  <g id="checked"><circle cx="70" cy="10" r="8" fill="#6366F1" stroke="#A5B4FC" stroke-width="1.2"/><circle cx="70" cy="10" r="3.2" fill="#020617"/></g>
  <circle id="symbol" cx="90" cy="10" r="3.2" fill="#020617"/>
  <circle id="shadow" cx="110" cy="11" r="4" fill="#060B16" fill-opacity="0.24"/>
  <rect id="hint-size" x="122" y="0" width="20" height="20" fill="none"/>
</svg>
