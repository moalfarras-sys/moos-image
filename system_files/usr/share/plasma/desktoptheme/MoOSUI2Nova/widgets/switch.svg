  <g id="handle"><circle cx="43" cy="7" r="7" fill="#EAF2FF"/><circle cx="43" cy="7" r="6" fill="#16233A"/></g>
  <g id="handle-hover"><circle cx="61" cy="7" r="8" fill="#A5B4FC" fill-opacity="0.42"/><circle cx="61" cy="7" r="6" fill="#EAF2FF"/></g>
  <g id="handle-focus"><circle cx="81" cy="7" r="9" fill="none" stroke="#A5B4FC" stroke-width="2"/><circle cx="81" cy="7" r="6" fill="#EAF2FF"/></g>
  <g id="handle-pressed"><circle cx="101" cy="7" r="7" fill="#6366F1"/><circle cx="101" cy="7" r="4" fill="#020617"/></g>
  <circle id="handle-shadow" cx="119" cy="8" r="7" fill="#060B16" fill-opacity="0.28"/>
