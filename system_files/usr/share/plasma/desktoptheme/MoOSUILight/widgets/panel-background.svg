    <rect x="16" y="0" width="24" height="1" fill="#F3DDE8" fill-opacity="0.2"/>
  </g>
  <g id="bottom">
    <rect x="16" y="40" width="24" height="16" fill="url(#nova-glass)"/>
    <rect x="16" y="55" width="24" height="1" fill="#F3DDE8" fill-opacity="0.05"/>
  </g>
  <g id="left">
    <rect x="0" y="16" width="16" height="24" fill="url(#nova-glass)"/>
    <rect x="0" y="16" width="1" height="24" fill="#F3DDE8" fill-opacity="0.11"/>
  </g>
  <g id="right">
