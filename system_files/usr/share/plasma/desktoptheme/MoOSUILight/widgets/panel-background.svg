    <path d="M 0,16 A 16,16 0 0 1 16,0 L 16,1.0 A 15.0,15.0 0 0 0 1.0,16 Z" fill="#F3DDE8" fill-opacity="0.2"/>
  </g>
  <g id="topright">
    <path d="M 40,0 A 16,16 0 0 1 56,16 L 40,16 Z" fill="url(#nova-glass)"/>
    <path d="M 40,0 A 16,16 0 0 1 56,16 L 55.0,16 A 15.0,15.0 0 0 0 40,1.0 Z" fill="#F3DDE8" fill-opacity="0.2"/>
  </g>
  <g id="bottomleft">
