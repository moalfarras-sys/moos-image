  <rect id="center" x="16" y="16" width="24" height="24" fill="url(#nova-glass)"/>
  <path id="mask-topleft" d="M 80,16 A 16,16 0 0 1 96,0 L 96,16 Z" fill="#000000"/>
  <path id="mask-topright" d="M 120,0 A 16,16 0 0 1 136,16 L 120,16 Z" fill="#000000"/>
  <path id="mask-bottomleft" d="M 96,56 A 16,16 0 0 1 80,40 L 96,40 Z" fill="#000000"/>
  <path id="mask-bottomright" d="M 136,40 A 16,16 0 0 1 120,56 L 120,40 Z" fill="#000000"/>
