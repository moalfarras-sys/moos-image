<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="70" viewBox="0 0 160 70">
  <!-- MoOS UI — floating glass dock. Original art. -->
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Background { color: #5A4556; }
    .ColorScheme-Highlight  { color: #A855F7; }
    .ColorScheme-Text       { color: #2D222D; }
  </style>
  <defs>
    <linearGradient id="nova-glass" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="56">
      <stop offset="0" stop-color="#8B7082" stop-opacity="0.56"/>
      <stop offset="0.55" stop-color="#705969" stop-opacity="0.60"/>
      <stop offset="1" stop-color="#4B3948" stop-opacity="0.68"/>
    </linearGradient>
  </defs>
  <g id="topleft">
