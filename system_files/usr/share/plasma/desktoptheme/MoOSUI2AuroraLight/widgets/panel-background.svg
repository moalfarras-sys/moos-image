<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="176" height="76" viewBox="0 0 176 76">
  <!-- MoOS UI Liquid Glass dock — frosted profile. Dark and Light share this
       exact geometry; only the palette tokens diverge.

       THE DOCK IS FROSTED GLASS, not lit glass. The maintainer's 4K dock grew
       a luminous top crest and a bright 1px rim (a lit-from-above "Horizon
       Bar"); the owner asked for it gone: "زجاج ضبابي بدون ضلال ابيض و خطوط
       بالاعلى" — frosted glass, no white glow, no lines on top, smooth
       everywhere, no sharp edges. So the dock now carries NO light of its own:
       no crest band, no luminous hairline, no accent rim. The only edge
       cue left is a faint 0.14 hairline at the bottom that settles
       the capsule against busy wallpaper.

       WHY THIS READS AS FROSTED: the KWin blur effect (the family-wide frost
       profile in generate_moos_ui2.py, BlurStrength 15 / NoiseStrength 3) is
       what makes the glass look like glass. It can only show through if the
       glass is translucent, so the @GLASS_P*@ stops stay well under the 0.93
       ceiling test_glass_surfaces_keep_rounded_blur_masks enforces — the dock
       sits at ~0.6 top / ~0.78 bottom (dark), letting the blurred wallpaper
       read through while keeping tray/clock contrast legible.

       Corner bands are plain annuli: outer arc, radial step, inner arc about
       the corner's own centre. The soft vertical light from above is carried
       entirely by the glass gradient (top stop more transparent than bottom) —
       a smooth fall, never a line.

       Keep every piece FILL-ONLY — no outlined paths. An outline inflates the
       FrameSvg element bbox by half its width and the stretch factor magnifies
       that overhang into a transparent tear across the dock (seen on hardware).
       verify_user_experience greps this file for the word and fails the build. -->
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Background { color: #C2E4E1; }
    .ColorScheme-Highlight  { color: #0F766E; }
    .ColorScheme-Text       { color: #17302E; }
  </style>
  <defs>
    <linearGradient id="ui2-panel-glass" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="60">
      <stop offset="0" stop-color="#BEE2DE" stop-opacity="0.58"/>
      <stop offset="0.35" stop-color="#B4DCD8" stop-opacity="0.68"/>
      <stop offset="0.75" stop-color="#AAD5D0" stop-opacity="0.80"/>
      <stop offset="1" stop-color="#AAD5D0" stop-opacity="0.88"/>
    </linearGradient>
  </defs>

  <!-- Each corner is ONE glass annulus about its own centre (18,18) / (42,18):
       outer arc r=18, radial step, inner arc r=18-thickness, close. -->
  <g id="topleft">
    <path d="M0 18A18 18 0 0 1 18 0V18Z" fill="url(#ui2-panel-glass)"/>
  </g>
  <g id="topright">
    <path d="M42 0A18 18 0 0 1 60 18H42Z" fill="url(#ui2-panel-glass)"/>
  </g>
  <g id="bottomleft">
    <path d="M18 60A18 18 0 0 1 0 42H18Z" fill="url(#ui2-panel-glass)"/>
    <path d="M18 60A18 18 0 0 1 0 42H1A17 17 0 0 0 18 59Z" fill="#527F79" fill-opacity="0.14"/>
  </g>
  <g id="bottomright">
    <path d="M60 42A18 18 0 0 1 42 60V42Z" fill="url(#ui2-panel-glass)"/>
    <path d="M60 42A18 18 0 0 1 42 60V59A17 17 0 0 0 59 42Z" fill="#527F79" fill-opacity="0.14"/>
  </g>
  <g id="top"><rect x="18" width="24" height="18" fill="url(#ui2-panel-glass)"/></g>
  <g id="bottom"><rect x="18" y="42" width="24" height="18" fill="url(#ui2-panel-glass)"/><rect x="18" y="59" width="24" height="1" fill="#527F79" fill-opacity="0.14"/></g>
  <g id="left"><rect y="18" width="18" height="24" fill="url(#ui2-panel-glass)"/></g>
  <g id="right"><rect x="42" y="18" width="18" height="24" fill="url(#ui2-panel-glass)"/></g>
  <rect id="center" x="18" y="18" width="24" height="24" fill="url(#ui2-panel-glass)"/>

  <path id="mask-topleft" d="M88 18A18 18 0 0 1 106 0V18Z" fill="#000"/>
  <path id="mask-topright" d="M130 0A18 18 0 0 1 148 18H130Z" fill="#000"/>
  <path id="mask-bottomleft" d="M106 60A18 18 0 0 1 88 42H106Z" fill="#000"/>
  <path id="mask-bottomright" d="M148 42A18 18 0 0 1 130 60V42Z" fill="#000"/>
  <rect id="mask-top" x="106" width="24" height="18" fill="#000"/>
  <rect id="mask-bottom" x="106" y="42" width="24" height="18" fill="#000"/>
  <rect id="mask-left" x="88" y="18" width="18" height="24" fill="#000"/>
  <rect id="mask-right" x="130" y="18" width="18" height="24" fill="#000"/>
  <rect id="mask-center" x="106" y="18" width="24" height="24" fill="#000"/>

  <rect id="hint-top-margin" x="158" y="0" width="4" height="7" fill="none"/>
  <rect id="hint-bottom-margin" x="158" y="11" width="4" height="7" fill="none"/>
  <rect id="hint-left-margin" x="154" y="22" width="7" height="4" fill="none"/>
  <rect id="hint-right-margin" x="165" y="22" width="7" height="4" fill="none"/>
  <rect id="hint-top-inset" x="158" y="32" width="4" height="1e-8" fill="none"/>
  <rect id="hint-bottom-inset" x="158" y="36" width="4" height="1e-8" fill="none"/>
  <rect id="hint-left-inset" x="154" y="42" width="1e-8" height="4" fill="none"/>
  <rect id="hint-right-inset" x="165" y="42" width="1e-8" height="4" fill="none"/>
  <rect id="hint-stretch-borders" x="158" y="52" width="4" height="4" fill="none"/>
</svg>
