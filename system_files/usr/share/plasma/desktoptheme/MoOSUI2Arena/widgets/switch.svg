  <path id="inactive-left" d="M0 7A7 7 0 0 1 7 0v14A7 7 0 0 1 0 7Z" fill="#3D2A5C" fill-opacity="0.46"/>
  <rect id="inactive-center" x="7" width="16" height="14" fill="#3D2A5C" fill-opacity="0.46"/>
  <path id="inactive-right" d="M23 0a7 7 0 0 1 0 14Z" fill="#3D2A5C" fill-opacity="0.46"/>
