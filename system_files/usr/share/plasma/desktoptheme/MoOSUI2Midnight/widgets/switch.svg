    .ColorScheme-Text { color: #F5F7FA; }
    .ColorScheme-ButtonBackground { color: #1C1C22; }
    .ColorScheme-ButtonText { color: #F5F7FA; }
  </style>
  <path id="inactive-left" d="M0 7A7 7 0 0 1 7 0v14A7 7 0 0 1 0 7Z" fill="#26262E" fill-opacity="0.46"/>
  <rect id="inactive-center" x="7" width="16" height="14" fill="#26262E" fill-opacity="0.46"/>
  <path id="inactive-right" d="M23 0a7 7 0 0 1 0 14Z" fill="#26262E" fill-opacity="0.46"/>
  <path id="active-left" d="M0 27a7 7 0 0 1 7-7v14a7 7 0 0 1-7-7Z" fill="#22D3EE"/>
