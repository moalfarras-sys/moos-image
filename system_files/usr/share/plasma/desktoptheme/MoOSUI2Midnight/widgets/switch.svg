<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="162" height="36" viewBox="0 0 162 36">
  <!-- MoOS pill switch with luminous focus and restrained pressed feedback. -->
