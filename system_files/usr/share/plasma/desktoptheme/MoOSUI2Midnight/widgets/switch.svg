  <path id="active-right" d="M23 20a7 7 0 0 1 0 14Z" fill="#22D3EE"/>
  <g id="handle"><circle cx="43" cy="7" r="7" fill="#F5F7FA"/><circle cx="43" cy="7" r="6" fill="#121216"/></g>
  <g id="handle-hover"><circle cx="61" cy="7" r="8" fill="#67E8F9" fill-opacity="0.42"/><circle cx="61" cy="7" r="6" fill="#F5F7FA"/></g>
  <g id="handle-focus"><circle cx="81" cy="7" r="9" fill="none" stroke="#67E8F9" stroke-width="2"/><circle cx="81" cy="7" r="6" fill="#F5F7FA"/></g>
  <g id="handle-pressed"><circle cx="101" cy="7" r="7" fill="#22D3EE"/><circle cx="101" cy="7" r="4" fill="#000000"/></g>
  <circle id="handle-shadow" cx="119" cy="8" r="7" fill="#000000" fill-opacity="0.28"/>
