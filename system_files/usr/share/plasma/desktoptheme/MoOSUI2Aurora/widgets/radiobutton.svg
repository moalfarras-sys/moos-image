<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="144" height="20" viewBox="0 0 144 20">
  <!-- MoOS radio states with a clear focus halo. -->
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Background { color: #192436; }
    .ColorScheme-Highlight { color: #20D6F8; }
    .ColorScheme-Text { color: #EDF3FC; }
    .ColorScheme-ButtonBackground { color: #293B53; }
    .ColorScheme-ButtonText { color: #EDF3FC; }
  </style>
  <g id="normal"><circle cx="10" cy="10" r="8" fill="#192436" stroke="#455A73" stroke-width="1.2"/></g>
  <g id="hover"><circle cx="30" cy="10" r="8" fill="#293B53" stroke="#ACEEF9" stroke-width="1.4"/></g>
  <g id="focus"><circle cx="50" cy="10" r="8" fill="#192436" stroke="#ACEEF9" stroke-width="2"/></g>
  <g id="checked"><circle cx="70" cy="10" r="8" fill="#20D6F8" stroke="#ACEEF9" stroke-width="1.2"/><circle cx="70" cy="10" r="3.2" fill="#101723"/></g>
  <circle id="symbol" cx="90" cy="10" r="3.2" fill="#101723"/>
  <circle id="shadow" cx="110" cy="11" r="4" fill="#0A101B" fill-opacity="0.24"/>
  <rect id="hint-size" x="122" y="0" width="20" height="20" fill="none"/>
</svg>
