<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="144" height="20" viewBox="0 0 144 20">
  <!-- MoOS radio states with a clear focus halo. -->
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Background { color: #172236; }
    .ColorScheme-Highlight { color: #3B82F6; }
    .ColorScheme-Text { color: #ECF2FB; }
    .ColorScheme-ButtonBackground { color: #263651; }
    .ColorScheme-ButtonText { color: #ECF2FB; }
  </style>
  <g id="normal"><circle cx="10" cy="10" r="8" fill="#172236" stroke="#2C3D5A" stroke-width="1.2"/></g>
  <g id="hover"><circle cx="30" cy="10" r="8" fill="#263651" stroke="#93C5FD" stroke-width="1.4"/></g>
  <g id="focus"><circle cx="50" cy="10" r="8" fill="#172236" stroke="#93C5FD" stroke-width="2"/></g>
  <g id="checked"><circle cx="70" cy="10" r="8" fill="#3B82F6" stroke="#93C5FD" stroke-width="1.2"/><circle cx="70" cy="10" r="3.2" fill="#0E1524"/></g>
  <circle id="symbol" cx="90" cy="10" r="3.2" fill="#0E1524"/>
  <circle id="shadow" cx="110" cy="11" r="4" fill="#080D18" fill-opacity="0.24"/>
  <rect id="hint-size" x="122" y="0" width="20" height="20" fill="none"/>
</svg>
