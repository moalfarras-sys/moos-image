  <g id="handle-focus"><circle cx="81" cy="7" r="9" fill="none" stroke="#ACEEF9" stroke-width="2"/><circle cx="81" cy="7" r="6" fill="#EDF3FC"/></g>
  <g id="handle-pressed"><circle cx="101" cy="7" r="7" fill="#20D6F8"/><circle cx="101" cy="7" r="4" fill="#101723"/></g>
  <circle id="handle-shadow" cx="119" cy="8" r="7" fill="#0A101B" fill-opacity="0.28"/>
