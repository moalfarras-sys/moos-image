<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="132" height="30" viewBox="0 0 132 30">
  <!-- Low-overdraw MoOS busy indicator; Plasma supplies the rotation animation. -->
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Background { color: #131A22; }
    .ColorScheme-Highlight { color: #3FB950; }
    .ColorScheme-Text { color: #E6EDF3; }
    .ColorScheme-ButtonBackground { color: #232E3A; }
    .ColorScheme-ButtonText { color: #E6EDF3; }
  </style>
  <g id="stopped"><circle cx="12" cy="12" r="9" fill="none" stroke="#30363D" stroke-width="2"/></g>
  <g id="busywidget"><circle cx="38" cy="12" r="9" fill="none" stroke="#30363D" stroke-width="2"/><path d="M38 3a9 9 0 0 1 8.6 6.4" fill="none" stroke="#7EE787" stroke-width="2.6" stroke-linecap="round"/></g>
  <g id="22-22-busywidget"><circle cx="64" cy="11" r="8" fill="none" stroke="#30363D" stroke-width="2"/><path d="M64 3a8 8 0 0 1 7.6 5.4" fill="none" stroke="#3FB950" stroke-width="2.4" stroke-linecap="round"/></g>
  <g id="16-16-busywidget"><circle cx="86" cy="8" r="6" fill="none" stroke="#30363D" stroke-width="1.7"/><path d="M86 2a6 6 0 0 1 5.7 4" fill="none" stroke="#3FB950" stroke-width="2" stroke-linecap="round"/></g>
  <rect id="hint-rotation-angle" x="100" y="0" width="30" height="30" fill="none"/>
</svg>
