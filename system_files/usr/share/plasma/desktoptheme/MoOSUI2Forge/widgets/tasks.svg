<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="160" viewBox="0 0 48 160">
  <!-- MoOS UI2 — dock task tiles. Original art.

       WHAT EACH STATE MEANS (probed on the running session, not assumed: a
       colour-coded build of this file was applied live and the dock read off).
         (no frame) the app is pinned but not running — Plasma hides the frame
         normal      running AND on screen
         focus       the active window
         minimized   running, minimised out of the way
         hover       the pointer is on the tile — shown on LAUNCHERS TOO
         attention   the window is asking for the user

       So "is this app open?" is answered by normal/minimized/focus and NEVER by
       hover. `normal` used to be fill="none": an open, visible, unfocused app
       had no mark at all. It now carries the turquoise bar, `minimized` carries
       a quieter one, and the active window carries the full Nova gradient.

       NO TILE CARRIES A BOX. Every state used to paint a flat slab of the TEXT
       colour plus a 1 px accent hairline across its top edge. On a light family
       member that slab is near-black at 10%, so the active app sat inside a
       grey rectangle with a hard lit edge — the "cheap square" complaint. Only
       `hover` still fills, and it fills with the LUMINOUS accent (never the
       highlight colour, which would claim a pinned launcher is running).
       `focus` and `attention` are now expressed by light rising from their own
       indicator, which fades out before it reaches an edge and therefore has no
       outline to read as a border.

       The 3px transparent pad at the top and bottom of every block is why the
       tiles stop colliding with the dock's lit rim: a full-bleed tile met the
       turquoise top edge and notched it once per icon.

       Fill-only, no outlined paths — an outline inflates the FrameSvg element
       bbox and the stretch factor tears a gap through the tile. Gated by
       verify_user_experience, which greps this file for the word. -->
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Background { color: #131A22; }
    .ColorScheme-Highlight  { color: #3FB950; }
    .ColorScheme-Text       { color: #E6EDF3; }
  </style>
  <defs>
    <linearGradient id="nova-accent" gradientUnits="userSpaceOnUse" x1="9" y1="0" x2="23" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
    <!-- The active tile's glass is lit from its indicator upward. Bound to the
         focus block's bottom band so it aligns with the bar it rises from. -->
    <linearGradient id="nova-lift" gradientUnits="userSpaceOnUse"
                    x1="0" y1="93" x2="0" y2="84">
      <stop offset="0" stop-color="#3FB950" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3FB950" stop-opacity="0"/>
    </linearGradient>
    <!-- Same lift for a window asking for attention, in the warning hue, bound
         to the attention block's bottom band. -->
    <linearGradient id="nova-alert" gradientUnits="userSpaceOnUse"
                    x1="0" y1="157" x2="0" y2="148">
      <stop offset="0" stop-color="#D29922" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D29922" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- normal: tile 0 · hairline 0 · bar 0.85 -->
  <g id="normal-topleft"><path d="M0 12A9 9 0 0 1 9 3V12Z" fill="#E6EDF3" fill-opacity="0.000"/></g>
  <g id="normal-top"><rect x="9" y="3" width="14" height="9" fill="#E6EDF3" fill-opacity="0.000"/></g>
  <g id="normal-topright"><path d="M23 3A9 9 0 0 1 32 12H23Z" fill="#E6EDF3" fill-opacity="0.000"/></g>
  <rect id="normal-left" x="0" y="12" width="9" height="8" fill="#E6EDF3" fill-opacity="0.000"/>
  <rect id="normal-center" x="9" y="12" width="14" height="8" fill="#E6EDF3" fill-opacity="0.000"/>
  <rect id="normal-right" x="23" y="12" width="9" height="8" fill="#E6EDF3" fill-opacity="0.000"/>
  <g id="normal-bottomleft"><path d="M0 20A9 9 0 0 0 9 29V20Z" fill="#E6EDF3" fill-opacity="0.000"/></g>
  <g id="normal-bottom"><rect x="9" y="20" width="14" height="9" fill="#E6EDF3" fill-opacity="0.000"/><rect x="9" y="25" width="14" height="3" rx="1.5" fill="#3FB950" fill-opacity="0.850"/></g>
  <g id="normal-bottomright"><path d="M32 20A9 9 0 0 1 23 29V20Z" fill="#E6EDF3" fill-opacity="0.000"/></g>
  <rect id="normal-hint-top-margin" x="36" y="0" width="3" height="3" fill="none" opacity="0"/>
  <rect id="normal-hint-bottom-margin" x="36" y="6" width="3" height="3" fill="none" opacity="0"/>
  <rect id="normal-hint-left-margin" x="41" y="0" width="3" height="3" fill="none" opacity="0"/>
  <rect id="normal-hint-right-margin" x="41" y="6" width="3" height="3" fill="none" opacity="0"/>
  <rect id="normal-hint-stretch-borders" x="36" y="12" width="4" height="4" fill="none" opacity="0"/>
  <!-- hover: luminous tile 0.09 · no hairline · no bar -->
  <g id="hover-topleft"><path d="M0 44A9 9 0 0 1 9 35V44Z" fill="#7EE787" fill-opacity="0.090"/></g>
  <g id="hover-top"><rect x="9" y="35" width="14" height="9" fill="#7EE787" fill-opacity="0.090"/></g>
  <g id="hover-topright"><path d="M23 35A9 9 0 0 1 32 44H23Z" fill="#7EE787" fill-opacity="0.090"/></g>
  <rect id="hover-left" x="0" y="44" width="9" height="8" fill="#7EE787" fill-opacity="0.090"/>
  <rect id="hover-center" x="9" y="44" width="14" height="8" fill="#7EE787" fill-opacity="0.090"/>
  <rect id="hover-right" x="23" y="44" width="9" height="8" fill="#7EE787" fill-opacity="0.090"/>
  <g id="hover-bottomleft"><path d="M0 52A9 9 0 0 0 9 61V52Z" fill="#7EE787" fill-opacity="0.090"/></g>
  <g id="hover-bottom"><rect x="9" y="52" width="14" height="9" fill="#7EE787" fill-opacity="0.090"/></g>
  <g id="hover-bottomright"><path d="M32 52A9 9 0 0 1 23 61V52Z" fill="#7EE787" fill-opacity="0.090"/></g>
  <rect id="hover-hint-top-margin" x="36" y="32" width="3" height="3" fill="none" opacity="0"/>
  <rect id="hover-hint-bottom-margin" x="36" y="38" width="3" height="3" fill="none" opacity="0"/>
  <rect id="hover-hint-left-margin" x="41" y="32" width="3" height="3" fill="none" opacity="0"/>
  <rect id="hover-hint-right-margin" x="41" y="38" width="3" height="3" fill="none" opacity="0"/>
  <rect id="hover-hint-stretch-borders" x="36" y="44" width="4" height="4" fill="none" opacity="0"/>
  <!-- focus: tile 0 · hairline 0 · lift 0.30 · bar 0.95 -->
  <g id="focus-topleft"><path d="M0 76A9 9 0 0 1 9 67V76Z" fill="#E6EDF3" fill-opacity="0.000"/></g>
  <g id="focus-top"><rect x="9" y="67" width="14" height="9" fill="#E6EDF3" fill-opacity="0.000"/></g>
  <g id="focus-topright"><path d="M23 67A9 9 0 0 1 32 76H23Z" fill="#E6EDF3" fill-opacity="0.000"/></g>
  <rect id="focus-left" x="0" y="76" width="9" height="8" fill="#E6EDF3" fill-opacity="0.000"/>
  <rect id="focus-center" x="9" y="76" width="14" height="8" fill="#E6EDF3" fill-opacity="0.000"/>
  <rect id="focus-right" x="23" y="76" width="9" height="8" fill="#E6EDF3" fill-opacity="0.000"/>
  <g id="focus-bottomleft"><path d="M0 84A9 9 0 0 0 9 93V84Z" fill="#E6EDF3" fill-opacity="0.000"/></g>
  <g id="focus-bottom"><rect x="9" y="84" width="14" height="9" fill="url(#nova-lift)" fill-opacity="0.300"/><rect x="9" y="89" width="14" height="3" rx="1.5" fill="url(#nova-accent)" fill-opacity="0.950"/></g>
  <g id="focus-bottomright"><path d="M32 84A9 9 0 0 1 23 93V84Z" fill="#E6EDF3" fill-opacity="0.000"/></g>
  <rect id="focus-hint-top-margin" x="36" y="64" width="3" height="3" fill="none" opacity="0"/>
  <rect id="focus-hint-bottom-margin" x="36" y="70" width="3" height="3" fill="none" opacity="0"/>
  <rect id="focus-hint-left-margin" x="41" y="64" width="3" height="3" fill="none" opacity="0"/>
  <rect id="focus-hint-right-margin" x="41" y="70" width="3" height="3" fill="none" opacity="0"/>
  <rect id="focus-hint-stretch-borders" x="36" y="76" width="4" height="4" fill="none" opacity="0"/>
  <!-- minimized: tile 0 · hairline 0 · bar 0.4 -->
  <g id="minimized-topleft"><path d="M0 108A9 9 0 0 1 9 99V108Z" fill="#E6EDF3" fill-opacity="0.000"/></g>
  <g id="minimized-top"><rect x="9" y="99" width="14" height="9" fill="#E6EDF3" fill-opacity="0.000"/></g>
  <g id="minimized-topright"><path d="M23 99A9 9 0 0 1 32 108H23Z" fill="#E6EDF3" fill-opacity="0.000"/></g>
  <rect id="minimized-left" x="0" y="108" width="9" height="8" fill="#E6EDF3" fill-opacity="0.000"/>
  <rect id="minimized-center" x="9" y="108" width="14" height="8" fill="#E6EDF3" fill-opacity="0.000"/>
  <rect id="minimized-right" x="23" y="108" width="9" height="8" fill="#E6EDF3" fill-opacity="0.000"/>
  <g id="minimized-bottomleft"><path d="M0 116A9 9 0 0 0 9 125V116Z" fill="#E6EDF3" fill-opacity="0.000"/></g>
  <g id="minimized-bottom"><rect x="9" y="116" width="14" height="9" fill="#E6EDF3" fill-opacity="0.000"/><rect x="9" y="121" width="14" height="3" rx="1.5" fill="#3FB950" fill-opacity="0.400"/></g>
  <g id="minimized-bottomright"><path d="M32 116A9 9 0 0 1 23 125V116Z" fill="#E6EDF3" fill-opacity="0.000"/></g>
  <rect id="minimized-hint-top-margin" x="36" y="96" width="3" height="3" fill="none" opacity="0"/>
  <rect id="minimized-hint-bottom-margin" x="36" y="102" width="3" height="3" fill="none" opacity="0"/>
  <rect id="minimized-hint-left-margin" x="41" y="96" width="3" height="3" fill="none" opacity="0"/>
  <rect id="minimized-hint-right-margin" x="41" y="102" width="3" height="3" fill="none" opacity="0"/>
  <rect id="minimized-hint-stretch-borders" x="36" y="108" width="4" height="4" fill="none" opacity="0"/>
  <!-- attention: tile 0 · hairline 0 · alert lift 0.34 · bar 0.85 -->
  <g id="attention-topleft"><path d="M0 140A9 9 0 0 1 9 131V140Z" fill="#E6EDF3" fill-opacity="0.000"/></g>
  <g id="attention-top"><rect x="9" y="131" width="14" height="9" fill="#E6EDF3" fill-opacity="0.000"/></g>
  <g id="attention-topright"><path d="M23 131A9 9 0 0 1 32 140H23Z" fill="#E6EDF3" fill-opacity="0.000"/></g>
