  <g id="attention-bottom"><rect x="9" y="148" width="14" height="9" fill="url(#nova-alert)" fill-opacity="0.340"/><rect x="9" y="153" width="14" height="3" rx="1.5" fill="#D29922" fill-opacity="0.850"/></g>
  <g id="attention-bottomright"><path d="M32 148A9 9 0 0 1 23 157V148Z" fill="#E6EDF3" fill-opacity="0.000"/></g>
