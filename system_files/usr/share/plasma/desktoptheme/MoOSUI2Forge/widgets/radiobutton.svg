<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="144" height="20" viewBox="0 0 144 20">
  <!-- MoOS radio states with a clear focus halo. -->
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Background { color: #131A22; }
    .ColorScheme-Highlight { color: #3FB950; }
    .ColorScheme-Text { color: #E6EDF3; }
    .ColorScheme-ButtonBackground { color: #232E3A; }
    .ColorScheme-ButtonText { color: #E6EDF3; }
  </style>
  <g id="normal"><circle cx="10" cy="10" r="8" fill="#131A22" stroke="#30363D" stroke-width="1.2"/></g>
  <g id="hover"><circle cx="30" cy="10" r="8" fill="#232E3A" stroke="#7EE787" stroke-width="1.4"/></g>
  <g id="focus"><circle cx="50" cy="10" r="8" fill="#131A22" stroke="#7EE787" stroke-width="2"/></g>
  <g id="checked"><circle cx="70" cy="10" r="8" fill="#3FB950" stroke="#7EE787" stroke-width="1.2"/><circle cx="70" cy="10" r="3.2" fill="#0D1117"/></g>
  <circle id="symbol" cx="90" cy="10" r="3.2" fill="#0D1117"/>
  <circle id="shadow" cx="110" cy="11" r="4" fill="#010409" fill-opacity="0.24"/>
  <rect id="hint-size" x="122" y="0" width="20" height="20" fill="none"/>
</svg>
