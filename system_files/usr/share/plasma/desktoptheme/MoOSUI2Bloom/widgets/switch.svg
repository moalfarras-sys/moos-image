  <g id="handle-hover"><circle cx="61" cy="7" r="8" fill="#E9D5FF" fill-opacity="0.42"/><circle cx="61" cy="7" r="6" fill="#F1E9F5"/></g>
  <g id="handle-focus"><circle cx="81" cy="7" r="9" fill="none" stroke="#E9D5FF" stroke-width="2"/><circle cx="81" cy="7" r="6" fill="#F1E9F5"/></g>
  <g id="handle-pressed"><circle cx="101" cy="7" r="7" fill="#C084FC"/><circle cx="101" cy="7" r="4" fill="#17121F"/></g>
  <circle id="handle-shadow" cx="119" cy="8" r="7" fill="#0F0A15" fill-opacity="0.28"/>
