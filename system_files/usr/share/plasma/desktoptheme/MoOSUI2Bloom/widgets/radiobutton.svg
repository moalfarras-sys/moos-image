<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="144" height="20" viewBox="0 0 144 20">
  <!-- MoOS radio states with a clear focus halo. -->
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Background { color: #201829; }
    .ColorScheme-Highlight { color: #C084FC; }
    .ColorScheme-Text { color: #F1E9F5; }
    .ColorScheme-ButtonBackground { color: #342844; }
    .ColorScheme-ButtonText { color: #F1E9F5; }
  </style>
  <g id="normal"><circle cx="10" cy="10" r="8" fill="#201829" stroke="#3E3050" stroke-width="1.2"/></g>
  <g id="hover"><circle cx="30" cy="10" r="8" fill="#342844" stroke="#E9D5FF" stroke-width="1.4"/></g>
  <g id="focus"><circle cx="50" cy="10" r="8" fill="#201829" stroke="#E9D5FF" stroke-width="2"/></g>
  <g id="checked"><circle cx="70" cy="10" r="8" fill="#C084FC" stroke="#E9D5FF" stroke-width="1.2"/><circle cx="70" cy="10" r="3.2" fill="#17121F"/></g>
  <circle id="symbol" cx="90" cy="10" r="3.2" fill="#17121F"/>
  <circle id="shadow" cx="110" cy="11" r="4" fill="#0F0A15" fill-opacity="0.24"/>
  <rect id="hint-size" x="122" y="0" width="20" height="20" fill="none"/>
</svg>
