# MoOS owns its own boot appearance.
#
# Plymouth only draws its graphical splash when the kernel command line asks for it: without
# `rhgb` it falls back to the text/details theme, and the user watches systemd scroll past
# instead of seeing MoOS. The image was not setting this at all — it inherited whatever the
# installer happened to write, so the MoOS splash was at the mercy of Anaconda's defaults and
# could silently not appear at all. Booting the built disk in a VM showed exactly that: raw
# systemd text, no splash.
#
# bootc kargs.d makes these part of the IMAGE, so every install and every update gets them and
# the boot looks like MoOS on every machine.
#
# These are the standard flicker-free set the immutable-desktop family (Bazzite,
# Bluefin) ships on this exact base, so they are proven safe here — every one is
# cosmetic and none changes what boots or how:
#
#   rhgb                       — "red hat graphical boot": the flag Plymouth keys
#                                off to draw the splash at all
#   quiet                      — suppress the kernel log so the splash is not
#                                overwritten by scrolling text
#   splash                     — the generic companion flag to rhgb; harmless and
#                                belt-and-braces so a non-Fedora initramfs path
#                                still asks for graphics
#   loglevel=3                 — kernel prints only warnings+; the last lines of
#                                console noise before Plymouth takes over go away
#   rd.udev.log_level=3        — the same for udev inside the initramfs
#   vt.global_cursor_default=0 — no blinking text cursor flashing in the corner
#                                during the firmware -> Plymouth -> greeter handoffs
# plymouth.use-simpledrm USED TO BE HERE, and on the owner's NVIDIA machine it was the
# reason there was no splash at all. It now lives in 20-moos-simpledrm.toml, which build.sh
# deletes for the moos-nvidia edition. See that file for the whole story.
kargs = [
    "rhgb",
    "quiet",
    "splash",
    "loglevel=3",
    "rd.udev.log_level=3",
    "vt.global_cursor_default=0",
    "systemd.show_status=false",
]
