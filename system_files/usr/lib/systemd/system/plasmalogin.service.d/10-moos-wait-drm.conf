[Service]
# udevadm settle alone does not prove that a slow GPU driver has created a DRM
# card. Starting KWin before card* exists leaves an active manager with a black
# greeter. The helper exits immediately on normal hardware and waits at most 30s.
ExecStartPre=/usr/libexec/moos-wait-drm
# The greeter's KWin runs as the unprivileged plasmalogin user. Without an
# explicit DeviceAllow the service's device policy hides /dev/dri/* from the
# user session, so KWin sees the node as absent (ENOENT -> "couldn't find dev
# node") and the framebuffer stays black. Grant the DRM nodes read/write.
DeviceAllow=/dev/dri/card0 rw
DeviceAllow=/dev/dri/card1 rw
DeviceAllow=/dev/dri/renderD128 rw
DeviceAllow=/dev/dri/renderD129 rw
DevicePolicy=closed
# If the service template sets PrivateDevices, it gives the greeter its own
# empty /dev namespace where /dev/dri/card0 never appears — KWin then sees the
# node as absent even with DeviceAllow above. Keep the real /dev visible.
PrivateDevices=no
