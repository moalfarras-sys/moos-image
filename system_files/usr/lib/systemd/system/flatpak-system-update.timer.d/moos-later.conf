# When apps installed for ALL users update — never at boot, never in the login storm.
#
# The vendor timer fires 2 minutes after boot and at 04:00 with Persistent=true. Persistent
# means a 04:00 run the machine slept through fires the moment the timer starts, i.e. during
# boot, and that is what cost ~24.5 s of every cold boot on the owner's machine (build.sh
# explains why the timer is enabled again).
#
# The empty assignments come first because timer values are LISTS: `OnBootSec=30min` alone
# would be added to the vendor's 2 min, and an empty assignment to ANY of these options also
# clears OnCalendar= (systemd.timer(5)) — the user-scope twin of this file lost its daily run
# exactly that way until 2026-10-14. So: clear everything, then say everything.
[Timer]
OnBootSec=
OnBootSec=30min
OnCalendar=*-*-* 4:00:00
Persistent=false
RandomizedDelaySec=30min
