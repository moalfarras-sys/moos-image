# Why this exists: dbus-broker IS the system message bus, and it is Type=notify-reload
# with NO TimeoutStartSec of its own — so systemd waits for it to signal READY within
# the 90s default start window, then kills it with result 'timeout'. On a slow first boot — a cold
# QEMU/WHPX guest, software rendering, a machine still thrashing through its first
# userspace — the broker can be scheduled too late to send that notification in
# time. When that happens the bus is declared failed, and EVERY unit that needs the
# system bus fails with "Dependency failed" in the same instant: NetworkManager,
# NetworkManager-wait-online, tuned, tuned-ppd. The live session then comes up with
# no network at all, so the Welcome wizard cannot install anything, and the only
# cure is to start NetworkManager by hand. Seen live on the v21 ISO under a loaded
# WHPX guest, 2026-07-15 (vm-test/v21-26-root.png:
#   'dbus-broker.service: start operation timed out. Terminating.').
#
# A generous start window costs nothing on fast hardware — the broker still signals
# READY in well under a second there and never waits — while giving a starved first
# boot the room it needs to get the bus up instead of tearing the whole graph down.
# 5min is ~3x the default that failed: comfortable headroom for a pathologically slow
# WHPX guest, still bounded so a genuinely wedged bus does not hang the boot forever.
[Service]
TimeoutStartSec=5min
