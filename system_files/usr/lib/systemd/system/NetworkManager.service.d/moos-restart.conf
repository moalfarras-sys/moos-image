# Why this exists: on the v21 boot the system message bus (dbus-broker) timed out, and
# NetworkManager — a Type=dbus service that needs that bus — was cancelled with result
# 'dependency'. The live session had no network and could not install MoOS until NM was
# started by hand (vm-test/v21-24-nmlog.png: NM only reached active at 07:40:51, sixteen
# minutes past boot).
#
# The real cure is the companion dbus-broker.service.d/moos-start-timeout.conf: with the
# bus up, NM's dependency is satisfied and it starts normally. This drop-in is the
# hardening around that, and it is deliberately honest about what it does and does not do:
#
#   * NetworkManager's STOCK unit already ships `Restart=on-failure` and
#     `TimeoutStartSec=600`. The Restart= line below therefore RESTATES the stock intent
#     (kept explicit so this file is self-documenting) — it is not a new capability, and
#     it did NOT save this boot: systemd only auto-restarts a service whose OWN process
#     failed, never one whose start job was cancelled by a failed dependency. So Restart=
#     alone was never going to rescue a 'dependency' failure; the dbus timeout is.
#
#   * What this drop-in genuinely ADDS is StartLimitIntervalSec=0. It removes the default
#     5-starts-in-10s rate limiter so that if NM's own process DOES fail repeatedly on a
#     thrashing boot, it keeps retrying instead of tripping the limiter and latching off
#     for good — which would re-create the exact "no network until I intervene" state.
#     Re-establishing the network is worth retrying for as long as it takes.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=2s
