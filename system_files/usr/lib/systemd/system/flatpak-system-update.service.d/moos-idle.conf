# Updating Flatpaks must never be something the user can FEEL.
#
# Measured on this machine: flatpak-system-update is the single most expensive thing that
# runs on a MoOS boot — `systemd-analyze blame` puts it at 1min 3.885s — and its timer
# fires OnBootSec=2min, i.e. exactly while the user is opening their first windows. It ran
# at normal priority (Nice=0, best-effort I/O), so it competed with the desktop for CPU and
# disk at the one moment the desktop is busiest. That is what "the system feels slow after
# login" is made of.
#
# Nothing here changes WHAT it does. It still updates every system Flatpak. It just yields:
# idle CPU scheduling and idle I/O mean it runs in the gaps, and stops the moment anything
# the user is waiting on needs the disk.
[Service]
Nice=19
CPUSchedulingPolicy=idle
IOSchedulingClass=idle
