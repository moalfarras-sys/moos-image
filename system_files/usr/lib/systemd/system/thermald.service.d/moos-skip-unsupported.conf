# thermald exits 1 by design on non-mobile platforms ("Non mobile platform,
# exiting.."), and the stock unit's restart policy turns that refusal into a
# red failed unit on every MoOS desktop boot. ExecCondition skips the unit
# cleanly exactly where the daemon would refuse anyway; Intel laptops are
# unaffected and keep full thermal management.
[Service]
ExecCondition=/usr/libexec/moos-thermald-supported
