# MoOS boot handoff: hold the splash on screen until KWin is actually drawing.
#
# THE BUG, measured on the owner's machine (boot of 2026-07-27 16:52):
#   16:52:24.269  plymouth-quit.service finished  (`plymouth quit`)
#   16:52:24.270  plasmalogin.service starts      (it is After=plymouth-quit.service)
#   16:52:28.728  kwin_wayland: "No backend specified, automatically choosing drm"
# That is FOUR AND A HALF SECONDS during which nothing owns the display. The boot
# reads: a finished MoOS splash -> a black screen -> the desktop. It is the
# cheapest-looking moment in the product, and none of it is Plasma being slow —
# the gap is the login manager start, the PAM autologin, the Wayland session
# bootstrap and KWin's own DRM init, all of which have to happen somewhere.
#
# THE CAUSE is the missing flag, not the ordering. Stock `plymouth quit` tells
# plymouthd to tear the splash DOWN before it exits; plymouthd's own trace says
# exactly what that costs -- "Not retaining splash, so deallocating VT". The VT is
# deallocated, the splash is explicitly hidden, and the screen goes black with
# nothing queued to paint it. `--retain-splash` is the documented opposite:
# "Don't explicitly hide boot splash on exit". plymouthd still exits at the same
# instant (so it releases the DRM device for KWin exactly as before) — it just
# leaves its last frame standing until the next modeset paints over it. That
# modeset is KWin's first frame. The MoOS splash therefore covers the whole gap
# and the boot becomes splash -> desktop, with no black in between.
#
# WHY THIS CANNOT DEADLOCK A BOOT — including one with no display manager:
#   * The command still QUITS plymouthd. `plymouth-quit-wait.service`
#     (`plymouth --wait`, TimeoutSec=0, i.e. wait forever) is what a hang would
#     strand, and it is untouched and still returns the moment plymouthd exits.
#     build.sh deliberately leaves plymouth-quit-wait alone; so does this.
#   * The unit keeps its vendor ordering, Type=oneshot, TimeoutSec=20 and the
#     leading `-` on ExecStart, so a plymouth that is already gone is still a
#     success and multi-user.target is reached exactly as before.
#   * Nothing in the boot transaction waits for the splash to be GONE. A retained
#     frame is a pixel-level artifact, not a synchronisation point, so no unit can
#     block on it. A boot that never reaches a compositor reaches multi-user.target
#     on precisely the same timeline it does today.
#   * The only difference on a display-manager-less boot is cosmetic: the last
#     splash frame would sit there instead of the text console. That case repaints
#     itself — plasmalogin.service has Conflicts=getty@tty1.service, so the moment
#     there is no display manager getty@tty1.service starts instead, and it ships
#     TTYReset=yes/TTYVHangup=yes/TTYVTDisallocate=yes: systemd deallocates VT1,
#     which returns it to text mode and repaints the console. Ctrl+Alt+F2 does the
#     same thing by hand.
#
# ExecStart= is cleared first because ExecStart is a LIST: assigning a second one
# without the reset would run `plymouth quit` and then `plymouth quit
# --retain-splash`, and the first call would already have deallocated the VT.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
