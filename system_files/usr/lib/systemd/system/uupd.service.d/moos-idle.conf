# The same rule flatpak-system-update already follows: an update the user did not
# ask for right now must never be something they can FEEL.
#
# Measured on this machine (`systemd-analyze blame`, boot of 2026-07-25):
#
#   1min 16.195s uupd.service          <- the single most expensive unit of the boot
#         4.229s sys-module-fuse.device
#
# uupd's timer is OnCalendar=04:00 with Persistent=true, so on any machine that was
# off at 4 AM — which is most desktops — it fires straight after boot, inside the
# RandomizedDelaySec=15m window. That is exactly while the user is opening their
# first windows, and it ran at Nice=0 with best-effort I/O: competing with the
# desktop for CPU and disk at the busiest moment of the session.
#
# Nothing here changes WHAT it updates. It still checks bootc, Flatpaks, distroboxes
# and firmware on the same schedule; it just yields. Idle CPU and idle I/O mean it
# runs in the gaps and steps aside the instant the desktop needs the disk.
#
# Honest scope: the bootc/ostree fetch itself is performed by rpm-ostreed, a separate
# D-Bus-activated service with its own cgroup, so it does not inherit this. That is
# deliberate — rpm-ostreed also serves the user's own interactive `rpm-ostree` and
# Mo Update runs, and those must stay fast. What this drop-in covers is uupd's own
# process tree: the Flatpak and distrobox update work, which is where its wall-clock
# and its disk traffic actually go.
[Service]
Nice=19
CPUSchedulingPolicy=idle
IOSchedulingClass=idle
