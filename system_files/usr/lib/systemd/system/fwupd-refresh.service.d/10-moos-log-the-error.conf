# MoOS: let fwupd-refresh say WHY it failed.
#
# fwupd-refresh.timer fires every ~1.5h and `fwupdmgr refresh` failed EVERY time it
# actually had to download (2026-07-16: 06:29, 07:55, 08:35, 09:45 — each one exited
# 1 within the same second, right after printing "Updating lvfs"). The runs that pass
# are the ones with nothing to do: metadata already fresh exits 2, and the unit's
# SuccessExitStatus=2 101 turns that into a green "Finished". So the failure hides
# whenever the cache is warm and returns the moment it goes stale (~daily).
#
# It could not be diagnosed, because upstream's unit sets StandardError=null: the one
# line that says what went wrong is written to stderr and thrown away before journald
# sees it. The journal keeps the "Failed with result 'exit-code'" and none of the why.
#
# Ruled out already, so the next reader does not repeat it: not the network (the same
# refresh as the desktop user downloads fine), not SELinux (no AVC denials), not a MoOS
# change (build.sh only installs fwupd — /etc/fwupd/remotes.d is stock upstream). What
# is left is the unit's own sandbox (DynamicUser=yes + ProtectHome + CacheDirectory).
#
# This drop-in ONLY restores the error message; it changes no behaviour and fixes
# nothing. It exists so the next failure is readable instead of silent:
#   journalctl -u fwupd-refresh.service -b
# Once the real cause is known and fixed, this file can go.
[Service]
StandardError=journal
