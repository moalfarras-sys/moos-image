# MoOS: keep fwupd-refresh failures readable.
#
# fwupd-refresh.timer fires every ~1.5h; `fwupdmgr refresh` used to exit 1 every
# time it actually had to download metadata, with the one explanatory line thrown
# away because upstream's unit sets StandardError=null. Restoring stderr to the
# journal revealed the cause: "Failed to obtain auth".
#
# Root cause (now fixed): the service runs as the DynamicUser "fwupd-refresh"
# with no session, so polkit placed the LVFS metadata action
# org.freedesktop.fwupd.refresh-remote (allow_any=auth_admin) behind an admin
# prompt that a headless timer can never answer. The fix is a scoped polkit
# grant in:
#   /usr/share/polkit-1/rules.d/60-moos-fwupd-refresh.rules
# which lets ONLY that user refresh metadata — never flash firmware.
#
# StandardError=journal is kept on purpose so any FUTURE regression stays
# visible instead of silent. Verify live after the next signed image with:
#   systemctl --failed ; journalctl -u fwupd-refresh.service -b
[Service]
StandardError=journal
