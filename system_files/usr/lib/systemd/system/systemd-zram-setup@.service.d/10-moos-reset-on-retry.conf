# MoOS fresh-install first-boot hardening for zram swap.
#
# THE BUG (QEMU walkthrough of ISO 44.20260717.190, "round 190"): on a brand-new
# install's very first boot, systemd-zram-setup@zram0 hit ONE transient failure at
# boot time (alongside a phantom `dev-disk-by-uuid-…` swap that matched no real
# device). That first run had already sized the device (disksize set, mkswap done),
# so every automatic retry then died with EBUSY writing
# /sys/block/zram0/comp_algorithm — the device was "already configured". One blip
# looked permanent: the install finished its first boot with two failed units and
# NO swap. It does not reproduce on the owner's real machine, but a fresh install
# must be robust to it.
#
# THE FIX: before each (re)start, reset the zram device back to a clean slate so a
# retry can configure it from scratch. Guarded three ways so it is a no-op on the
# normal path and can never disrupt a healthy swap:
#   - skip entirely if /dev/%i is an ACTIVE swap (never reset live swap);
#   - only touch the sysfs reset node if it exists and is writable;
#   - the leading `-` makes systemd ignore any ExecStartPre failure.
# On a first, successful boot the device is freshly created at size 0, so the reset
# is a harmless no-op; it only does real work on the retry-after-transient path.
# (moos-hardware-adapt already stops the swap before it re-sizes zram, so this does
# not interfere with the RAM-tier resize either.)
[Service]
ExecStartPre=-/usr/bin/sh -c 'if ! grep -qw "/dev/%i" /proc/swaps; then [ -w "/sys/block/%i/reset" ] && echo 1 > "/sys/block/%i/reset"; fi 2>/dev/null'
