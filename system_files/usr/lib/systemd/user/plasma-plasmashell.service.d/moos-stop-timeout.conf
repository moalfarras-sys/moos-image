# Why this exists: moos-apply-theme restarts plasmashell once per THEME_REV
# (the only way Plasma 6.7 rebuilds the systray's shown/hidden model). On a
# slow start — first boot, software rendering, a loaded machine — the shell
# does not finish its graceful shutdown inside systemd's default stop window,
# systemd escalates ('State stop-sigterm timed out. Aborting.'), and the user
# is greeted by a 30 MB coredump and a "plasmashell has closed unexpectedly"
# crash dialog for what was a routine restart. Seen live on the 2026-07-14
# ISO in QEMU; on the live COW that coredump alone exhausted the session's
# writable space. A generous stop timeout costs nothing on fast hardware.
# 2026-07-27 addendum — this 4-minute window is what makes a REBOOT take 78 seconds.
# user@.service (systemd's own unit) has TimeoutStopSec=60s and Fedora ships
# service.d/10-timeout-abort.conf with TimeoutStopFailureMode=abort. A 4-minute child
# window nested inside a 60-second parent window can never fire: when plasmashell hangs on
# SIGTERM the user manager waits for it, systemd hits ITS 60s first, SIGABRTs the user
# systemd ("State 'stop-sigterm' timed out. Aborting.", coredump), then SIGKILLs
# ksmserver/kwin_wayland/plasmashell/Xwayland. KWin holds DRM the whole time, so the frozen
# desktop stays on screen for the full minute. Measured on 4 of the last 5 shutdowns; the
# fifth stopped plasmashell in 0.64s and rebooted in 3.5s total.
#
# The original problem was never the LENGTH of the window — it was the SIGABRT and the
# coredump that DrKonqi turns into "plasmashell has closed unexpectedly". Fix that directly:
# escalate with SIGKILL instead of SIGABRT, so a slow restart is still not a crash dialog and
# not a 30 MB coredump, and keep the window comfortably inside the parent's 60s.
[Service]
TimeoutStopSec=20s
TimeoutStopFailureMode=kill
