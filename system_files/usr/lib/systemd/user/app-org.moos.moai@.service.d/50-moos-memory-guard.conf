[Service]
# Plasma launches Mira from its desktop entry as app-org.moos.moai@<token>.service rather than
# mira.service. Apply the same containment to that path: healthy Mira is about 250 MiB on Oracle
# A1, while the 2026-10-03 layout regression reached 8.9 GiB and exhausted the desktop.
MemoryAccounting=yes
MemoryHigh=1G
MemoryMax=1536M
MemorySwapMax=512M
OOMPolicy=stop
