# MoOS: keep one runaway compositor from taking the whole session with it.
#
# MEASURED ON THE LIVE ORACLE A1, 2026-09-06 04:12. The kernel's own OOM process
# table, summed across all 151 processes:
#
#   total anonymous RSS at the kill   10.66 GiB   (the machine has 11.6 GiB)
#   kwin_wayland  pid 1792             6.53 GiB   — 63% of the machine, alone
#   plasmashell                        724 MiB
#   plasma-keyboard                    703 MiB
#   kded6                              591 MiB
#   xdg-desktop-portal-kde             555 MiB
#   kactivitymanagerd                  441 MiB
#
# It was a global OOM, and KWin was not a victim of a cascade — it was the cause
# of one. Over the next three minutes the kernel then killed plasmashell, the
# portal, kded6 and kactivitymanagerd as they ballooned on a broken Wayland
# connection. The entire desktop went down, and on this machine the desktop IS
# the screen: Mo PC Remote is how the owner controls the box.
#
# For comparison, a healthy KWin on the same host, same session type, 6.5 hours
# after boot: 168 MiB, and falling. Normal is under 200 MiB.
#
# WHY MemoryHigh AND NOT MemoryMax. MemoryMax kills. Killing the compositor on
# this machine is turning the monitor off, which is the disaster this file
# exists to prevent — it would automate the exact outcome. MemoryHigh only
# applies reclaim pressure: past the limit the kernel works harder to page the
# cgroup down, the process slows, and it stays alive. A leak becomes a slow
# desktop with a journal entry instead of a dead session with a post-mortem.
#
# WHY 3G. Normal is ~170 MiB, so this is roughly 18x headroom: ordinary use,
# HiDPI, several windows and an active Remote capture never approach it. Nothing
# reaches 3 GiB by working correctly. It is a smoke alarm, not a thermostat.
#
# ManagedOOMPreference=avoid tells systemd-oomd to look elsewhere first. It does
# NOT protect against the kernel's own global OOM killer — that is what took
# KWin down here — so it is a complement to the limit above, never a substitute.
#
# THE TRIGGER IS NOT ESTABLISHED. The leak is not continuous: the current
# compositor has run 6.5 hours at 168 MiB. Reproducing it would mean risking
# another session-wide OOM on the owner's only screen, so it has not been
# reproduced. This guard bounds the damage and gives the next occurrence a
# signal; it is not a fix for a cause nobody has proven yet. See
# PROJECT_STATE.md (S03) before claiming otherwise.
[Service]
MemoryHigh=3G
ManagedOOMPreference=avoid
