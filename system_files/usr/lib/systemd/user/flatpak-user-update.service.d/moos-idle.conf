# Same contract as uupd's: an update nobody asked for right now must never be
# something the person at the keyboard can FEEL. Idle CPU and idle I/O mean it
# runs in the gaps and yields the disk the instant the desktop wants it.
#
# This changes nothing about WHAT is updated — same remotes, same refs, same
# schedule. It changes only what it is allowed to compete with.
[Service]
Nice=19
CPUSchedulingPolicy=idle
IOSchedulingClass=idle
