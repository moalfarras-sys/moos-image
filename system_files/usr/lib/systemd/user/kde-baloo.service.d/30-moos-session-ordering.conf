[Unit]
# plasma-workspace.target wants Baloo and is Before=graphical-session.target.
# Upstream Baloo is After=graphical-session.target. The automatic parent-target
# After=Baloo edge therefore drops the indexer job at login. Dependency lists
# cannot be cleared by a drop-in. Keep upstream's display/idle integration and
# use explicit native user-service safety edges, without the automatic edge.
DefaultDependencies=no
Requires=basic.target dbus.socket
After=basic.target dbus.socket plasma-core.target
Before=shutdown.target
Conflicts=shutdown.target
