# The user-session twin of uupd.service.d/moos-idle.conf, and by the measurement
# it is the bigger of the two.
#
# `systemd-analyze blame --user`, boot of 2026-07-27 on the maintainer's desktop:
#
#   1min 19.073s flatpak-user-update.service   <- the most expensive unit of the SESSION
#         9.650s moos-ensure-brain.service
#         8.515s moai-agent-api.service
#
# Flatpak's shipped timer is `OnBootSec=2m` (plus OnCalendar=04:00, Persistent=true).
# Two minutes after login is precisely when the desktop is still settling — plasmashell
# finishing its containments, the first browser window, kwin warming its shaders — and
# the machine spends the next 79 seconds pulling ostree deltas across the same disk.
# This is the mechanical cause of "MoOS feels slow right after I log in".
#
# 25 minutes is the whole change: past the settling window, still comfortably inside a
# normal session, and the OnCalendar=04:00 + Persistent=true path is untouched, so a
# machine left on overnight still updates on schedule.
#
# The empty assignment first is REQUIRED. systemd timer time values are a LIST: a bare
# `OnBootSec=25min` in a drop-in APPENDS to the vendor's 2m instead of replacing it,
# and the timer then fires at BOTH — i.e. the fix silently does nothing. Verified on
# the live session: with the reset, `systemctl --user show -p TimersMonotonic` reports
# `{ OnBootUSec=25min }` alone; without it, 2min is still in the list.
[Timer]
OnBootSec=
OnBootSec=25min
