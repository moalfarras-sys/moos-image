# Put a ceiling on crash dumps.
#
# THE BUG THIS EXISTS FOR. On 2026-07-13 a single night of GPU crashes (kwin_wayland went
# down when the local brain and a few windows exhausted an 8 GB card) left **4.2 GB** of
# core dumps in /var/lib/systemd/coredump, plus 1.2 GB in ~/.cache/drkonqi, which thrashes
# gdb over every core it is handed. systemd's default MaxUse is 10 % of the filesystem, so
# nothing was ever going to stop it.
#
# This machine's graphics card sits permanently near the edge (the brain holds ~6 GB of 8),
# so crashes here are not a one-off event to be diagnosed once — they recur, and each one
# writes a dump the size of the process that died. A cap turns "the disk filled up
# overnight" back into "the last crash is still on disk", which is the only part anyone
# actually reads.
#
# 1G keeps several recent dumps (a kwin core is ~200-400 MB). KeepFree is the belt: never
# take the last 5 GB of the disk to store a dump of a program that already died.
[Coredump]
MaxUse=1G
KeepFree=5G
