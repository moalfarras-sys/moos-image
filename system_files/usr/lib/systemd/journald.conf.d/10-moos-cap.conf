# Put a ceiling on the journal.
#
# THE BUG THIS EXISTS FOR. systemd's default cap is 10 % of the filesystem — on this
# machine's 475 GB home that is ~47 GB of logs the user never asked for, and the journal
# grows toward it forever. MoOS is a desktop that a single person owns; it does not need
# a month of debug history, and a disk that fills itself is the same failure as a disk
# someone forgot to clean.
#
# 500M is roughly two weeks of this desktop's own logging (measured: ~200 MB in the days
# since the last vacuum), which is more than enough to debug the boot you are standing in
# and the one before it. SystemKeepFree is the second belt: even inside the 500 MB budget,
# never take the last 2 GB of a nearly-full disk.
#
# A drop-in under /usr/lib is the right place: /etc/systemd/journald.conf still outranks
# it, so a user who wants a bigger journal keeps that power.
[Journal]
SystemMaxUse=500M
SystemKeepFree=2G
