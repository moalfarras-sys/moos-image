# MoOS branding for the login screen.
#
# Fedora Kinoite 44 replaced SDDM with plasma-login-manager: `sddm` is NOT installed at all,
# and display-manager.service points at plasmalogin.service. MoOS was still shipping an SDDM
# theme (/usr/share/sddm/themes/moos) and an SDDM config — both dead code, read by
# nobody. The build gate even asserted "Current=moos" in the SDDM config and passed,
# which is how the login screen kept showing Plasma's default wallpaper while every check
# was green.
#
# This is the drop-in directory the IMAGE is supposed to use (/etc is for the admin, and the
# KCM writes there). Keys come from the greeter itself: it exposes WallpaperPluginId, and the
# KCM's config groups are General / Greeter / Wallpaper.
#
# The login screen is the FIRST surface of the running system the user sees, and it is the only
# one no Global Theme can reach: LookAndFeelManager runs inside the user's session, and the
# greeter has already drawn by then. So it does not follow `moos-theme`, and it must be pinned
# here, in the image, by hand.
#
# It was pinned to NovaHorizonII and stayed there through the entire MoOS UI2 rollout: the lock
# screen moved to MoOSUI2Graphite (/etc/xdg/kscreenlockerrc) and this file did not. Booting a
# fully-UI2 system therefore showed the Nova wallpaper at login and the Graphite one a second
# later. No gate caught it because the gate asserted the string "NovaHorizon" — it was holding
# the bug in place. The gate now requires this file and the lock screen to name the SAME UI2
# wallpaper, so the first screen and the desktop cannot drift apart again.
#
# Graphite and not Tide on purpose: the greeter has no light/dark signal to follow, and UI2 Dark
# is the image default.

[Greeter]
# org.moos.ui2.greeter is the MoOS login scene (an in-image Plasma/Wallpaper
# package): the same Graphite wallpaper as the lock screen plus one compact
# corner signature. It intentionally has no particles, shader, orbit, or
# full-screen animation. The greeter must paint the password prompt immediately
# even on software rendering; visual theatre belongs to Plymouth and the
# session splash, not to the security boundary.
WallpaperPluginId=org.moos.ui2.greeter
# Login has one job: ask for the password. Plasma's idle clock page added a
# second state before authentication and occupied the same top-centre space as
# the former animated brand, producing a real clock/logo/date collision at
# 1280x800. The lock screen still owns the clock experience; the login manager
# opens directly on its password form.
ShowClock=false

[Greeter][Wallpaper][org.moos.ui2.greeter][General]
Image=/usr/share/wallpapers/MoOSUI2Graphite/
