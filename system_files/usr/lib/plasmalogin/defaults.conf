# MoOS branding for the login screen — the DISTRO-DEFAULTS slot.
#
# Fedora Kinoite 44 replaced SDDM with plasma-login-manager: `sddm` is NOT installed at all,
# and display-manager.service points at plasmalogin.service. MoOS was still shipping an SDDM
# theme (/usr/share/sddm/themes/moos) and an SDDM config — both dead code, read by
# nobody. The build gate even asserted "Current=moos" in the SDDM config and passed,
# which is how the login screen kept showing Plasma's default wallpaper while every check
# was green.
#
# ── WHICH FILE, AND WHY THIS ONE ─────────────────────────────────────────────────────────
#
# plasma-login-manager's own installed documentation names exactly one distro slot.
# /usr/share/doc/plasma-login-manager/README.md, line 58:
#
#   "The Plasma Login frontend is configured by users through /etc/plasmalogin.conf, which
#    overrides distro-provided defaults at /usr/lib/plasmalogin/defaults.conf. In managed
#    scenarios, the latter file can be modified to set a default wallpaper or login session"
#
# MoOS did not use that slot. It shipped its opinion in an undocumented sibling directory,
# /usr/lib/plasmalogin/plasmalogin.conf.d/, and left the documented file exactly as Fedora's
# kde-settings-plasmalogin package wrote it. That was the weakest place it could have picked.
#
# MEASURED, not assumed (2026-07-27, against the installed image). The greeter
# (/usr/libexec/plasma-login-greeter), the wallpaper process (/usr/bin/plasma-login-wallpaper)
# and the settings module (kcm_plasmalogin.so) all build ONE KConfig out of four sources.
# Disassembling the greeter shows the calls in this order:
#
#   KSharedConfig::openConfig("/etc/plasmalogin.conf")                   <- the main file
#   addConfigSources( *.conf in /etc/plasmalogin.conf.d )
#   addConfigSources( "/usr/lib/plasmalogin/defaults.conf" )
#   addConfigSources( *.conf in /usr/lib/plasmalogin/plasmalogin.conf.d )
#
# and KConfig's own contract (kconfig.h, addConfigSources) is that an EARLIER call wins:
# "The settings in sources will also be overridden by the sources provided by any previous
# calls to addConfigSources()", and every source is in turn "overridden by the source provided
# to the constructor". So the effective precedence, highest first, is:
#
#   1. /etc/plasmalogin.conf                            the administrator's; the KCM writes here
#   2. /etc/plasmalogin.conf.d/*.conf                   the administrator's drop-ins
#   3. /usr/lib/plasmalogin/defaults.conf               <- THIS FILE. The highest layer the IMAGE owns.
#   4. /usr/lib/plasmalogin/plasmalogin.conf.d/*.conf   the LOWEST of all four
#
# MoOS lived in (4) — beneath even stock Fedora's defaults.conf, which is to say the MoOS login
# branding was the weakest opinion on the machine. It only ever reached the screen because the
# stock file happens not to set WallpaperPluginId: it sets `WallpaperPlugin` (no `Id`), a key
# the greeter binary does not contain a single reference to, pointing at
# `file:///usr/share/wallpapers/Fedora/` — a directory build.sh DELETES. One dead key and one
# dangling path, ranked above MoOS. The image now owns this file, so both are gone.
#
# (4) is not dead, and this file does not replace it. /usr/bin/plasmalogin — the DAEMON —
# reads /etc/plasmalogin.conf, /etc/plasmalogin.conf.d and /usr/lib/plasmalogin/plasmalogin.conf.d
# but has no reference to defaults.conf at all: defaults.conf is a FRONTEND slot. So if MoOS
# ever needs a daemon key ([General], [Users], [X11], [Wayland], and never [Autologin]), that
# belongs in a vendor drop-in. Greeter keys belong here, in the documented file, and in exactly
# one place — two files carrying the same greeter value is how the wallpaper drifted before.
#
# ── WHY IT IS PINNED AT ALL ──────────────────────────────────────────────────────────────
#
# The login screen is the FIRST surface of the running system the user sees, and it is the only
# one no Global Theme can reach: LookAndFeelManager runs inside the user's session, and the
# greeter has already drawn by then. So it does not follow `moos-theme`, and it must be pinned
# here, in the image, by hand.
#
# It was pinned to NovaHorizonII and stayed there through the entire MoOS UI2 rollout: the lock
# screen moved to MoOSUI2Graphite (/etc/xdg/kscreenlockerrc) and this setting did not. Booting a
# fully-UI2 system therefore showed the Nova wallpaper at login and the Graphite one a second
# later. No gate caught it because the gate asserted the string "NovaHorizon" — it was holding
# the bug in place. The gate now requires this file and the lock screen to name the SAME UI2
# wallpaper, so the first screen and the desktop cannot drift apart again.
#
# Graphite and not Tide on purpose: the greeter has no light/dark signal to follow, and UI2 Dark
# is the image default.
#
# ── WHAT THIS FILE CANNOT DO, AND WHAT MoOS REACHES BY OTHER MEANS ───────────────────────
#
# There is no theme key. The greeter compiles its own layout into a Qt resource
# (qrc:/qt/qml/org/kde/plasma/login/Main.qml) and exposes exactly the two keys below.
#
# But it is NOT a closed box, and there is a trap in checking whether it is. Its compiled QML
# imports org.kde.breeze.components and instantiates BreezeComponents.Clock, .ActionButton,
# .Battery, .UserList/.UserDelegate and .RejectPasswordAnimation — every one of which MoOS
# overwrites on disk, and which the login screen therefore draws in the MoOS face (build.sh
# drops that module's `prefer` line so the on-disk files win over the copies compiled into
# libcomponents.so). VERIFIED 2026-07-27 by reading the binary's UTF-16 string table.
#
# The trap: `strings /usr/libexec/plasma-login-greeter | grep -i breeze` returns NOTHING, and
# that is not evidence of anything. Qt stores QStringLiteral as UTF-16, which plain `strings`
# skips entirely; `strings -el` is what shows the imports. An audit concluded from the empty
# grep that the breeze components never reach the login screen and that MoOS's ActionButton/
# Clock/UserDelegate were dead code. They are not. Use `strings -el` on this binary.
#
# Genuinely out of MoOS's reach on Plasma 6.7.3: the Main/Login layout itself, the session
# picker (SessionButton.qml) and the keyboard-layout button (KeyboardButton.qml), which live
# inside the binary's resource; and PlasmaExtras.PasswordField, which is stock and follows only
# the colour scheme and Plasma theme the `plasmalogin` account carries.

[Greeter]
# org.moos.ui2.greeter is the MoOS login scene (an in-image Plasma/Wallpaper
# package): the same Graphite wallpaper as the lock screen plus one compact
# corner signature. It intentionally has no particles, shader, orbit, or
# full-screen motion. The greeter must paint the password prompt immediately
# even on software rendering; visual theatre belongs to Plymouth and the
# session splash, not to the security boundary.
WallpaperPluginId=org.moos.ui2.greeter
# Login has one job: ask for the password. This key does not add a clock to the
# password form — it adds a STATE in front of it: the greeter carries its own
# timeout machine (greeterShouldTimeOut / inhibitGreeterTimeout in the compiled
# binary) and the clock page is what it idles into. A security boundary that
# opens on a second layout is the one thing this surface must not do, and the
# lock screen already owns the clock experience wearing the same MoOS face.
#
# Be precise about what this is NOT saying. It is not saying the login clock
# would look foreign: the greeter instantiates BreezeComponents.Clock, and
# /usr/lib64/qt6/qml/org/kde/breeze/components/Clock.qml is MoOS's own file, so
# what it would draw is the MoOS clock. That header still describes the clock as
# "switched back ON" and points at a drop-in path this file replaced; the config
# is the decision and the comment is stale. The trade being made here is about
# the extra pre-authentication state, not about the face. If it is ever
# revisited, this single line and the two gates that pin it are the whole change.
ShowClock=false

[Greeter][Wallpaper][org.moos.ui2.greeter][General]
Image=/usr/share/wallpapers/MoOSUI2Graphite/
