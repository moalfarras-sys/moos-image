# MoOS desktop responsiveness tuning.
#
# The image ships an 8 GB zstd zram swap (see systemd-zram-setup). zram swap is
# RAM-backed and ~an order of magnitude faster than disk, so the kernel default
# vm.swappiness=60 is far too shy: it holds cold anonymous pages in RAM and
# evicts the file cache instead, which is exactly backwards when "swap" is
# compressed RAM. Fedora/ChromeOS raise it hard on zram systems. 150 lets cold
# pages compress into zram and keeps the page cache warm — less RAM pressure,
# no disk hit.
vm.swappiness = 150
# A backgrounded compositor/app should not be able to dirty gigabytes before the
# writeback wakes, which is what causes the periodic desktop stall on large
# copies. Cap dirty pages low so writeback stays continuous and the UI smooth.
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# ── The network half, which is where Mo PC Remote actually lives ──────────────
#
# Everything above tunes how this machine feels to the person sitting at it. The
# four settings below tune how it feels to the person REACHING it — over mobile
# data, over a Tailscale DERP relay, from another country. That is a first-class
# MoOS surface (Mo PC Remote is how the desktop is used from a phone at all), and
# until now it ran on stock Fedora defaults that are tuned for bulk transfer.
#
# Measured on this machine before the change:
#     net.ipv4.tcp_congestion_control = cubic
#     net.ipv4.tcp_notsent_lowat      = 4294967295   (i.e. no limit)

# BBR instead of CUBIC.
#
# CUBIC treats packet loss as the signal to slow down. On a wired LAN loss really
# does mean congestion, so that works. On the links Mo PC Remote is FOR — cellular,
# hotel wifi, a relayed tailnet hop — loss happens for reasons that have nothing to
# do with congestion, and CUBIC halves the window for every one of them. The video
# stream collapses, the auto-quality ladder sees the latency and steps down, and the
# picture degrades because of one lost packet on a link with bandwidth to spare.
#
# BBR models the bottleneck's actual bandwidth and round-trip time instead of
# guessing from loss, so it holds throughput through random loss and — the part that
# matters more here — it paces its sends rather than bursting, which stops it filling
# the deep buffer in the router/modem upstream. A filled buffer is latency: it is the
# difference between a click landing in 40ms and landing in 800ms, on the same link,
# at the same bandwidth. This is the single change with the largest effect on how the
# remote desktop feels from outside the house.
#
# The module ships in the Fedora kernel but is not loaded by default; MoOS loads it
# in modules-load.d/moos-network.conf, which systemd-sysctl.service is ordered After.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# The kernel send buffer was undoing the agent's own latency budget.
#
# StreamSession keeps at most 12 encoded frames (~0.4s) queued for a viewer, and
# drops the whole backlog past that, precisely so the picture can never lag the input
# by more than a fraction of a second. But once a frame is handed to the socket it
# leaves that accounting entirely: with an unlimited notsent_lowat the kernel accepts
# whatever the app writes and parks it in a send buffer that autotunes up to
# wmem_max — 4 MB on this machine. At a typical 4 Mbit/s that is EIGHT SECONDS of
# already-encoded video sitting below the app, invisible to it, guaranteed to be
# drawn late. The agent thinks it sent the frame; the phone gets it eight seconds
# later; every measurement in between says the session is healthy.
#
# tcp_notsent_lowat caps how much UNSENT data the kernel will hold before it stops
# accepting writes, so a saturated link makes SendAsync back up in the app — where
# the 12-frame rule and the 3s frame timeout can actually see it and drop the past
# instead of transmitting it. 128 KB is a deliberately conservative choice: it is
# eight times what Cloudflare runs at their edge, so bulk throughput is unaffected
# (the sender refills long before the window drains), while still being ~1/32 of the
# buffer that was hiding those eight seconds.
net.ipv4.tcp_notsent_lowat = 131072

# Path MTU discovery that survives a tunnel.
#
# Tailscale is WireGuard, and WireGuard's encapsulation makes the usable MTU smaller
# than the 1500 the interfaces claim. The way a sender is supposed to learn that is
# an ICMP "fragmentation needed", and the way a great many home routers, hotel
# captive portals and mobile carriers handle ICMP is to drop it. The result is a
# PMTU black hole: large packets vanish silently, TCP retransmits them unchanged, and
# the connection stalls in a way that looks exactly like a dead link — while ping
# keeps working, because ping is small.
#
# mtu_probing=1 turns on Packetization Layer PMTU Discovery, which needs no ICMP at
# all: after repeated timeouts the kernel probes downward until packets get through.
# It costs nothing on a healthy path (it only engages when a connection is already
# failing) and it is the difference between "the remote desktop does not work on this
# network" and "the remote desktop works on this network".
net.ipv4.tcp_mtu_probing = 1

# A larger ingest queue for the moment a burst arrives.
#
# 1000 is the kernel's decade-old default, sized for 100 Mbit hardware. On a gigabit
# link a burst can overrun it between NAPI polls and the packets are dropped at the
# NIC — which BBR then has to recover from, and which a video stream shows as a
# stutter. 4096 is the ordinary modern desktop value and costs a few hundred KB.
net.core.netdev_max_backlog = 4096

# ── File watching, which runs out silently ────────────────────────────────────
#
# Measured on this machine: 134362 watches and 256 INSTANCES. The instance limit is
# the one that bites first and it is per-user, not per-process — Plasma's device
# notifier, Dolphin, Baloo, every Flatpak portal, every Electron app, every dev
# server with hot reload and every language server takes one. 256 across all of them
# on one desktop session is not a generous budget.
#
# What makes this worth fixing rather than tolerating is HOW it fails. inotify_init
# returns EMFILE — "too many open files" — so the application does not report "the
# system is out of file watches", it reports a nonsense error about file descriptors,
# or more often reports nothing at all and simply stops noticing that files changed.
# A file manager that no longer refreshes, a build that no longer rebuilds, a config
# change that needs a logout: all the same exhausted limit, none of them saying so.
#
# A watch costs ~1 KB of kernel memory and only when it is actually taken, so raising
# the ceiling costs nothing on a machine that does not need it. These are the values
# the major desktop and developer distributions have settled on.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
