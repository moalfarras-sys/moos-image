# MoOS: let assistive technology see Qt and KDE applications.
#
# Qt exposes its accessibility tree through AT-SPI only when the bridge is
# active. QT_ACCESSIBILITY was unset on the live machine (2026-09-06) while
# at-spi-dbus-bus.service was running, so a screen reader could connect to the
# bus and still read nothing from any first-party MoOS app — every one of which
# is Qt/QML: Mo AI, Mo Store, Mo Settings, the Launcher, the greeter.
#
# This is a systemd user-environment drop-in rather than a shell profile because
# the session's services are started by systemd, not by a login shell, and a
# variable a shell exports never reaches them.
QT_ACCESSIBILITY=1
