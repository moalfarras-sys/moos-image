# Migration: older MoOS deployments seeded a persistent Flatpak override that
# exposed all host /etc read-only to Bazaar. /var survives image upgrades, so
# deleting the immutable source alone would leave that permission forever.
# Remove the exact obsolete override on every boot; Bazaar needs no host files
# now that Mo Store owns curation and installs it through the verified backend.
r /var/lib/flatpak/overrides/io.github.kolunmi.Bazaar
