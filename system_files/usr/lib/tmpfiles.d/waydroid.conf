# MoOS: Waydroid's persistent state uses its canonical path on mutable /var.
#
# The waydroid-selinux package labels /var/lib/waydroid as waydroid_data_t.
# Keep that path — moving it to /var/waydroid gives generic var_t/var_lib_t and
# SELinux correctly denies the waydroid_t domain even when Unix mode is 0666.
# Z reapplies the packaged SELinux ownership/mode policy on upgrades and first
# boot; the directory and images remain persistent on the bootc /var volume.
d /var/lib/waydroid 0755 root root -
Z /var/lib/waydroid 0755 root root -
