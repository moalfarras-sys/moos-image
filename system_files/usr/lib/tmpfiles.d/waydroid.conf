# MoOS: Waydroid's data dir lives under /var/lib/waydroid, but /var/lib is a
# read-only OSTree layer — so the container can never write its log or image
# state and the service fails with "Permission denied: /var/lib/waydroid/
# waydroid.log". Give it a writable home on the mutable /var and let the build
# repoint /var/lib/waydroid at it (see build_files/build.sh).
d /var/waydroid 0755 root root -
d /var/waydroid/images 0755 root root -
