# Flatpak sandboxes cannot read the host's GTK4 config, so libadwaita apps —
# including Bazaar, MoOS's own app store — ignored the UI2 palette entirely and
# rendered stock Adwaita blue. This grants every Flatpak read-only access to
# ~/.config/gtk-{3,4}.0, where moos-theme maintains the UI2 @define-color css.
# Same seeding pattern as moos-bazaar-overrides.conf: /var belongs to the
# machine, so the image ships the source under /usr and tmpfiles copies it in
# once (C = copy only when the target does not exist yet).
d /var/lib/flatpak/overrides 0755 root root -
C /var/lib/flatpak/overrides/global - - - - /usr/share/moos/gtk/overrides/global
