# MoOS gaming/compat kernel modules, loaded at boot.
#
# ntsync is the in-kernel Windows NT synchronization primitive (mutexes,
# semaphores, events) that Wine/Proton use to emulate Win32 sync objects. The
# module ships in the Fedora kernel (drivers/misc/ntsync.ko) but is NOT
# auto-probed — without /dev/ntsync, Proton silently falls back to esync/fsync,
# which are slower and eat file descriptors. Loading it here gives every Windows
# game the fast path with zero per-game setup. (binderfs for Waydroid/Android is
# already auto-mounted, so it is not listed here.)
ntsync
