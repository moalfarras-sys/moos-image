# TCP BBR, loaded at boot so the sysctl that selects it cannot lose a race.
#
# sysctl.d/90-moos-desktop.conf sets net.ipv4.tcp_congestion_control = bbr. Writing
# that sysctl does ask the kernel to autoload tcp_bbr, so on a healthy boot this file
# is belt-and-braces — but the failure mode without it is silent and permanent for
# the boot: systemd-sysctl logs one line about an invalid value, the machine stays on
# cubic, and nothing else ever says so. A congestion control algorithm that is
# supposed to be there and is not looks like "the remote is slow again today".
#
# systemd-sysctl.service is ordered After=systemd-modules-load.service, so listing it
# here means the algorithm is registered before anything tries to select it.
#
# Measured before this existed:
#     net.ipv4.tcp_available_congestion_control = reno cubic
# i.e. bbr was not even offered, despite tcp_bbr.ko.xz being present in the image.
tcp_bbr
