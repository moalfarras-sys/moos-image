# MoOS image default console keymap — GERMAN, matching the default xkb layout's
# primary entry in /etc/xdg/kxkbrc (de,ara) and the installer's keymapForLang().
#
# WHY THIS FILE EXISTS IN THE IMAGE: the live ISO boots the image as-is, and
# systemd-localed answers "unset" when nothing ships this file. KWin (Wayland)
# takes its keymap from locale1 — NOT from the shipped kxkbrc — so a live
# session typed US on the owner's German keyboard while the panel indicator
# claimed "DE" (proven in QEMU, 2026-07-16: setting localed flipped the session
# to German instantly). Installed systems overwrite this via moos-firstboot
# from the installer's recipe; the live session needs the default baked in.
KEYMAP=de
