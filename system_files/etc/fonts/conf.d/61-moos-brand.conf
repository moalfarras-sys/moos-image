<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  MoOS brand font fallback.

  UI text: IBM Plex Sans, with IBM Plex Sans Arabic for Arabic script and
  Noto Sans Arabic as the last-resort Arabic fallback.
  Code/terminal: JetBrains Mono for Latin, Kawkab Mono for Arabic.

  The terminal half is the one that was broken. A terminal draws one glyph per
  fixed-width cell, and every Arabic font Fedora ships is proportional — so
  Konsole tore the cursive joins apart and rendered الطرفية as ا ل ط ر ف ي ة,
  a word shattered into loose letters. JetBrains Mono has no Arabic glyphs at
  all, so with no rule here fontconfig fell through to a generic Arabic font
  and an Arabic user could not read their own terminal. Kawkab Mono is drawn to
  connect across a fixed advance; it is the only reason Arabic in Konsole is
  legible.

  The `accept` on the JetBrains Mono alias matters as much as the `monospace`
  prefer: Konsole asks for the family BY NAME (MoOS.profile sets
  Font=JetBrains Mono), so it never resolves the generic `monospace` alias, and
  a rule written only there would never reach the terminal.

  Packages: build_files/build.sh section (c4) — jetbrains-mono-fonts,
  ibm-plex-sans*-fonts, and the digest-pinned Kawkab Mono OFL release.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>IBM Plex Sans</family>
      <family>IBM Plex Sans Arabic</family>
      <family>Noto Sans Arabic</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Kawkab Mono</family>
    </prefer>
  </alias>

  <!-- Anything that asks for JetBrains Mono by name gets Kawkab Mono for the
       glyphs JetBrains Mono does not have — which is all of Arabic.

       This binding MUST stay weak. `accept` appends Kawkab Mono to the family
       list; with binding="strong" that appended family becomes strong-bound and
       outsorts the weakly-bound `monospace` prefer of JetBrains Mono — so
       `fc-match monospace` returned *Kawkab Mono*, and every app that asks for
       the generic `monospace` alias (rather than JetBrains Mono by name) drew
       its Latin text in an Arabic face: thin, oddly-spaced, "not clear". Weak
       binding keeps Kawkab Mono as a glyph-level fallback for the characters
       JetBrains Mono lacks (all of Arabic) without ever winning the family
       sort, so Latin stays JetBrains Mono and Arabic-in-Konsole still joins. -->
  <alias binding="weak">
    <family>JetBrains Mono</family>
    <accept>
      <family>Kawkab Mono</family>
    </accept>
  </alias>
</fontconfig>
