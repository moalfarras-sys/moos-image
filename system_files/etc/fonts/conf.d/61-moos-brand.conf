<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  MoOS brand font fallback (M0 "Nova Seed").
  UI text: IBM Plex Sans, with IBM Plex Sans Arabic for Arabic script and
  Noto Sans Arabic as the last-resort Arabic fallback.
  Code/terminal: JetBrains Mono.
  Packages installed in build_files/build.sh section (c4).
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>IBM Plex Sans</family>
      <family>IBM Plex Sans Arabic</family>
      <family>Noto Sans Arabic</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
    </prefer>
  </alias>
</fontconfig>
