<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- MoOS Meyar: script-aware UI and matched700-unit terminal owners.
     Named aliases are weak: an Arabic fallback must never displace Latin.
     Retain the old named chains for existing personal/editor configurations. -->
<fontconfig>
  <!-- These audited fonts use a Unicode cell grid: combining marks are zero
       cells and wide symbols two. Expose both actual fixed-cell families in
       Qt/KDE's fixed-font chooser; Fontconfig otherwise calls them dual-width.
       This scan metadata never changes any outline, advance or shaping rule. -->
  <match target="scan">
    <test name="family" compare="eq"><string>Meyar Mono</string></test>
    <edit name="spacing" mode="assign"><int>100</int></edit>
  </match>
  <match target="scan">
    <test name="family" compare="eq"><string>Meyar Mono Arabic</string></test>
    <edit name="spacing" mode="assign"><int>100</int></edit>
  </match>
  <alias><family>sans-serif</family><prefer>
    <family>Meyar Sans</family><family>Meyar Arabic</family>
    <family>IBM Plex Sans</family><family>Noto Sans</family>
  </prefer></alias>
  <alias><family>monospace</family><prefer>
    <family>Meyar Mono</family><family>Meyar Mono Arabic</family>
    <family>JetBrains Mono</family><family>Kawkab Mono</family>
  </prefer></alias>
  <alias binding="weak"><family>Meyar Sans</family><accept>
    <family>Meyar Arabic</family><family>Noto Sans</family>
  </accept></alias>
  <alias binding="weak"><family>Meyar Arabic</family><accept>
    <family>Meyar Sans</family><family>Noto Sans</family>
  </accept></alias>
  <alias binding="weak"><family>Meyar Mono</family><accept>
    <family>Meyar Mono Arabic</family><family>Noto Sans Mono</family>
  </accept></alias>
  <alias binding="weak"><family>Meyar Mono Arabic</family><accept>
    <family>Meyar Mono</family><family>Noto Sans Mono</family>
  </accept></alias>
  <alias binding="weak"><family>JetBrains Mono</family><accept>
    <family>Kawkab Mono</family>
  </accept></alias>
  <alias binding="weak"><family>IBM Plex Sans</family><accept>
    <family>IBM Plex Sans Arabic</family>
  </accept></alias>
</fontconfig>
