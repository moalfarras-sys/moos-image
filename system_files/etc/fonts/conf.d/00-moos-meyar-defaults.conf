<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Resolve the requested generic before vendor aliases expand it. Strong
     preferences retain the MoOS default; an explicitly named family still
     comes first, and subsequent user configuration retains its authority. -->
<fontconfig>
  <!-- A request that names no family at all is a generic sans-serif request.
       Chromium/Electron/Skia build their per-locale fallback set from a
       pattern holding only the UI language. 49-sansserif adds sans-serif only
       after these aliases have run, so the language decided alone: measured
       on Oracle 2026-11-18, an English-UI VS Code painted Arabic with PakType
       Naqsh (Urdu), a French set began with Kawkab Mono and an Arabic set with
       Noto Sans Arabic; never Meyar Arabic. qual="all" is true only when the
       pattern has no family value, so every named request is untouched. -->
  <match target="pattern">
    <test qual="all" name="family" compare="eq"><string>moos-no-family-requested</string></test>
    <edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit>
  </match>
  <alias binding="strong"><family>sans-serif</family><prefer>
    <family>Meyar Sans</family><family>Meyar Arabic</family>
  </prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer>
    <family>Meyar Mono</family><family>Meyar Mono Arabic</family>
  </prefer></alias>
</fontconfig>
