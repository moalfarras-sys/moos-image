<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Resolve the requested generic before vendor aliases expand it. Strong
     preferences retain the MoOS default; an explicitly named family still
     comes first, and subsequent user configuration retains its authority. -->
<fontconfig>
  <alias binding="strong"><family>sans-serif</family><prefer>
    <family>Meyar Sans</family><family>Meyar Arabic</family>
  </prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer>
    <family>Meyar Mono</family><family>Meyar Mono Arabic</family>
  </prefer></alias>
</fontconfig>
