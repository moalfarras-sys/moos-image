# MoOS — SDDM configuration (theme + virtual keyboard)
# Theme: /usr/share/sddm/themes/moos-nova (based on SilentSDDM, GPL-3.0)
# InputMethod + GreeterEnvironment are required by SilentSDDM for the
# Qt virtual keyboard (Arabic on-screen input) — see upstream README.

[General]
InputMethod=qtvirtualkeyboard
GreeterEnvironment=QML2_IMPORT_PATH=/usr/share/sddm/themes/moos-nova/components/,QT_IM_MODULE=qtvirtualkeyboard

[Theme]
Current=moos-nova
# NovaIce cursors (build.sh (c6)). Key verified against sddm.conf(5):
# [Theme] CursorTheme = "Name of the cursor theme to be set before starting
# the display server."
CursorTheme=NovaIce
