# MoOS image default keyboard layout — read by systemd-localed, whose locale1
# X11Layout answer is what KWin (Wayland) actually compiles into the session
# keymap. The shipped /etc/xdg/kxkbrc alone does NOT reach a fresh session:
# the live ISO proved it — panel said "DE", typing was English (US), and
# populating localed flipped the session to German immediately (QEMU,
# 2026-07-16). Keep this file's layouts IDENTICAL to kxkbrc's LayoutList;
# a gate enforces the relationship. moos-firstboot rewrites this file on the
# installed system from the installer's answers.
Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        Option "XkbLayout" "de,us,ara"
        Option "XkbOptions" "grp:alt_shift_toggle"
EndSection
