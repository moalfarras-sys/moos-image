# MoOS — pin the KDE xdg-desktop-portal backends while preserving the complete
# KDE session map. /etc wins over the package default at
# /usr/share/xdg-desktop-portal, so omitting a stock route here removes it.
#
# WHY: xdg-desktop-portal-kde derives org.freedesktop.appearance (color-scheme =
# prefer-dark/light AND the exact per-variant accent-color) straight from MoOS's
# kdeglobals. Pinning it here guarantees Chrome, Electron/VS Code, Firefox and
# every Flatpak read the MoOS dark preference + turquoise accent, and that their
# file dialogs stay the MoOS-themed KDE dialog — even if xdg-desktop-portal-gtk
# is ever pulled in as a dependency (whose Settings backend reads gsettings
# accent-color, which MoOS never sets -> it would default to Adwaita blue).
#
# Settings deliberately retains KDE's stock `kde;gtk;` fallback order. Secret
# and Notification retain KWallet and Plasma's notification service; replacing
# this file with only Settings/FileChooser made both interfaces disappear.
[preferred]
default=kde
org.freedesktop.impl.portal.Settings=kde;gtk;
org.freedesktop.impl.portal.Secret=kwallet
org.freedesktop.impl.portal.Notification=plasmanotify
org.freedesktop.impl.portal.FileChooser=kde
