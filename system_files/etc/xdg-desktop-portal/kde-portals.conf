# MoOS — pin the KDE xdg-desktop-portal backend for the appearance + file-chooser
# interfaces. /etc wins over the package default at /usr/share/xdg-desktop-portal.
#
# WHY: xdg-desktop-portal-kde derives org.freedesktop.appearance (color-scheme =
# prefer-dark/light AND the exact per-variant accent-color) straight from MoOS's
# kdeglobals. Pinning it here guarantees Chrome, Electron/VS Code, Firefox and
# every Flatpak read the MoOS dark preference + turquoise accent, and that their
# file dialogs stay the MoOS-themed KDE dialog — even if xdg-desktop-portal-gtk
# is ever pulled in as a dependency (whose Settings backend reads gsettings
# accent-color, which MoOS never sets -> it would default to Adwaita blue).
[preferred]
default=kde
org.freedesktop.impl.portal.Settings=kde
org.freedesktop.impl.portal.FileChooser=kde
