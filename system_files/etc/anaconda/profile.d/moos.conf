# =============================================================================
# MoOS Anaconda profile  ->  installed at /etc/anaconda/profile.d/moos.conf
# =============================================================================
# Fedora 44 Anaconda (rhinstaller/anaconda, main/rawhide; latest release branch
# fedora-43) reads *profile* configs from /etc/anaconda/profile.d/*.conf. This
# is the modern replacement for the old /etc/anaconda/product.d/*.conf mechanism
# (the [Product]/[Base Product] schema was renamed to [Profile] years ago).
# Verified against:
#   - pyanaconda/core/configuration/anaconda.py  (loads /etc/anaconda/profile.d)
#   - pyanaconda/core/configuration/profile.py   ([Profile]/[Profile Detection])
#   - data/profile.d/fedora.conf, fedora-kde.conf, fedora-kinoite.conf
#   - ublue-os/bazzite installer/system_files/shared/etc/anaconda/profile.d/bazzite.conf
#
# NOTE: this file only *selects/inherits* installer behaviour and points at the
# GTK branding stylesheet. It does NOT set the "Install <NAME>" title — that
# string comes from ANACONDA_PRODUCTNAME, which the `liveinst` launcher derives
# from /etc/system-release (see ../../system-release and applications/
# liveinst.desktop). The Web UI (what Fedora KDE/Kinoite actually shows) is
# branded via /usr/share/cockpit/branding/moos/branding.css.
# =============================================================================

[Profile]
# Unique id for this profile.
profile_id = moos
# Inherit Fedora Kinoite's atomic/ostree-appropriate defaults (which in turn
# inherit fedora-kde -> fedora). Shipped by anaconda-live in the live rootfs.
base_profile = fedora-kinoite

[Profile Detection]
# Auto-select this profile when the live environment's os-release has ID=moos
# (MoOS sets ID=moos, ID_LIKE="fedora"). Intentionally NOT matching variant_id
# so every MoOS variant (nova, nova-nvidia, ...) is detected.
os_id = moos

[Network]
default_on_boot = FIRST_WIRED_WITH_LINK

[User Interface]
# GTK fallback branding. Loaded at higher priority than anaconda-gtk.css and
# overrides the .logo/.logo-sidebar/#nav-box placeholders. The GTK path is only
# a fallback: Fedora 44 KDE/Kinoite uses the PatternFly Web UI, branded via the
# cockpit branding CSS referenced above.
custom_stylesheet = /usr/share/anaconda/pixmaps/moos.css

# Live spin: use the full Firefox engine for the Web UI (the Titanoboa
# post-rootfs hook must `dnf install firefox` — see NEEDS-CLAUDE-WIRING).
webui_web_engine = firefox
